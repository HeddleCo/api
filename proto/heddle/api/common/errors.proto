syntax = "proto3";

package heddle.api.common;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "heddle/api/common/contract.proto";

// Stable call outcome vocabulary independent of QUIC or any other concrete
// transport implementation.
enum CallFailureCode {
  CALL_FAILURE_CODE_UNSPECIFIED = 0;
  CALL_FAILURE_CODE_CANCELLED = 1;
  CALL_FAILURE_CODE_UNKNOWN = 2;
  CALL_FAILURE_CODE_INVALID_ARGUMENT = 3;
  CALL_FAILURE_CODE_DEADLINE_EXCEEDED = 4;
  CALL_FAILURE_CODE_NOT_FOUND = 5;
  CALL_FAILURE_CODE_ALREADY_EXISTS = 6;
  CALL_FAILURE_CODE_PERMISSION_DENIED = 7;
  CALL_FAILURE_CODE_RESOURCE_EXHAUSTED = 8;
  CALL_FAILURE_CODE_FAILED_PRECONDITION = 9;
  CALL_FAILURE_CODE_ABORTED = 10;
  CALL_FAILURE_CODE_OUT_OF_RANGE = 11;
  CALL_FAILURE_CODE_UNIMPLEMENTED = 12;
  CALL_FAILURE_CODE_INTERNAL = 13;
  CALL_FAILURE_CODE_UNAVAILABLE = 14;
  CALL_FAILURE_CODE_DATA_LOSS = 15;
  CALL_FAILURE_CODE_UNAUTHENTICATED = 16;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // Authentication (1xx)
  ERROR_REASON_CREDENTIAL_MISSING = 100;
  ERROR_REASON_CREDENTIAL_EXPIRED = 101;
  ERROR_REASON_CREDENTIAL_REVOKED = 102;
  ERROR_REASON_PROOF_INVALID = 103;

  // Authorization (2xx)
  ERROR_REASON_SCOPE_MISSING = 200;
  ERROR_REASON_ROLE_INSUFFICIENT = 201;
  ERROR_REASON_POLICY_DENIED = 202;
  ERROR_REASON_PLAN_LIMIT = 203;
  // AcceptInvitation and DeclineInvitation require a human session, never agent
  // or delegated credentials. PERMISSION_DENIED; field "invitation".
  ERROR_REASON_INVITATION_HUMAN_SESSION_REQUIRED = 204;
  // Accept/Redeem: inviter no longer holds authority to grant the offered role.
  // FAILED_PRECONDITION; field "invitation"; disclose no inviter identity.
  ERROR_REASON_INVITATION_INVITER_AUTHORITY_LOST = 205;

  // Existence (3xx)
  ERROR_REASON_RESOURCE_NOT_FOUND = 300;
  ERROR_REASON_RESOURCE_GONE = 301;
  // CreateInvitation only, after spool administration authorization. The
  // supplied handle has no publicly resolvable claimed account. NOT_FOUND,
  // field "invitation.handle"; no account ID or private lifecycle detail.
  ERROR_REASON_INVITATION_HANDLE_NOT_FOUND = 302;

  // Request validity (4xx)
  ERROR_REASON_FIELD_INVALID = 400;
  ERROR_REASON_FIELD_REQUIRED = 401;
  ERROR_REASON_CHANGE_ID_AMBIGUOUS = 402;
  // PutApprovalGroup.group.member_role / PutReviewPolicy.policy.minimum_role
  // is below the WRITER (Developer) review evaluator eligibility floor.
  // INVALID_ARGUMENT; field identifies the rejected threshold.
  ERROR_REASON_APPROVAL_ROLE_BELOW_ELIGIBILITY_FLOOR = 403;

  // Preconditions & conflicts (5xx)
  ERROR_REASON_LIFECYCLE_STATE = 500;
  ERROR_REASON_OPERATION_ID_REUSED = 501;
  ERROR_REASON_VERSION_CONFLICT = 502;
  ERROR_REASON_ALREADY_EXISTS = 503;
  ERROR_REASON_IMPORT_SOURCE_REQUIRES_COMMIT = 504;
  // CommitImportJob: a sibling holds a selected full ref/target/genesis.
  // ALREADY_EXISTS; destroys prepared key custody; not replay-frozen.
  ERROR_REASON_IMPORT_DESTINATION_CONFLICT = 505;
  // Membership floors, after authorization to manage grants on this spool.
  // FAILED_PRECONDITION; field "grant" for revoke/leave/coverage/ancestry/cascade,
  // "grant.role" for role changes, "grant.expires_at" for expiry changes.
  // Empty resource/context; precedence: personal owner > member > admin.
  // Otherwise retain the existing refusal without disclosing hidden members.
  ERROR_REASON_PERSONAL_SPOOL_OWNER_ACCESS_REQUIRED = 506;
  // The resulting spool would have zero effective live human members.
  ERROR_REASON_SPOOL_LAST_MEMBER = 507;
  // The resulting spool has humans but no effective live ADMINISTRATOR.
  ERROR_REASON_SPOOL_LAST_ADMINISTRATOR = 508;

  // Flow control (6xx). RATE_LIMITED / QUOTA_EXCEEDED are retryable;
  // CURSOR_INVALID is a client-fix (restart from a valid cursor), not retryable.
  ERROR_REASON_RATE_LIMITED = 600;
  ERROR_REASON_QUOTA_EXCEEDED = 601;
  ERROR_REASON_CURSOR_INVALID = 602;

  // Server (9xx)
  ERROR_REASON_TRANSIENT = 900;
  ERROR_REASON_INTERNAL = 901;
  ERROR_REASON_UNIMPLEMENTED = 902;
}

message CallFailure {
  CallFailureCode code = 1;
  string message = 2;
  reserved 3;
  reserved "details";
  ErrorDetail error = 4;
}

message RetryAdvice {
  google.protobuf.Duration retry_after = 1;
}

message ConflictDetail {
  string resource = 1;
  string expected_version = 2;
  string actual_version = 3;
}

message CursorFailure {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_STALE = 1;
    REASON_EXPIRED = 2;
  }
  Reason reason = 1;
  google.protobuf.Timestamp expired_at = 2;
  string restart_cursor = 3;
}

message CapabilityRequirement {
  repeated string capabilities = 1;
}

message PolicyDenial {
  string policy_id = 1;
  string rule = 2;
  bool human_verification_can_override = 3;
  // Present when policy_id is "account_locked_billing". This is the
  // authoritative machine-readable lock status; clients must not parse rule.
  AccountBillingLock billing_lock = 4;
}

// Why an account is restricted to billing recovery and data-removal actions.
enum AccountBillingLockReason {
  ACCOUNT_BILLING_LOCK_REASON_UNSPECIFIED = 0;
  ACCOUNT_BILLING_LOCK_REASON_OVER_FREE_CAP_WITHOUT_PAID_PLAN = 1;
}

// Operations the lock policy still admits for the account owner. This list is
// an affordance projection, not an authorization grant: every call must still
// satisfy its own authentication, proof and authorization contract.
enum AccountBillingLockAllowedAction {
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_UNSPECIFIED = 0;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_SIGN_IN = 1;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_MANAGE_BILLING = 2;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_LIST_SPOOLS = 3;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_DELETE_SPOOL = 4;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_DELETE_ACCOUNT = 5;
  ACCOUNT_BILLING_LOCK_ALLOWED_ACTION_EXPORT_DATA = 6;
}

// Current account billing restriction. used_bytes and cap_bytes are retained
// logical bytes from the same authoritative storage ledger used to apply the
// Free-plan gate; they are decimal byte counts, not physical/object-store size.
message AccountBillingLock {
  AccountBillingLockReason reason = 1;
  google.protobuf.Timestamp locked_at = 2;
  google.protobuf.Timestamp delete_after = 3;
  uint64 used_bytes = 4;
  uint64 cap_bytes = 5;
  repeated AccountBillingLockAllowedAction allowed_actions = 6;
}

// Lossless carrier for an `ErrorDetail.context` arm this client does not know.
//
// Wire contract: when a reader decodes an `ErrorDetail` whose `context` oneof
// arm is not in its compiled vocabulary (a newer server added one), it MUST
// re-encode that arm as `unknown` instead of collapsing it to prose:
//
// * `type_url` follows the Any convention,
//  `type.googleapis.com/heddle.api.common.<MessageName>`.
// * `value` is the encoded message bytes of the unrecognized arm, verbatim.
//
// A reader that DOES know the type decodes `value` and may re-emit the typed
// arm toward newer consumers. This explicit escape hatch exists because
// generated bindings (prost et al.) drop undeclared fields during decode;
// without it, forward details are silently lost on the first hop. The field is
// pass-through only: servers must never originate `unknown`, and clients must
// never invent semantics for a type they do not recognize.
message UnknownDetail {
  // Any-style type URL naming the unrecognized context message.
  string type_url = 1;
  // Encoded bytes of the unrecognized context message.
  bytes value = 2;
}

message AmbiguousChangeIdDetail {
  // The ambiguous change-id prefix supplied by the caller.
  string spec = 1;
  // Canonical full change IDs matching the supplied prefix.
  repeated string candidates = 2;
}

// Stable recovery categories for failures in the invite-gated signup flow.
// This detail is carried only as ErrorDetail.context.signup; callers should
// use this enum rather than matching CallFailure.message text. No email or
// invite code is echoed because those values are secrets or personal data.
// Invite lifecycle reasons must never be returned by ResolveSignupInvite,
// whose anonymous response deliberately collapses failures to EXPIRED.
message SignupFailure {
  enum Reason {
    SIGNUP_FAILURE_REASON_UNSPECIFIED = 0;
    // No invite is assigned to the email proven by the verification token.
    SIGNUP_FAILURE_REASON_INVITE_MISSING = 1;
    // The matching invite was already consumed by a completed registration.
    SIGNUP_FAILURE_REASON_INVITE_CLAIMED = 2;
    // The matching invite was explicitly revoked before registration.
    SIGNUP_FAILURE_REASON_INVITE_REVOKED = 3;
    // The mailbox-verification challenge passed its expiry without use.
    SIGNUP_FAILURE_REASON_VERIFICATION_TOKEN_EXPIRED = 4;
    // The single-use mailbox-verification token was already redeemed.
    SIGNUP_FAILURE_REASON_VERIFICATION_TOKEN_REPLAYED = 5;
    // The only invite-code rejection ClaimSignupInvite may expose. Invalid
    // (including malformed or unknown), consumed, reserved, revoked, and
    // email-bound codes all use this one reason and the identical failure
    // envelope documented on that RPC. No narrower invite lifecycle reason
    // above may be returned by ClaimSignupInvite.
    SIGNUP_FAILURE_REASON_INVITE_UNAVAILABLE = 6;
  }

  Reason reason = 1;
}

message ErrorDetail {
  ErrorReason reason = 1;
  // Canonical path/id the failure is about; empty if none.
  string resource = 2;
  // Request proto field path, for validation failures.
  string field = 3;
  oneof context {
    RetryAdvice retry = 10;
    ConflictDetail conflict = 11;
    CursorFailure cursor = 12;
    CapabilityRequirement capability = 13;
    PolicyDenial policy = 14;
    // A human-verification challenge the caller must satisfy (carried here now
    // that CallFailure dropped the Any details channel).
    HumanVerificationChallenge human_verification = 15;
    AmbiguousChangeIdDetail ambiguous_change_id = 16;
    SignupFailure signup = 17;
    // A terminal streaming-RPC failure, so a mid-stream abort can carry its
    // typed code and message inside the single structured channel. Resume
    // hints (retry-after / restart cursor) stay on the top-level `retry` and
    // `cursor` arms — they apply to the stream as a whole, not to the
    // StreamFailure body, and every reader already understands those arms.
    StreamFailure stream = 18;
    // An `ErrorDetail.context` arm from a newer contract version, preserved
    // losslessly for pass-through. See UnknownDetail for the round-trip
    // contract. Field numbers 16 and 17 are consumed by the published release
    // line; do not reuse them here.
    UnknownDetail unknown = 19;
  }
}

message StreamFailure {
  CallFailureCode code = 1;
  string message = 2;
  reserved 3, 4;
  reserved "retry", "cursor";
  ErrorDetail error = 5;
}
