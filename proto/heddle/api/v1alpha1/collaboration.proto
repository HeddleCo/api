syntax = "proto3";

package heddle.api.v1alpha1;

import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha1/contract.proto";
import "heddle/api/v1alpha1/repository.proto";
import "heddle/api/v1alpha1/state_review.proto";
import "heddle/api/v1alpha1/types.proto";

// Discussion CRUD over the per-state `Discussion` blob.

// Discussion lifecycle filter from the collaboration discussion model.
// UNSPECIFIED selects all discussions, preserving the former empty-string path.
enum DiscussionStatusFilter {
  DISCUSSION_STATUS_FILTER_UNSPECIFIED = 0;
  DISCUSSION_STATUS_FILTER_OPEN = 1;
  DISCUSSION_STATUS_FILTER_RESOLVED = 2;
  DISCUSSION_STATUS_FILTER_ORPHANED = 3;
}

// The subject a discussion is anchored to. Servers return an explicit kind for
// newly stored discussions. UNSPECIFIED preserves the pre-kind contract and is
// interpreted as CODE_ANCHORED when opening or reading a discussion.
enum DiscussionKind {
  DISCUSSION_KIND_UNSPECIFIED = 0;
  // A discussion about a code symbol. This is the existing/default behavior.
  DISCUSSION_KIND_CODE_ANCHORED = 1;
  // A thread-only mailbox for capacity, handoff, and meta-chatter. It is
  // queryable but inert: the discussion never controls or affects work.
  DISCUSSION_KIND_COORDINATION = 2;
  // A discussion imported from an external source (e.g. an adopted repository).
  DISCUSSION_KIND_IMPORTED = 3;
}

// Whether an open discussion is informational or prevents a merge.
enum DiscussionSeverity {
  DISCUSSION_SEVERITY_UNSPECIFIED = 0;
  DISCUSSION_SEVERITY_INFORMATIONAL = 1;
  DISCUSSION_SEVERITY_BLOCKING = 2;
}

message OpenDiscussionRequest {
  RepositoryRef repo_path = 1;
  StateId state_id = 2;
  // Optional only for a thread-only coordination discussion. CODE_ANCHORED
  // (including an unset kind) requires this symbol anchor. COORDINATION
  // requires a non-empty thread_ref and this anchor must be absent.
  optional PathSymbolRef anchor = 3;
  string body = 4;
  // Optional override; empty uses the configured discussion visibility policy.
  string visibility = 5;
  // Optional attachment for a code discussion; the sole subject, and required,
  // for a COORDINATION discussion.
  string thread_ref = 6;
  string client_operation_id = 7;
  // Stable identity paired with `thread_ref`; both are empty when the
  // discussion is not attached to a thread.
  string thread_id = 8;
  DiscussionSeverity severity = 9;
  // UNSPECIFIED preserves the existing CODE_ANCHORED open behavior.
  DiscussionKind kind = 10;
}

message AppendTurnRequest {
  RepositoryRef repo_path = 1;
  string discussion_id = 2;
  string body = 3;
  string client_operation_id = 4;
  // Structured entity mentions spanning ranges of `body`.
  // DiscussionReference is defined in state_review.proto (imported above).
  // CollaborationService is dual-target (DEPLOYMENT_TARGET_WEFT +
  // DEPLOYMENT_TARGET_HEDDLE_DAEMON), so this field lands on the local
  // daemon target too (heddle#1333).
  repeated DiscussionReference references = 5;
}

message ResolveDiscussionRequest {
  RepositoryRef repo_path = 1;
  string discussion_id = 2;
  // The resolution mode is a strict oneof — exactly one of the three
  // shapes lands per request, and each shape carries the fields that
  // are meaningful for it.
  oneof resolution {
    ResolveIntoAnnotation into_annotation = 3;
    ResolveByEdit by_edit = 4;
    ResolveDismissed dismissed = 5;
  }
  string client_operation_id = 6;

  message ResolveIntoAnnotation {
    ContextAnnotationKind kind = 1;
    string content = 2;
    repeated string tags = 3;
  }
  message ResolveByEdit {
    // Optional pin to the state where the resolving edit landed; empty
    // means "use the discussion's anchor state".
    StateId state_id = 1;
  }
  message ResolveDismissed {
    string reason = 1;
  }
}

message Discussion {
  string id = 1;
  // The symbol subject for CODE_ANCHORED; absent for COORDINATION.
  PathSymbolRef anchor = 2;
  StateId opened_against_state = 3;
  google.protobuf.Timestamp opened_at = 4;
  // The sole subject for a COORDINATION discussion.
  string thread_ref = 5;
  repeated DiscussionTurn turns = 6;
  DiscussionResolution resolution = 7;
  bool body_changed_since_open = 8;
  bool orphaned = 9;
  string visibility = 10;
  string resolved_annotation_id = 11;
  // Stable identity paired with `thread_ref`.
  string thread_id = 12;
  // Actual value, no inference. UNSPECIFIED is treated as Informational
  // (non-blocking); BLOCKING makes an open discussion an unmet merge
  // requirement; a Reject sets Blocking.
  DiscussionSeverity severity = 13;
  // UNSPECIFIED on a legacy discussion is interpreted as CODE_ANCHORED.
  DiscussionKind kind = 14;
}

message ListDiscussionsByStateRequest {
  RepositoryRef repo_path = 1;
  StateId state_id = 2;
  // UNSPECIFIED selects all discussions.
  DiscussionStatusFilter status = 3;
  // Zero streams all discussions. A positive value streams at most this many discussions.
  uint32 page_size = 4;
  // Opaque continuation token returned by ListDiscussionsPageEnd.
  string page_token = 5;
}

message ListDiscussionsBySymbolRequest {
  RepositoryRef repo_path = 1;
  PathSymbolRef anchor = 2;
  // UNSPECIFIED selects all discussions.
  DiscussionStatusFilter status = 3;
}

message ListByThreadRefRequest {
  RepositoryRef repo_path = 1;
  string thread_ref = 2;
  // UNSPECIFIED selects all discussions.
  DiscussionStatusFilter status = 3;
  // UNSPECIFIED selects all discussion kinds.
  DiscussionKind kind = 4;
  // Zero returns all discussions. A positive value returns at most this many discussions.
  uint32 page_size = 5;
  // Opaque continuation token returned by ListByThreadRefResponse.
  string page_token = 6;
}

message ListByThreadRefResponse {
  repeated Discussion discussions = 1;
  // Empty when the last page, or the whole unpaged result, was delivered.
  string next_page_token = 2;
}

// Batched discussion-digest read (weft#1397). One call resolves digests and
// counts for every requested state so spool/overview surfaces do not fan out
// per-state ListByState.
message ListDiscussionsByStatesRequest {
  RepositoryRef repo_path = 1;
  repeated StateId state_ids = 2;
  // UNSPECIFIED selects all discussions in each state's digest.
  DiscussionStatusFilter status = 3;
}

// Lightweight per-discussion projection for overview cards. Omits turn
// bodies; clients that need the full thread call GetDiscussion / ListByState.
message DiscussionDigest {
  string id = 1;
  PathSymbolRef anchor = 2;
  StateId opened_against_state = 3;
  google.protobuf.Timestamp opened_at = 4;
  uint32 turn_count = 5;
  bool orphaned = 6;
  bool resolved = 7;
  string visibility = 8;
  string thread_ref = 9;
  string thread_id = 10;
}

message StateDiscussionDigest {
  StateId state_id = 1;
  uint32 discussion_count = 2;
  uint32 open_count = 3;
  uint32 resolved_count = 4;
  uint32 orphaned_count = 5;
  repeated DiscussionDigest discussions = 6;
}

message ListDiscussionsByStatesResponse {
  // One entry per requested state_id, in request order. Unknown or
  // unauthorized states are omitted rather than returning an empty digest,
  // matching the existence-hidden ListByState posture.
  repeated StateDiscussionDigest states = 1;
}

message ListDiscussionsResponse {
  oneof frame {
    Discussion item = 1;
    ListDiscussionsPageEnd page_end = 2;
  }
}

message ListDiscussionsPageEnd {
  // Empty when the last page, or the whole unpaged stream, was delivered.
  string next_page_token = 1;
}

message GetDiscussionRequest {
  RepositoryRef repo_path = 1;
  string discussion_id = 2;
  // Optional: resolve the discussion against this specific state instead of
  // HEAD. Empty = HEAD (the default). Lets a discussion living on a prior
  // state be recovered by id + state without a full cross-state scan.
  StateId state_id = 3;
}

// Live subscription for discussion turns (E5). Rides the same durable
// repo_events spine as RepositoryService/SubscribeRepoEvents — a discussion
// turn surfaces as REPO_EVENT_KIND_DISCUSSION_TURN (repository.proto) — so this
// RPC reuses that cursor rather than inventing a discussion-specific
// causal-frontier cursor (heddle#1585). A client replays turns after
// `after_event_id`, then the stream stays open and delivers new turns live.
message SubscribeDiscussionTurnsRequest {
  RepositoryRef repo_path = 1;
  // Optional thread filter. Empty subscribes to every thread in the repo the
  // caller can read; non-empty narrows to one thread. Paired with `thread_id`
  // (its stable identity) exactly as OpenDiscussion / Discussion carry them.
  string thread_ref = 2;
  string thread_id = 3;
  // Optional narrower filter to a single discussion by id. Empty selects all
  // matching discussions.
  string discussion_id = 4;
  // Optional state-ref filter (empty selects all refs); mirrors the ref-scoped
  // filtering other collaboration reads offer.
  repeated string refs = 5;
  // Optional participant filter by author email; empty selects all authors.
  string participant = 6;
  // Resume cursor on the repo_events spine — the same `event_id` value carried
  // by DiscussionTurnEvent and by SubscribeRepoEventsRequest.after_event_id.
  // The stream replays every matching turn with a larger event_id, then goes
  // live. Zero replays from the start of retained history.
  int64 after_event_id = 7;
}

// One live discussion-turn delivery. Carries the repo_events spine cursor the
// client resumes on (`event_id`) alongside the turn itself; the turn's
// `turn_seq` / `turn_id` give per-discussion ordering and stable identity, and
// author / external_* provenance rides DiscussionTurn (state_review.proto).
message DiscussionTurnEvent {
  // The repo_events spine cursor this turn was delivered at. Pass it back as
  // SubscribeDiscussionTurnsRequest.after_event_id to resume without dupes.
  int64 event_id = 1;
  // The discussion this turn belongs to.
  string discussion_id = 2;
  // The thread the discussion is anchored to, paired with `thread_id`.
  string thread_ref = 3;
  string thread_id = 4;
  // The appended turn, with server-minted turn_seq / turn_id and full
  // provenance.
  DiscussionTurn turn = 5;
}

service CollaborationService {
  option (heddle.api.v1alpha1.service_contract) = {
    deployment_targets: DEPLOYMENT_TARGET_WEFT
    deployment_targets: DEPLOYMENT_TARGET_HEDDLE_DAEMON
    maturity: SERVICE_MATURITY_SHIPPED
  };
  rpc AppendTurn(AppendTurnRequest) returns (Discussion) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_PROOF_OF_POSSESSION
      effect: RPC_EFFECT_DURABLE_WRITE
      retry_behavior: RETRY_BEHAVIOR_CLIENT_OPERATION_ID
      client_operation_id_required: true
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  // Single-discussion fetch by id (state_id empty ⇒ HEAD).
  rpc GetDiscussion(GetDiscussionRequest) returns (Discussion) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_SAFE
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  rpc ListByState(ListDiscussionsByStateRequest) returns (stream ListDiscussionsResponse) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_SAFE
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  rpc ListBySymbol(ListDiscussionsBySymbolRequest) returns (ListDiscussionsResponse) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_SAFE
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  // Lists discussions whose first-class subject is the supplied thread_ref.
  rpc ListByThreadRef(ListByThreadRefRequest) returns (ListByThreadRefResponse) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_SAFE
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  // Batched per-state discussion digests and counts (weft#1397). Unary so a
  // page resolves every thread digest in one read.
  rpc ListDiscussionsByStates(ListDiscussionsByStatesRequest) returns (ListDiscussionsByStatesResponse) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      maturity: SERVICE_MATURITY_PLANNED
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_SAFE
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  rpc OpenDiscussion(OpenDiscussionRequest) returns (Discussion) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_PROOF_OF_POSSESSION
      effect: RPC_EFFECT_DURABLE_WRITE
      retry_behavior: RETRY_BEHAVIOR_CLIENT_OPERATION_ID
      client_operation_id_required: true
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  rpc ResolveDiscussion(ResolveDiscussionRequest) returns (Discussion) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_PROOF_OF_POSSESSION
      effect: RPC_EFFECT_DURABLE_WRITE
      retry_behavior: RETRY_BEHAVIOR_CLIENT_OPERATION_ID
      client_operation_id_required: true
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_WRITER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
  // Live, resumable subscription for discussion turns (E5 "live discussions").
  // Replays turns after the repo_events cursor, then streams new turns as they
  // land — no polling, no dupes. PLANNED: the wire contract is fixed here; the
  // weft server handler (which hardens the repo_events emission path) lands as
  // the next E5 step. Resumable-stream semantics mirror SubscribeRepoEvents.
  rpc SubscribeDiscussionTurns(SubscribeDiscussionTurnsRequest) returns (stream DiscussionTurnEvent) {
    option (heddle.api.v1alpha1.rpc_contract) = {
      maturity: SERVICE_MATURITY_PLANNED
      signing_identity: STABLE_SIGNING_IDENTITY_AUTHENTICATED_PRINCIPAL
      signing_tier: SIGNING_TIER_NONE
      effect: RPC_EFFECT_READ_ONLY
      retry_behavior: RETRY_BEHAVIOR_RESUMABLE_STREAM
      client_operation_id_required: false
      capability: CAPABILITY_AREA_COLLABORATION
      authorization_access: AUTHORIZATION_ACCESS_AUTHENTICATED_PRINCIPAL
      authorization_role: AUTHORIZATION_ROLE_RESOURCE_READER
      authorization_scope_source: AUTHORIZATION_SCOPE_SOURCE_REQUEST_REPOSITORY
      authorization_request_targets: {
        path: "repo_path"
        role: AUTHORIZATION_ROLE_RESOURCE_READER
      }
      authorization_existence: AUTHORIZATION_EXISTENCE_HIDE
    };
  }
}
