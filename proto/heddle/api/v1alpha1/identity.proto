syntax = "proto3";

package heddle.api.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha1/contract.proto";
import "heddle/api/v1alpha1/owner_authorization.proto";
import "heddle/api/v1alpha1/types.proto";

// Session signature domains are a closed registry. Every value below is ASCII
// and versioned. A protocol MUST NOT reuse one domain for another signature
// purpose.
//
//   identity binding:  "heddle-device-binding-v2\0"
//   PoP delegation:    "heddle-pop-delegation-v1\0"
//   GrantEnvelope v2:  "heddle-grant-envelope-v2\0"
//   Tier-1 request:    "heddle-req-sig-v1"
//
// `heddle-req-sig-v1` is the exact deployed value and predates the terminal-NUL
// convention; it MUST NOT acquire a NUL. Any future request-signing migration
// requires a new version and a coordinated producer/verifier cutover. The
// PoP-delegation value mirrors the authoritative constant in Weft's strict
// verified_delegation_chain implementation. The shared Rust and TypeScript API
// packages export the registry values from their signing modules.
//
// Two role labels are likewise exact ASCII strings with terminal NUL bytes:
//
//   "biscuit_authority_public_key\0"
//   "device_proof_public_key\0"
//
// identity_binding_challenge_v2 is the following byte concatenation in this
// fixed order (it is not protobuf-encoded, hashed, hex-encoded, or reordered):
//
//   "heddle-device-binding-v2\0" ||
//   "biscuit_authority_public_key\0" || biscuit_authority_public_key[32] ||
//   "device_proof_public_key\0" || device_proof_public_key[32]
//
// A WebAuthn device-binding assertion uses base64url without padding of those
// exact bytes as clientDataJSON.challenge. Both keys are raw 32-byte Ed25519
// public keys. Consequently the role labels and fixed-length keys are inside
// the challenge committed by the assertion, and swapping the key values
// changes the signed clientDataJSON. No one-key challenge is valid for v2.

// Device-authorization lifecycle from the identity authorization model.
enum DeviceAuthorizationStatus {
  DEVICE_AUTHORIZATION_STATUS_UNSPECIFIED = 0;
  DEVICE_AUTHORIZATION_STATUS_PENDING = 1;
  DEVICE_AUTHORIZATION_STATUS_APPROVED = 2;
  DEVICE_AUTHORIZATION_STATUS_EXPIRED = 3;
}

// Credential categories persisted by the identity credential registry.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_DEVICE = 1;
  CREDENTIAL_KIND_SERVICE_ACCOUNT = 2;
  CREDENTIAL_KIND_AGENT = 3;
  CREDENTIAL_KIND_STAFF = 4;
}

// Shared handle-provider kind from the identity handle registry.
enum HandleKind {
  HANDLE_KIND_UNSPECIFIED = 0;
  HANDLE_KIND_NATIVE = 1;
  HANDLE_KIND_GITHUB = 2;
  HANDLE_KIND_GITLAB = 3;
}

message BeginWebAuthnRegistrationRequest {
  string username = 1;
  string display_name = 2;
  // Adoption path for claiming an agent-created account (api#123 / weft#1357).
  // When any adoption field is set, all four travel together: weft mints the
  // WebAuthn challenge only after verifying `pre_consent_signature` over
  // `(account_id, username, agent_node_id, nonce)` plus, when present, the
  // two trailing counted fields `authorization_hash` and
  // `expires_at_millis`. The counted-statement encoding of those two
  // fields is defined on the fields themselves. This is the ratified
  // pre-consent: it commits the handle and agent authority, and does not bind
  // a credentialId (that id does not exist until WebAuthn create() returns).
  string account_id = 3;
  // Iroh node id of the authorizing agent. Empty on the ordinary
  // verified-signup-email / unattenuated-identity begin paths.
  string agent_node_id = 4;
  // Agent-derived-credential signature over
  // `(account_id, username, agent_node_id, nonce)` plus, when present, the
  // two trailing counted fields `authorization_hash` and
  // `expires_at_millis`. The counted-statement encoding of those two
  // fields is defined on the fields themselves.
  bytes pre_consent_signature = 5;
  // Challenge nonce the pre-consent signature binds. Empty on non-adoption
  // begins.
  bytes nonce = 6;
  // Hex SHA-256 of the claim secret (claim-state id / authorizationHash).
  // In the counted Ed25519 statement this field is the UTF-8 bytes of
  // the lowercase hex SHA-256 of the claim secret (64 hex chars).
  // Do not send uppercase or raw 32-byte digest.
  // Empty on non-adoption and on old clients.
  // Empty hash + 0 is old-client v1; when either this or
  // `expires_at_millis` is set, both must travel together with the existing
  // adoption quartet (`account_id`, `username`, `agent_node_id`, `nonce`).
  string authorization_hash = 7;
  // Consent expiry as Unix millis. On the wire this stays proto `int64`.
  // Inside the counted Ed25519 statement it is
  // exactly 8 big-endian two's-complement bytes of that i64 (`i64::to_be_bytes`).
  // Not decimal text, not protobuf varint.
  // Zero on non-adoption and on old clients.
  // Empty hash + 0 is old-client v1; when either this or
  // `authorization_hash` is set, both must travel together with the
  // existing adoption quartet.
  int64 expires_at_millis = 8;
  // Single-use invite-reservation id the client presents until it is consumed.
  // Authority is the unspent id plus the in-body device-binding proof, NOT a
  // bearer.
  string reservation_id = 9;
  // Single-use verified-email id the client presents until it is consumed.
  // Authority is the unspent id plus the in-body device-binding proof, NOT a
  // bearer.
  string verified_email_id = 10;
}

message RegisterPublicKeyRequest {
  string challenge_id = 1;
  // Raw bytes per WebAuthn (clientDataJSON / attestationObject / authenticatorData
  // / signature are passed verbatim; the WebAuthn lib base64url-decodes them
  // off the wire).
  bytes client_data_json = 2;
  bytes attestation_object = 3;
  string device_label = 4;
  // Raw 32-byte Ed25519 public key the client commits to as the
  // renewal anchor for this device. Distinct from the WebAuthn
  // credential's attested public key (COSE-encoded, lives in
  // `webauthn_credentials`): this key lives in `device_roots`.
  // Leave empty for browser-only flows.
  //
  // When non-empty, MUST be accompanied by a binding signature
  // (see the three `device_binding_*` fields). Closes
  // HeddleCo/weft#131. Legacy one-key input only: after the GrantEnvelope v2
  // cutover a server MUST reject this as a substitute for either role-labelled
  // key below and MUST NOT issue a v1 envelope from it.
  bytes device_public_key = 5 [deprecated = true];
  string client_operation_id = 6;
  // === Device-key binding proof (HeddleCo/weft#131) ===
  // Required when the two v2 role-labelled public keys below are present.
  // The keys and all three proof fields MUST travel together. Together these
  // carry a WebAuthn assertion (`navigator.credentials.get()`
  // produced immediately after `create()` succeeds, signed by the
  // same authenticator) whose clientDataJSON.challenge is base64url without
  // padding of identity_binding_challenge_v2, defined at the top of this file.
  // The server verifies the assertion's signature using the COSE
  // public key extracted from the attestation, then persists the
  // `device_proof_public_key` as the device root. The assertion binds both
  // session roles to the WebAuthn credential; neither role may be omitted or
  // inferred from the other after the v2 cutover. The server MUST resolve the
  // pending `challenge_id` ceremony and verify this assertion against the
  // credential created by that ceremony, including standard
  // `clientDataJSON.type` and origin checks; it MUST NOT accept an assertion
  // from another ceremony.
  bytes device_binding_client_data_json = 7;
  bytes device_binding_authenticator_data = 8;
  bytes device_binding_signature = 9;
  // === Cross-device enrollment attestation (HeddleCo/weft#119) ===
  // Set when this registration is being attested by an already-enrolled
  // device (the OAuth-style localhost-loopback flow), rather than by a
  // fresh WebAuthn `create()` on this device. Both fields are required
  // together; both empty for the ordinary first-device / browser-only flow.
  //
  // `attesting_pubkey` is the raw Ed25519 public key of the existing,
  // already-enrolled device that signed the attestation. The server
  // verifies it chains to a known, non-revoked pubkey for the same
  // identity and rejects unknown/revoked attesters.
  //
  // `cross_device_attestation` is the signature, produced by the key in
  // `attesting_pubkey`, over the enrollment statement
  // `enroll(new_pubkey, scope, expiry, nonce)`. The server enforces the
  // bounded `scope` (read-only vs full), the `expiry` (max 7d on the
  // attestation itself), and one-shot `nonce` (rejects replays). The
  // resulting enrollment of `device_proof_public_key` is permanent until
  // revoked.
  bytes attesting_pubkey = 10;
  bytes cross_device_attestation = 11;
  // Initial owner root installed atomically with this public credential. The
  // root account_uuid MUST equal the stable owner UUID assigned to the
  // registration challenge. Existing registration fields retain their exact
  // meaning; these additive fields are ignored before the owner cutover.
  SignedOwnerRoot owner_root = 12;
  // Fresh proof by owner_root.root.authority_key over
  // SHA-256("heddle-register-owner-root-v1" || challenge_id ||
  //        accepted root-state hash || device_proof_public_key). This binds root
  // possession to this one registration rather than replaying authority_proof.
  AuthorizationSignature owner_root_proof_of_possession = 13;
  // Guardian M-of-N is the default. If omitted, the signed root's guardian
  // policy is selected and must be valid; omission never selects custody.
  // The WEFT 1-of-1 arm requires a recognized warning version and exact digest.
  RegistrationRecoveryPolicy owner_recovery_policy = 14;
  // Proposed self-asserted UUID-to-key binding for the same root. The root
  // proof is verified after every registration check succeeds; no registry
  // attestation or independent release root participates.
  OwnerKeyBinding owner_key_binding = 15;
  // Deferred-human claim transition installed atomically with this
  // registration. Carries the CLAIM_DEFERRED_HUMAN owner-key transition
  // (origin key + next human authority key + every next guardian) that binds
  // the previously deferred owner root to the human claiming it. Ignored
  // before the owner cutover; when present, verified as part of the same
  // ceremony that accepts the registration. This is the additive install
  // point that replaces the pruned ProvisionAgentRootedAccount RPC
  // (api#187 PR-B).
  SignedOwnerKeyTransition claim_deferred_human = 16;
  // Raw 32-byte Ed25519 public key for the ephemeral Biscuit authority role.
  // The corresponding private key signs the client-minted Biscuit authority
  // block. Required together with `device_proof_public_key`; the two public
  // keys MUST be distinct and MUST NOT be inferred from `device_public_key`.
  bytes biscuit_authority_public_key = 17;
  // Raw 32-byte Ed25519 public key for the non-extractable device-proof role.
  // This is the persisted device root, the GrantEnvelope v2 PoP anchor, and
  // the key that signs Tier-1 requests until an explicit pop_delegation moves
  // the effective proof key to a child. Required with
  // `biscuit_authority_public_key` and committed by the binding assertion.
  bytes device_proof_public_key = 18;
  // 64-byte Ed25519 self-PoP over
  // device_key_self_pop_v1_bytes(authority, proof), proving possession of the
  // proof key.
  bytes device_proof_self_pop = 19;
  // 64-byte Ed25519 self-PoP over
  // device_key_self_pop_v1_bytes(authority, proof), proving possession of the
  // authority key.
  bytes biscuit_authority_self_pop = 20;
}

message BeginWebAuthnAuthenticationRequest {
  string username = 1;
}

message FinishWebAuthnAuthenticationRequest {
  // The server MUST resolve this pending ceremony, require `credential_id` to
  // be the credential selected for it, and verify the assertion challenge,
  // `clientDataJSON.type == "webauthn.get"`, and expected origin. An assertion
  // from a different `challenge_id` ceremony MUST be rejected.
  string challenge_id = 1;
  string credential_id = 2;
  bytes client_data_json = 3;
  bytes authenticator_data = 4;
  bytes signature = 5;
  bytes user_handle = 6;
  // Client-side device pubkey the client wants the access token bound
  // to. Server validates this against the user's active device_roots.
  // Legacy one-key input only: after the GrantEnvelope v2 cutover a server
  // MUST reject this as a substitute for either role-labelled key below and
  // MUST NOT issue a v1 envelope from it.
  bytes device_public_key = 7 [deprecated = true];
  string client_operation_id = 8;
  // Raw 32-byte Ed25519 public key for the ephemeral Biscuit authority role.
  // Required together with `device_proof_public_key`; this key verifies the
  // client-minted authority block and never anchors request PoP.
  bytes biscuit_authority_public_key = 9;
  // Raw 32-byte Ed25519 public key for the non-extractable device-proof role.
  // Required together with `biscuit_authority_public_key`; the server validates
  // it against the user's active device roots and places it in GrantEnvelope v2
  // as the initial delegated-PoP and Tier-1 request-signing anchor.
  bytes device_proof_public_key = 10;
  // 64-byte Ed25519 self-PoP over
  // device_key_self_pop_v1_bytes(authority, proof), proving possession of the
  // proof key.
  bytes device_proof_self_pop = 11;
  // 64-byte Ed25519 self-PoP over
  // device_key_self_pop_v1_bytes(authority, proof), proving possession of the
  // authority key.
  bytes biscuit_authority_self_pop = 12;
}

message CreateDeviceAuthorizationRequest {
  string device_name = 1;
  bytes device_public_key = 2;
  string scope = 3;
  string client_operation_id = 4;
}

message ApproveDeviceAuthorizationRequest {
  string user_code = 1;
  string provider = 2;
  string model = 3;
  bool default_agent_policy = 4;
  string client_operation_id = 5;
}

message ExchangeDeviceAuthorizationRequest {
  string device_code = 1;
  bytes device_public_key = 2;
  // Raw signature bytes over `device:{device_code}` using the device key.
  bytes proof = 3;
}

message WaitForDeviceAuthorizationRequest {
  string device_code = 1;
}

message DeviceAuthorizationEvent {
  DeviceAuthorizationStatus status = 1;
}

message RotateCredentialRequest {
  string credential_id = 1;
  bytes public_key = 2;
  string client_operation_id = 3;
  // Proof made by the new credential's Ed25519 private key. The signature is
  // over the 32-byte canonical digest
  // `SHA256("heddle-credential-rotation-v1" || 0x00 ||
  //         u64_be(proof_timestamp_seconds) || 0x00 ||
  //         credential_id || 0x00 || public_key)`.
  // The timestamp is Unix seconds and the signature is 64 raw bytes. The
  // server rejects proofs whose timestamp is outside ±60s of now.
  uint64 proof_timestamp_seconds = 4;
  bytes proof_signature = 5;
}

message RevokeCredentialRequest {
  string credential_id = 1;
  string reason = 2;
  string client_operation_id = 3;
}

message RevokeCredentialResponse {
  bool revoked = 1;
}

message CreateServiceAccountRequest {
  string subject = 1;
  string display_name = 2;
  string scope = 3;
  string client_operation_id = 4;
}

message IssueServiceAccountCredentialRequest {
  string service_account_id = 1;
  bytes public_key = 2;
  string scope = 3;
  // 0 = never expires. Otherwise the credential Biscuit's expiry and
  // the `issued_credentials.expires_at` row are both set to now + ttl_secs.
  google.protobuf.Duration ttl_secs = 4;
  string client_operation_id = 5;
  // Proof made by the service account's currently registered key over the
  // issuance challenge. These were gRPC metadata before the Iroh cutover;
  // keeping them in the request makes retries and signatures transport-neutral.
  int64 proof_timestamp_seconds = 6;
  bytes proof_signature = 7;
}

message AuthChallengeResponse {
  string challenge_id = 1;
  string challenge = 2;
  google.protobuf.Timestamp expires_at = 3;
  string username = 4;
  string rp_id = 5;
  string rp_name = 6;
  string user_id = 7;
  string display_name = 8;
  repeated string allow_credential_ids = 9;
  string attestation = 10;
  string user_verification = 11;
}

message DeviceAuthorizationResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message AccessTokenResponse {
  // The Biscuit (base64url-encoded). Goes in the `heddle_session`
  // cookie for browser flows and in the CLI credentials store for
  // device-bound flows. Empty when weft does not mint; clients mint
  // from the other fields, including `device_id`.
  string token = 1;
  string subject = 2;
  // Unix-seconds expiry. The Biscuit also carries this internally,
  // but exposing it explicitly lets clients know when to renew
  // without parsing the token.
  google.protobuf.Timestamp expires_at = 3;
  // The Biscuit's `session()` fact (also its revocation id). Stable
  // public id surfaced in the Active Sessions UI; argument to
  // `RevokeSession`.
  string session_id = 4;
  repeated string amr = 5;
  // `issued_credentials.id` for tokens minted from a long-lived
  // credential row (device, service-account, agent). Empty for
  // browser sessions.
  string credential_id = 6;
  // Server-signed GrantEnvelope v2 paired with a client-minted Biscuit. It is
  // not owner authority; ordinary spool operations are authorized by the
  // resulting transport Biscuit. The field contains the following byte-exact
  // wire value:
  //
  //   canonical_payload_v2 || signature[64]
  //
  // `signature` is raw Ed25519 and covers every byte of
  // canonical_payload_v2. All integers are big-endian; strings are UTF-8:
  //
  //   bytes     "heddle-grant-envelope-v2\0" (signed domain prefix)
  //   u8       format_version (MUST equal 0x02; this byte is signed)
  //   bytes     "biscuit_authority_public_key\0"
  //   32 bytes  biscuit_authority_public_key
  //   bytes     "device_proof_public_key\0"
  //   32 bytes  device_proof_public_key
  //   u16 + N   subject (N <= 256)
  //   u16       rights_count (<= 64)
  //     repeated in encoded order:
  //       u16 + N kind   (N <= 1024)
  //       u16 + N path   (N <= 1024)
  //       u16 + N action (N <= 1024)
  //   i64       issued_at (Unix seconds)
  //   i64       expires_at (Unix seconds)
  //
  // The exact domain, discriminator, and both role labels are inside the
  // server-signed payload. A parser MUST require the domain, 0x02, both labels
  // in this order, two distinct fixed-length keys, and complete input with no
  // trailing bytes. An issuer MUST reject equal role keys. After cutover a
  // parser MUST reject the one-key v1 envelope; field presence MUST NOT select
  // a version or provide a compatibility fallback.
  //
  // The Biscuit minted under `biscuit_authority_public_key` remains the exact
  // byte prefix of every attenuation. Each ordinary post-authority delegating
  // block appends one verified pop_delegation transition rooted at
  // `device_proof_public_key`; an implementation must never rebuild or replace
  // the original client-minted prefix when attenuating. Tier-1 request signing
  // is leaf-only: after any accepted pop_delegation, only the effective leaf
  // proof key may sign; signatures by ancestor proof keys or by the Biscuit
  // authority key MUST be rejected.
  bytes grant_envelope = 7;
  // Owner-authored purge-only bundle returned without re-signing or
  // reinterpretation. It grants no redact, visibility, or metadata authority.
  OwnerAuthorizationBundle owner_authorization = 8;
  // Persisted `device_roots.id` after RegisterPublicKey. Clients set
  // `MintParams.device_id` from this field without reading Postgres. This
  // is a mint input, not capability: it identifies the device root used
  // when the client mints after weft leaves `token` empty.
  string device_id = 9;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated ActiveSession sessions = 1;
}

message ActiveSession {
  // Public id of the refresh token (matches `auth_refresh_tokens.id`).
  // Used by RevokeSession to identify which row to revoke.
  string id = 1;
  // True for the session this RPC was invoked on, so the UI can
  // mark it "Current" and disable the revoke button (revoking
  // yourself is just logout — the dedicated logout flow handles
  // cookie cleanup correctly).
  bool is_current = 2;
  // Captured at issue time. Surfaced in the device list as a
  // human-readable string ("Chrome on macOS", "Safari on iPhone").
  // The web layer parses to that shape for display; the raw UA
  // header is what's stored.
  string user_agent = 3;
  // Captured at issue time. Empty string when unknown.
  string ip = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Last time this token was rotated (i.e. the user actively used
  // the app from this session). Zero when never rotated.
  google.protobuf.Timestamp last_used_at = 7;
  // Typed purge-only owner evidence associated with this session.
  OwnerAuthorizationBundle owner_authorization = 8;
}

message RevokeSessionRequest {
  // The session id to revoke (from ActiveSession.id).
  string session_id = 1;
  string client_operation_id = 2;
}

// Caller authenticates with their normal session bearer in `CallContext`
// (the same path as every other hosted call). No body fields — the response is purely a function of the
// caller's identity and a fixed 5-minute TTL.
message IssuePresenceTokenRequest {
  string client_operation_id = 1;
}

message IssuePresenceTokenResponse {
  // base64-encoded narrow Biscuit. Embed in the WS upgrade URL as
  // `?token=<this>`. Disposable on the caller's side after the WS
  // connection is established.
  string token = 1;

  // Unix-seconds wall-clock expiry. Always 5 minutes from issue.
  // Surfacing it lets the client know when to re-mint without
  // parsing the token.
  google.protobuf.Timestamp expires_at = 2;
}

// Proof that a user-approved device authorization completed. The
// CLI presents the device_code returned by
// `CreateDeviceAuthorization` plus a signature over `device:{code}`
// using the device keypair generated locally. Server completes the
// hand-off: registers the device_root row if not present, mints a
// fresh Biscuit bound to the device pop key.
message DeviceAuthProof {
  string device_code = 1;
  // Raw Ed25519 public-key bytes. Server stores it on first hand-off
  // (`device_roots` row) and signs subsequent renewals against it.
  bytes device_public_key = 2;
  // Signature over the bytes `device:{device_code}` using the
  // device's private key. Replaces the old proof field on
  // `ExchangeDeviceAuthorizationRequest`.
  bytes signature = 3;
}

// Mint a fresh anonymous Biscuit. Unauthenticated; per-IP
// rate-limited server-side (see `docs/auth/anon-biscuit-spike.md`
// §7.1: 10/hour/IP). When `WEFT_MINT_TURNSTILE_REQUIRED=true` on
// the server, `turnstile_token` MUST be a valid Cloudflare
// Turnstile token; otherwise the field is ignored. See
// HeddleCo/weft#189 and HeddleCo/weft#192.
message MintAnonBiscuitRequest {
  // Cloudflare Turnstile token captured by the caller's frontend.
  // Required when the server has `WEFT_MINT_TURNSTILE_REQUIRED=true`
  // (operator-flippable break-glass under coordinated abuse). Empty
  // / omitted when the flag is off.
  optional string turnstile_token = 1;
  // Opaque long-lived continuity token from the browser's HttpOnly
  // anon-continuity cookie. When present and valid, the server mints
  // the new 24h anon biscuit for the same Anon(uuid) and rotates the
  // continuity token. When absent or invalid, the server creates a
  // fresh anon profile instead.
  string anon_continuity_token = 2;
  string client_operation_id = 3;
}

message MintAnonBiscuitResponse {
  // Raw biscuit bytes carrying `subject_kind("anon")` + a fresh
  // `Anon(uuid)` subject. The caller (tapestry's worker) base64-
  // encodes these for the `weft_auth` cookie value. See
  // `docs/auth/anon-biscuit-spike.md` §3.3 for the cookie shape.
  bytes biscuit = 1;
  // Hard expiry the biscuit was minted with. Same value as the
  // biscuit's internal `expires_at` fact; surfaced so callers can
  // set `Max-Age` on the cookie without parsing the token.
  google.protobuf.Timestamp expires_at = 2;
  // New opaque continuity token for the browser to store separately
  // from the short-lived biscuit. It is not a bearer for normal RPCs;
  // it can only be redeemed at MintAnonBiscuit to recover the same
  // Anon(uuid) after the biscuit cookie expires.
  string anon_continuity_token = 3;
  // Expiry for `anon_continuity_token`.
  google.protobuf.Timestamp continuity_expires_at = 4;
  // Debug/audit surface for the anon profile id the biscuit carries.
  // UI does not need to show this.
  string anon_id = 5;
}

message IssuedCredentialResponse {
  string credential_id = 1;
  string token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string subject = 4;
  optional string provider = 5;
  optional string model = 6;
  optional string device_id = 7;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string subject = 1;
  // True when the bearer carries the operator (staff) marker. This is the
  // Heddle-internal "operator" capability used to gate the intake page,
  // email-template editor, and the global ListActors/ListWorktrees views.
  // Distinct from the namespace-level `Role::Admin` grant that customers
  // hold on their own resources.
  bool is_staff = 2;
  bool is_biscuit = 3;
  string session_id = 4;
  repeated string amr = 5;
  string scope = 6;
  string credential_id = 7;
  optional string device_id = 8;
  optional string agent_provider = 9;
  optional string agent_model = 10;
  string actor_subject = 11;
  bool is_service_account = 12;
  // Resource grants the caller holds directly. Does NOT include inherited
  // roles — those are resolved server-side when enforcing per-RPC checks.
  // Web clients may use `roles` for UI gating but MUST NOT rely on it for
  // authorization decisions.
  repeated ResourceRole roles = 13;
  // Account-level billing entitlement for the caller's subject. Surfaced for
  // UX affordances only — servers enforce the effective plan on the gated
  // RPCs, never the client. Absent (default) ⇒ treat as the free plan.
  Entitlement entitlement = 14;
  // Point-in-time logical storage held by the caller's subject and the
  // allowance for its effective plan. This is retained capacity, not the
  // interval-integrated usage used for billing.
  StorageUsage storage_usage = 15;
  // Owner-root claim status for the caller's subject (api#131). Surfaced for
  // UX affordances only — servers enforce root-gated operations, never the
  // client. Absent (default) ⇒ ROOT_STATUS_UNSPECIFIED.
  RootStatus root_status = 16;
}

// Owner-root claim status for a subject (api#131).
enum RootStatus {
  ROOT_STATUS_UNSPECIFIED = 0;
  // The subject holds a claimed owner root.
  ROOT_STATUS_ROOTED = 1;
  // The subject has no owner root.
  ROOT_STATUS_ROOTLESS = 2;
  // The subject is an agent account whose owner root is not yet claimed.
  ROOT_STATUS_UNCLAIMED_AGENT = 3;
}

// A single role grant held by the caller on a namespace or repository.
message ResourceRole {
  // Visible resource path, e.g. "heddle/core-services" or "heddle".
  string resource_path = 1;
  // "namespace" or "repository".
  string resource_kind = 2;
  // Role name: one of "reader", "developer", "maintainer", "admin", "owner".
  HostedRole role = 3;
}

// Billing plan tier. `product_id → plan` is mapped server-side by weft from
// checked-in, fail-closed config; clients never assert a Plan on writes.
enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_BASIC = 2;
  PLAN_PRO = 3;
  PLAN_ORG = 4;
}

// Subscription lifecycle state, mirroring the provider's authoritative state.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  PAST_DUE = 2;
  CANCELED = 3;
  INCOMPLETE = 4;
}

// The account-level entitlement applied for a subject.
message Entitlement {
  Plan plan = 1;
  SubscriptionStatus status = 2;
  google.protobuf.Timestamp current_period_end = 3;
  // Provider billing cadence copied from the subject's subscription row:
  // "day", "week", "month", or "year".
  optional string billing_interval = 4;
  optional int32 billing_interval_count = 5;
  // ISO 4217 currency code normalized to lowercase.
  optional string currency = 6;
  // Subscription amount in the smallest unit of `currency`.
  optional int64 amount = 7;
  // Opaque provider identifier for server-side subscription operations. This
  // is not a credential or proof of ownership. A server using its organization
  // token MUST re-bind this id to the authenticated subject before mutation.
  optional string provider_subscription_id = 8;
}

// Caller-bound retained-storage projection returned by WhoAmI.
message StorageUsage {
  // Explicit presence: absent means not measured; present zero means the
  // measured usage is genuinely zero (same contract as RefSummary counters).
  optional uint64 current_storage_bytes = 1;
  optional uint64 storage_allowance_bytes = 2;
}

message IntrospectCredentialRequest {
  string credential_id = 1;
}

message CredentialInfo {
  string credential_id = 1;
  string subject = 2;
  CredentialKind kind = 3;
  string scope = 4;
  // Epoch seconds. 0 = never expires.
  google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
  optional string device_id = 7;
  optional string provider = 8;
  optional string model = 9;
  // Epoch seconds, always populated.
  google.protobuf.Timestamp created_at = 10;
  // Epoch seconds. 0 = never used. Touched on every successful Biscuit validation.
  google.protobuf.Timestamp last_used_at = 11;
}

message ServiceAccountResponse {
  string service_account_id = 1;
  string subject = 2;
  string display_name = 3;
  string scope = 4;
}

message RevokeServiceAccountRequest {
  string service_account_id = 1;
  string client_operation_id = 2;
}

message ListServiceAccountsRequest {
  // Zero selects the server default page size; larger requests are clamped
  // to the server maximum (200).
  uint32 page_size = 1;
  // Opaque continuation token returned by a previous next_page_token. Bound
  // to the calling principal's account set; a token minted for another
  // caller is rejected.
  string page_token = 2;
}

message ListServiceAccountsResponse {
  repeated ServiceAccountWithCredentials service_accounts = 1;
  // Empty when the last page was delivered.
  string next_page_token = 2;
}

message ServiceAccountWithCredentials {
  string service_account_id = 1;
  string subject = 2;
  string display_name = 3;
  string scope = 4;
  repeated CredentialInfo credentials = 5;
  bool revoked = 6;
  // Epoch seconds, always populated.
  google.protobuf.Timestamp created_at = 7;
  // Username of the human who created this service account. Empty when
  // the creator's user row has been deleted (ON DELETE SET NULL).
  string created_by_subject = 8;
}

message ListScopeCapabilitiesRequest {}

message ListScopeCapabilitiesResponse {
  repeated ScopeCapability capabilities = 1;
}

message ScopeCapability {
  // Canonical scope token, e.g. "repo:write", "agent:spawn".
  string name = 1;
  // Short human-readable description for the UI reference grid.
  string description = 2;
  // Coarse category for UI grouping: "repo", "thread", "agent", "grant",
  // "namespace", "presence", "admin".
  string category = 3;
}

// ── OAuth identity linking ──────────────────────────────────────────────────

message LinkOAuthIdentityRequest {
  // Which OAuth provider this proof is from. Used by the server to
  // pick the correct ID-token verifier (JWKS for Google/Apple,
  // /user + /user/emails API path for GitHub).
  string provider = 1; // "google" | "apple" | "github"

  // The provider's cryptographic proof of identity.
  //   - Google / Apple: OIDC `id_token` (provider-signed JWT).
  //   - GitHub: OAuth2 access token (server validates via /user +
  //     /user/emails).
  //
  // Server validates this proof and extracts
  // `(sub, email, email_verified)` from the verified result; the
  // request itself carries NO user-identity claims the caller can
  // forge. Closes the OAuth-link forge bypass surfaced on
  // HeddleCo/weft#193 r2 (Codex cid 3294026240); design rationale
  // in the HeddleCo/weft#195 spike amendment.
  oneof oauth_proof {
    string id_token = 2;
    string access_token = 3;
  }

  // OPTIONAL: a fresh WebAuthn assertion proving ownership of the
  // existing user account that this OAuth identity is being
  // attached to. Required only when the OAuth-validated email
  // collides with an existing user (per the email-collision passkey
  // gate, weft spike §4.6); otherwise empty.
  optional bytes webauthn_assertion = 4;
  string client_operation_id = 5;
}

message StoreProviderTokenRequest {
  string provider = 1;
  string access_token = 2;
  string refresh_token = 3;
  string token_scope = 4;
  google.protobuf.Timestamp expires_at = 5;
  string client_operation_id = 6;
}

message StoreProviderTokenResponse {}

message MintGitHubAppSetupChallengeRequest {
  string client_operation_id = 1;
}

message MintGitHubAppSetupChallengeResponse {
  // Opaque challenge id passed as state to the GitHub App install redirect.
  string state = 1;
}

message ListInstallationRepositoriesRequest {
  int64 installation_id = 1;
  // Zero selects the server default page size; larger requests are clamped
  // to the server maximum (200).
  uint32 page_size = 2;
  // Opaque continuation token returned by a previous next_page_token. Bound
  // to the calling principal and installation.
  string page_token = 3;
}

message ListInstallationRepositoriesResponse {
  repeated InstallationRepository repositories = 1;
  // Empty when the last page was delivered.
  string next_page_token = 2;
}

message InstallationRepository {
  int64 id = 1;
  string full_name = 2;
  bool installation_granted = 3;
  // GitHub repository visibility: "public", "private", or "internal".
  string visibility = 4;
  // GitHub repository description; empty when the repo has none.
  string description = 5;
  // GitHub repository default branch name (e.g. "main").
  string default_branch = 6;
  // GitHub HTTPS clone URL.
  string clone_url = 7;
  // GitHub stargazer count at listing time.
  uint64 stargazers_count = 8;
  // GitHub repository size in kilobytes at listing time.
  uint64 size_kb = 9;
}

// Minimal repository projection returned by GitHub's installation-repository
// API. These values are verified server-side and are never ownership claims.
message GitHubInstallationRepository {
  int64 id = 1;
  string full_name = 2;
}

message RegisterGitHubInstallationRequest {
  // GitHub App installation the authenticated caller asks Weft to register.
  // The client-supplied installation_id is not ownership proof: Weft verifies
  // it against the caller's linked GitHub OAuth token before any write.
  int64 installation_id = 1;
  // Idempotency key only. This carries no installation ownership claim.
  string client_operation_id = 2;
}

message RegisterGitHubInstallationResponse {
  int64 installation_id = 1;
  // GitHub account.login for the organization or user that owns the install.
  string account_login = 2;
  // GitHub installation.repository_selection: "all" or "selected".
  string repository_selection = 3;
  // Repositories returned by GitHub for this user-accessible installation.
  repeated GitHubInstallationRepository repositories = 4;
}

// ── Signup-email verification ───────────────────────────────────────────────

// Generic acknowledgement for a syntactically valid challenge request. There
// is deliberately no rejected/no-invite state: challenge acceptance does not
// disclose whether recipient_email has a usable invite.
enum SignupEmailChallengeAcceptanceStatus {
  SIGNUP_EMAIL_CHALLENGE_ACCEPTANCE_STATUS_UNSPECIFIED = 0;
  SIGNUP_EMAIL_CHALLENGE_ACCEPTANCE_STATUS_ACCEPTED = 1;
}

// Service-to-service request to create the pending mailbox-possession
// challenge used by VerifySignupEmail. This request is not a browser API.
message IssueSignupEmailChallengeRequest {
  // Candidate signup handle associated with the challenge for audit and
  // ceremony continuity. This is not an email field and is not rewritten from
  // recipient_email.
  string username = 1;
  // Mailbox to which the authenticated service caller will deliver the proof
  // token. The server canonicalizes this address before storing it in challenge
  // metadata; the client must not infer invite existence from acceptance.
  string recipient_email = 2;
  // Idempotency key scoped to the authenticated service account and this RPC.
  // Reuse with different username or recipient_email must fail.
  string client_operation_id = 3;
}

message IssueSignupEmailChallengeResponse {
  // Always ACCEPTED for a syntactically valid request, independent of invite or
  // account existence. Other outcomes are CallFailure values, not extra states.
  SignupEmailChallengeAcceptanceStatus status = 1;
  // Hard expiry of verification_token and its persisted challenge row.
  google.protobuf.Timestamp expires_at = 2;
  // Single-use mailbox-possession proof for the authenticated Tapestry service
  // caller to deliver out of band. This field exists only on the response of
  // the AUTHENTICATED_SERVICE_ACCOUNT RPC; it must never be returned by a
  // browser-facing endpoint or treated as browser-readable challenge data.
  string verification_token = 3;
}

message VerifySignupEmailRequest {
  // The single-use token emailed to the signup address (opaque to
  // clients — the server validates this against the pending
  // signup_email_verification challenge row).
  string verification_token = 1;
  string client_operation_id = 2;
}

message VerifySignupEmailResponse {
  reserved 1;
  reserved "bootstrap_token";
  // Server-canonicalized address from the redeemed challenge metadata. This is
  // populated only after Weft finds an unused, non-revoked invite for the same
  // address, so a caller may truthfully render "Invite found for <email>" only
  // after this RPC succeeds. It is never copied from a request field.
  string recipient_email = 2;
  // Server-authoritative handle bound to the redeemed signup challenge. Clients
  // use this to prefill and validate the subsequent registration ceremony.
  string bound_handle = 3;
  // Single-use verified-email id the client presents until it is consumed.
  // Authority is the unspent id plus the in-body device-binding proof, NOT a
  // bearer.
  string verified_email_id = 4;
  // Absolute expiry of the single-use verified-email id.
  google.protobuf.Timestamp verified_email_expires_at = 5;
}

// Binds an unassigned shareable invite to an address that has already passed
// VerifySignupEmail. The invite UUID selects the invite; it is never accepted
// as a mailbox-verification token.
message BindSignupInviteEmailRequest {
  // Opaque shareable invite code. Possession selects an invite but does not
  // prove control of recipient_email.
  string invite_code = 1;
  // Address to assign. After canonicalization this must exactly match the
  // signup_bootstrap_email fact in the caller's bootstrap bearer.
  string recipient_email = 2;
  // Idempotency key scoped to the verified bootstrap subject and this RPC.
  // Reuse with different invite_code or recipient_email must fail.
  string client_operation_id = 3;
}

message BindSignupInviteEmailResponse {
  // Canonical address persisted on the invite. Populated only after successful
  // binding; failures use ErrorDetail.context.signup.
  string recipient_email = 1;
}

message CreateSignupInviteRequest {
  // Optional address to bind to the new invite. When present, Weft
  // canonicalizes and persists it using the same binding rules as
  // BindSignupInviteEmail.
  optional string recipient_email = 1;
  // Idempotency key scoped to the authenticated member and this RPC. Reuse
  // with a different recipient_email must fail without spending allowance.
  string client_operation_id = 2;
}

message CreateSignupInviteResponse {
  // Stable server-generated identity of the created invite.
  string invite_id = 1;
  // High-entropy opaque code accepted by ResolveSignupInvite and
  // ClaimSignupInvite.
  string invite_code = 2;
  // Caller-owned invite allowance remaining after this invite is created.
  uint32 allowance_remaining = 3;
}

// Owner-view lifecycle of an invite listed by its creator. Distinct from
// SignupInviteResolutionStatus, which is the public code-resolution
// projection and folds unknown, malformed, and revoked codes into EXPIRED:
// an owner listing always refers to a live row, so it needs only open
// versus consumed.
enum SignupInviteOwnerStatus {
  SIGNUP_INVITE_OWNER_STATUS_UNSPECIFIED = 0;
  SIGNUP_INVITE_OWNER_STATUS_OPEN = 1;
  SIGNUP_INVITE_OWNER_STATUS_CONSUMED = 2;
}

message SignupInviteSummary {
  // High-entropy opaque code (the same value CreateSignupInvite returned).
  string invite_code = 1;
  SignupInviteOwnerStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
  // Consumed state carries no claimer identity anywhere: no claimer handle,
  // subject, or account reference exists on this message or anywhere else in
  // the response. Boolean + timestamp is sufficient to count and credit
  // referrals without disclosing who claimed.
  bool consumed = 4;
  // Present when consumed.
  optional google.protobuf.Timestamp consumed_at = 5;
}

message ListSignupInvitesRequest {
  // Zero selects the server default page size; larger requests are clamped
  // to the server maximum (200).
  uint32 page_size = 1;
  // Opaque continuation token returned by a previous next_page_token. Bound
  // to the calling principal's invite set; a token minted for another
  // caller is rejected.
  string page_token = 2;
}

message ListSignupInvitesResponse {
  repeated SignupInviteSummary invites = 1;
  // Caller-owned allowance remaining, readable without spending an invite.
  uint32 allowance_remaining = 2;
  // Empty when the last page was delivered.
  string next_page_token = 3;
}

// Public lifecycle projection for an invite code supplied by the caller. The
// vocabulary intentionally has no missing/invalid/revoked state: those inputs
// are represented exactly as EXPIRED.
enum SignupInviteResolutionStatus {
  SIGNUP_INVITE_RESOLUTION_STATUS_UNSPECIFIED = 0;
  SIGNUP_INVITE_RESOLUTION_STATUS_VALID = 1;
  SIGNUP_INVITE_RESOLUTION_STATUS_CONSUMED = 2;
  SIGNUP_INVITE_RESOLUTION_STATUS_EXPIRED = 3;
}

message ResolveSignupInviteRequest {
  // High-entropy opaque code from the /join/<code> URL. This is a lookup key,
  // not a VerifySignupEmail verification_token and not mailbox proof.
  string invite_code = 1;
}

message ResolveSignupInviteResponse {
  // VALID and CONSUMED describe a resolved code. EXPIRED also covers unknown,
  // malformed, and revoked codes; UNSPECIFIED must never be returned.
  SignupInviteResolutionStatus status = 1;
  // Inviter's public display handle. For EXPIRED this must be empty, including
  // when a real invite once existed, so invalid and expired serialize alike.
  string inviter_display_handle = 2;
  // Public member ordinal used with inviter_display_handle. Zero for EXPIRED;
  // no inviter subject, email, or other identity field is exposed.
  uint64 inviter_member_ordinal = 3;
  // Canonical invited mailbox for VALID or CONSUMED. Empty for EXPIRED. Seeing
  // this address through a held code does not itself verify mailbox possession.
  string recipient_email = 4;
}

// Selects the next currently available invite code from a public drop. A live
// drop hold makes a code unavailable until held_until; expired holds are
// eligible again without a background reaper.
message ClaimNextDropCodeRequest {
  // URL-safe public drop identifier from /join?drop=<drop_slug>.
  string drop_slug = 1;
  // Opaque channel attribution (for example, "x"). Weft records this on the
  // held invite without interpreting it.
  optional string src = 2;
}

message ClaimNextDropCodeResponse {
  // Opaque invite code to carry into the normal signup-invite ceremony.
  string code = 1;
  // Absolute expiry of this drop assignment. This hold does not consume the
  // invite and is distinct from the signup ceremony's reservation.
  google.protobuf.Timestamp held_until = 2;
}

message RemainingDropCodesRequest {
  // URL-safe public drop identifier from /join?drop=<drop_slug>.
  string drop_slug = 1;
}

message RemainingDropCodesResponse {
  // Codes currently available to hand out. Codes under a live drop hold or a
  // live signup reservation are excluded; expired holds count again. Missing
  // and revoked drops return zero.
  uint32 count = 1;
}

message ClaimSignupInviteRequest {
  // Same high-entropy opaque invite code accepted by ResolveSignupInvite.
  // Possession is the only authorization for this unsigned request. A
  // successful claim atomically reserves the code and is not retryable.
  string invite_code = 1;
}

message ClaimSignupInviteResponse {
  reserved 1;
  reserved "bootstrap_token";
  reserved 2;
  reserved "expires_at";
  reserved 3;
  reserved "allowed_methods";
  reserved 5;
  reserved "session_id";
  // Single-use invite-reservation id the client presents until it is consumed.
  // Authority is the unspent id plus the in-body device-binding proof, NOT a
  // bearer.
  string reservation_id = 4;
  // Reservation TTL clock the client shows and handles.
  google.protobuf.Timestamp reservation_expires_at = 6;
}

// Invite-gated agent-account create (api#123 / weft#1357). Consumes a shared
// #1356 invite and mints an agent-rooted human placeholder: no handle yet, a
// server-generated globally-unique pet name, and a one-time claim token the
// agent prints. This is the ratified pet-name path.
message CreateAgentAccountRequest {
  // Same high-entropy opaque invite code accepted by ResolveSignupInvite.
  // Possession authorizes creating the placeholder account and consumes the
  // invite on the first successful call.
  string invite_code = 1;
  // Raw Ed25519 public key for the creating agent. This field MUST contain
  // exactly 32 bytes. The server MUST reject every other length, and the
  // request proof MUST verify against this key.
  bytes agent_public_key = 2;
  // Idempotency key scoped to this agent key and RPC. Reuse with a different
  // invite_code or agent_public_key must fail.
  string client_operation_id = 3;
}

message CreateAgentAccountResponse {
  reserved 4;
  reserved "claim_token";

  // Stable account identity. Unchanged when PromoteAgentAccount later claims
  // the handle and fills the independent-root slot.
  string account_id = 1;
  // Server-generated globally-unique pet name. The account has no handle
  // until PromoteAgentAccount; uniqueness is enforced at the registry.
  string pet_name = 2;
  // Serialized pre-attenuated capability for the creating agent, bound to
  // agent_public_key. Claiming the account neither revokes nor transforms
  // this capability.
  bytes agent_capability = 3;
  // Hosted server's web origin (its SERVER_WEB_ORIGIN), so the creating agent
  // can mint the human claim link `{web_origin}/claim/{node_id}.{secret}`
  // against the correct origin. Essential for self-hosting where the origin
  // is not app.heddle.sh.
  string web_origin = 5;
}

// Promote-consent half of the agent-account claim ceremony (api#123).
// One call finishes WebAuthn registration, binds credentialId, claims the
// handle, and flips rooting_tier agent_rooted → self_rooted. The ratified
// promote-consent binds `(account_id, handle, credential_id)` plus, when
// present, the two trailing counted fields `authorization_hash` and
// `expires_at_millis` — that is the anti-replay binding, signed after
// WebAuthn create() has produced the id. The counted-statement encoding
// of those two fields is defined on the fields themselves.
message PromoteAgentAccountRequest {
  // Placeholder account being claimed.
  string account_id = 1;
  // Handle chosen at claim time. Replaces the pet name.
  string handle = 2;
  // WebAuthn credentialId of the just-created passkey.
  string credential_id = 3;
  // Challenge minted by the adoption BeginWebAuthnRegistration.
  string challenge_id = 4;
  // Raw WebAuthn create() attestation bytes (verbatim; the lib
  // base64url-decodes them off the wire).
  bytes client_data_json = 5;
  bytes attestation_object = 6;
  // Iroh node id of the authorizing agent.
  string agent_node_id = 7;
  // Agent-derived-credential signature over
  // `(account_id, handle, credential_id)` plus, when present, the two
  // trailing counted fields `authorization_hash` and `expires_at_millis`.
  // The counted-statement encoding of those two fields is defined on the
  // fields themselves.
  bytes promote_consent_signature = 8;
  // Idempotency key scoped to the authorizing agent and this RPC.
  string client_operation_id = 9;
  // Hex SHA-256 of the claim secret (claim-state id / authorizationHash).
  // In the counted Ed25519 statement this field is the UTF-8 bytes of
  // the lowercase hex SHA-256 of the claim secret (64 hex chars).
  // Do not send uppercase or raw 32-byte digest.
  // Empty on non-adoption and on old clients.
  // Empty hash + 0 is old-client v1; when either this or
  // `expires_at_millis` is set, both must travel together with the existing
  // promote triple (`account_id`, `handle`, `credential_id`).
  string authorization_hash = 10;
  // Consent expiry as Unix millis. On the wire this stays proto `int64`.
  // Inside the counted Ed25519 statement it is
  // exactly 8 big-endian two's-complement bytes of that i64 (`i64::to_be_bytes`).
  // Not decimal text, not protobuf varint.
  // Zero on non-adoption and on old clients.
  // Empty hash + 0 is old-client v1; when either this or
  // `authorization_hash` is set, both must travel together with the
  // existing promote triple.
  int64 expires_at_millis = 11;
}

message PromoteAgentAccountResponse {
  // Browser session minted after the atomic promotion. Same shape as
  // RegisterPublicKey / FinishWebAuthnAuthentication.
  AccessTokenResponse session = 1;
  // Canonical textual form of the claimed native handle.
  string canonical_handle = 2;
  // Echo of the promoted account identity.
  string account_id = 3;
}

// ── External diff analysis (for PR review packets) ──────────────────────────

// Public invitation-summary lookup. Never throws — unknown/malformed
// ids return `exists: false, valid: false`.
message GetInvitationSummaryRequest {
  string id = 1;
}

message InvitationSummary {
  bool exists = 1;
  bool valid = 2; // false if revoked, accepted, or expired
  string namespace_path = 3;
  string namespace_name = 4; // may be empty if metadata has no display name
  HostedRole role = 5;
  // Intentionally NO email or invited_by — don't leak PII.
}

// ── Account recovery (E2 self-sovereign-auth, weft#120 §8) ──────────────────
//
// Declaration phase (weft#182) — the generic dispatcher and per-kind requests
// share one response. The persisted substrate is a `recovery_methods` row keyed
// on `(user_id, kind)` with `kind_data jsonb` and `declared_at`. The shared
// per-user veto window lives in the signed owner RecoveryPolicy, not per method.

// Canonical recovery-method kinds. Mirrors the `recovery_methods.kind`
// column. `RECOVERY_METHOD_KIND_UNSPECIFIED` is rejected by the server.
enum RecoveryMethodKind {
  RECOVERY_METHOD_KIND_UNSPECIFIED = 0;
  // Time-locked WebAuthn recovery credential (weft#183).
  RECOVERY_METHOD_KIND_TIME_LOCKED_WEBAUTHN = 1;
  // Social guardians with an M-of-N threshold (weft#185).
  RECOVERY_METHOD_KIND_SOCIAL = 2;
  // Argon2id-hashed paper-code mnemonic (weft#186).
  RECOVERY_METHOD_KIND_PAPER_CODE = 3;
}

// Generic declaration entry point. `kind` selects which `params` variant the
// server reads; the body carries the per-kind material as a oneof arm so a
// caller declares any method through this single endpoint. weft#182.
// Consolidated (owner decision): the former per-kind Declare* RPCs are now
// oneof arms, not standalone RPCs. Retry dedup is carried by the transport
// `client_operation_id` + `rpc_contract.retry_behavior`, replacing the legacy
// per-arm `idempotency_key` option.
message DeclareRecoveryMethodRequest {
  RecoveryMethodKind kind = 1;
  oneof params {
    DeclareHardwareKeyRecoveryParams hardware_key = 2;
    DeclareSocialGuardiansParams social = 3;
    DeclarePaperCodeParams paper_code = 4;
  }
  string client_operation_id = 5;
}

// Shared response for the declaration RPC. `bootstrap_promoted` is true when
// this was the user's first declared method and the server promoted the
// caller's bootstrap-scope Biscuit to full scope (weft#120 §Q2). When a
// promotion occurs, `promoted_token` carries the newly-minted full-scope
// Biscuit; empty otherwise.
message DeclareRecoveryMethodResponse {
  // Stable id of the persisted `recovery_methods` row.
  string method_id = 1;
  RecoveryMethodKind kind = 2;
  google.protobuf.Timestamp declared_at = 3;
  bool bootstrap_promoted = 4;
  string promoted_token = 5;
}

// Register a WebAuthn recovery credential (`kind=time_locked_webauthn`). The
// WebAuthn attestation fields mirror RegisterPublicKeyRequest's first-enroll
// shape — the recovery credential is a distinct authenticator the user
// stashes for the lost-all-devices case. weft#182 §8-2.
message DeclareHardwareKeyRecoveryParams {
  string challenge_id = 1;
  // Raw WebAuthn bytes (verbatim; the lib base64url-decodes off the wire).
  bytes client_data_json = 2;
  bytes attestation_object = 3;
  // Human label for the recovery authenticator ("YubiKey 5C — backup").
  string device_label = 4;
}

// Declare social guardians + an M-of-N threshold (`kind=social`). weft#185.
message DeclareSocialGuardiansParams {
  // The guardian identities the user nominates. Each carries the stable
  // subject plus the guardian's signing pubkey so SubmitRecoveryProof can
  // verify the M-of-N attestation later.
  repeated SocialGuardian guardians = 1;
  // M in "M of N": the number of guardian signatures required to recover.
  // Must satisfy 1 <= threshold <= len(guardians); server rejects otherwise.
  uint32 threshold = 2;
}

// A single nominated guardian.
message SocialGuardian {
  // Stable subject of the guardian's Heddle identity (e.g. "user:…").
  string subject = 1;
  // Raw Ed25519 public key the guardian signs recovery attestations with.
  bytes public_key = 2;
  // Optional human label for the UI ("Alice (sister)").
  string display_name = 3;
}

// Declare a paper-code (mnemonic) recovery method (`kind=paper_code`). The
// plaintext mnemonic is generated client-side and NEVER transmitted — only
// the argon2id verifier, its salt, and the KDF params are sent. The server
// MUST reject any request that carries plaintext mnemonic bytes. weft#186.
message DeclarePaperCodeParams {
  // argon2id(mnemonic, salt, params). Raw hash bytes.
  bytes argon2id_hash = 1;
  // Per-row random salt the client used. Stored so SubmitRecoveryProof can
  // tell the recovering client which salt to hash against.
  bytes salt = 2;
  // KDF params stored alongside the hash so they can be tuned without
  // breaking existing codes. Floor per OWASP: 64 MiB memory, 3 iterations,
  // parallelism 4.
  Argon2idParams params = 3;
}

// argon2id parameters. Stored per paper-code row so the verifier is
// reproducible and the floor can be raised over time.
message Argon2idParams {
  // Memory cost in KiB (OWASP floor: 65536 = 64 MiB).
  uint32 memory_kib = 1;
  // Iteration / time cost (OWASP floor: 3).
  uint32 iterations = 2;
  // Degree of parallelism (OWASP floor: 4).
  uint32 parallelism = 3;
}

// ── Recovery flow (weft#183/#185/#186) ──────────────────────────────────────

// Start a recovery attempt for a username. weft#183 §8-3.
message BeginRecoveryRequest {
  string username = 1;
  // Which declared method the client intends to prove. Lets the server scope
  // the attempt (and the returned window) to the right `recovery_methods`
  // row. Server rejects a kind the user has not declared.
  RecoveryMethodKind kind = 2;
  string client_operation_id = 3;
}

// Salt + KDF params the recovering client uses to argon2id-hash the typed
// mnemonic before SubmitRecoveryProof. Populated on BeginRecovery when
// `kind=paper_code` (declared method material on real attempts; deterministic
// synthetic material on decoy begins for anti-enumeration). weft#186.
message PaperCodeKdfMaterial {
  bytes salt = 1;
  Argon2idParams params = 2;
}

message BeginRecoveryResponse {
  // Stable id of the `recovery_attempts` row. Echoed back on
  // SubmitRecoveryProof / VetoRecovery / CompleteRecovery and named inside
  // the social attestation message to bind signatures to this attempt.
  string recovery_attempt_id = 1;
  // The account's per-user veto window from its signed owner RecoveryPolicy.
  // The same value gates owner-key transitions; absent policy configuration
  // selects the 7-day default (604800 seconds).
  google.protobuf.Duration window_secs = 2;
  // Wall-clock instant at which CompleteRecovery becomes eligible
  // (started_at + window_secs).
  google.protobuf.Timestamp completes_at = 3;
  // Present when BeginRecoveryRequest.kind is paper_code.
  PaperCodeKdfMaterial paper_code_kdf = 4;
}

// Submit proof against the declared method for an in-flight attempt. The
// proof variant must match the attempt's kind. weft#183/#185/#186.
message SubmitRecoveryProofRequest {
  string recovery_attempt_id = 1;
  oneof proof {
    WebAuthnRecoveryProof webauthn = 2;
    SocialRecoveryProof social = 3;
    PaperCodeRecoveryProof paper_code = 4;
  }
  string client_operation_id = 5;
}

// WebAuthn assertion signed by the declared `time_locked_webauthn`
// recovery credential. weft#183.
message WebAuthnRecoveryProof {
  string credential_id = 1;
  bytes client_data_json = 2;
  bytes authenticator_data = 3;
  bytes signature = 4;
  // The fresh device pubkey the recovered identity will be bound to once
  // CompleteRecovery runs the cascade. Raw Ed25519 bytes.
  bytes new_device_public_key = 5;
}

// M-of-N guardian signatures over a recovery attestation. weft#185. Each
// signature is over a canonical message that names `recovery_attempt_id`, so
// the same N signatures cannot be replayed against a different attempt.
message SocialRecoveryProof {
  repeated GuardianSignature signatures = 1;
  // The fresh device pubkey the recovered identity will be bound to. Raw
  // Ed25519 bytes.
  bytes new_device_public_key = 2;
}

message GuardianSignature {
  // Subject of the signing guardian (matches a declared SocialGuardian).
  string guardian_subject = 1;
  // Ed25519 signature over the canonical attestation bytes binding
  // `recovery_attempt_id` (replay-bound to this attempt).
  bytes signature = 2;
}

// argon2id hash of the user-typed mnemonic, computed client-side over the
// stored salt + params. The server compares against the stored verifier in
// constant time. The plaintext mnemonic is NEVER sent. weft#186.
message PaperCodeRecoveryProof {
  // argon2id(typed_mnemonic, stored_salt, stored_params). Raw hash bytes.
  bytes argon2id_hash = 1;
  // The fresh device pubkey the recovered identity will be bound to. Raw
  // Ed25519 bytes.
  bytes new_device_public_key = 2;
}

message SubmitRecoveryProofResponse {
  // True once the proof is accepted and the attempt is awaiting either the
  // window elapse or a veto. CompleteRecovery becomes callable only after
  // both `proof_accepted` is true and the window has elapsed.
  bool proof_accepted = 1;
  // Echoed window deadline so the client can poll/schedule CompleteRecovery.
  google.protobuf.Timestamp completes_at = 2;
}

// Cancel an in-flight recovery attempt from an existing device. weft#183.
message VetoRecoveryRequest {
  string recovery_attempt_id = 1;
  // The veto bearer token surfaced to the user's existing devices by
  // BeginRecovery. Authorizes the cancel; valid only within the window.
  string veto_token = 2;
  string client_operation_id = 3;
}

message VetoRecoveryResponse {
  bool vetoed = 1;
}

// Complete a recovery attempt after the window has elapsed without a veto.
// Runs the credential-revocation cascade and returns an AccessToken bound to
// the new device key from the accepted proof. weft#183 §8-3.
message CompleteRecoveryRequest {
  string recovery_attempt_id = 1;
  string client_operation_id = 2;
}

// ── Handle directory and native-name escrow ────────────────────────────────

// Availability of a native handle after normalization and classification.
// RESERVED represents an explicit policy reservation; implementations MUST NOT
// infer it merely because a name is otherwise unavailable.
enum HandleAvailability {
  // No usable classification was produced. The caller may retry the safe
  // GetHandleStatus read; it MUST NOT infer that a mutation is allowed.
  HANDLE_AVAILABILITY_UNSPECIFIED = 0;
  // No other-owner hold, active native handle, or confusable collision blocks
  // this caller. `held_for_verified_owner = false` means a genuinely free name:
  // a new account claims it through BeginWebAuthnRegistration followed by
  // RegisterPublicKey. `held_for_verified_owner = true` means the caller may
  // own the nonblocking verified-owner hold; ClaimHandle is the authoritative
  // self-claim check.
  HANDLE_AVAILABILITY_AVAILABLE = 1;
  // A verified-owner hold for another subject blocks this caller. The only
  // mutation offered to the caller is RequestHeldName, which starts the
  // right-of-first-refusal window without exposing the owner.
  HANDLE_AVAILABILITY_HELD = 2;
  // An active native handle already owns this name. ResolveHandle can read the
  // public subject-free projection; no claim or escrow mutation is available.
  HANDLE_AVAILABILITY_TAKEN = 3;
  // Explicit policy reservation. No handle mutation is available for this
  // candidate; choose another candidate and call GetHandleStatus again.
  HANDLE_AVAILABILITY_RESERVED = 4;
  // The candidate conflicts with a trust-bearing handle under the confusable
  // classifier, so no free-name registration mutation is available; choose
  // another candidate and call GetHandleStatus again. ClaimHandle remains only
  // for a previously earned caller-owned verified-owner hold and is the
  // authoritative check for that hidden ownership fact.
  HANDLE_AVAILABILITY_CONFUSABLE = 5;
}

message GetHandleStatusRequest {
  string name = 1;
}

message GetHandleStatusResponse {
  HandleAvailability availability = 1;
  // True whenever the normalized name has an active verified-owner hold. A
  // blocking other-owner hold reports HELD; a nonblocking caller-owned hold
  // reports AVAILABLE, but ClaimHandle remains the authoritative ownership
  // check. The response MUST NOT expose the holder subject.
  bool held_for_verified_owner = 2;
}

message RequestHeldNameRequest {
  string name = 1;
  // Stable retry key in the namespace of the authenticated subject and this
  // RPC. A retry with the same authenticated subject, RPC, and client_operation_id
  // and normalized name returns the same response without repeating the mutation.
  // Key reuse with a different normalized name MUST fail with FAILED_PRECONDITION.
  string client_operation_id = 2;
}

message RequestHeldNameResponse {
  // Deadline of the right-of-first-refusal window. The current implementation
  // creates a 30-day window.
  google.protobuf.Timestamp rfr_deadline = 1;
}

message ClaimHandleRequest {
  string name = 1;
  // Stable retry key in the namespace of the authenticated subject and this
  // RPC. A retry with the same authenticated subject, RPC, and client_operation_id
  // and normalized name returns the same response without repeating the mutation.
  // Key reuse with a different normalized name MUST fail with FAILED_PRECONDITION.
  string client_operation_id = 2;
}

message ClaimHandleResponse {
  bool claimed = 1;
  // Canonical textual form of the claimed native handle.
  string canonical_handle = 2;
}

message ResolveHandleRequest {
  // Canonical handle text, a bare native name, or the legacy subject-route
  // form, for example `gh:torvalds`, `torvalds`, or `/u:user:<uuid>`.
  // Implementations MUST preserve `/u:<subject>` request lookup compatibility;
  // the response remains the subject-free HandlePrincipal projection.
  string name = 1;
}

// Subject-free handle-directory projection. ResolveHandle requires a valid
// bearer, but there is deliberately no subject field: resolving a name MUST NOT
// expose an underlying subject. `primary_handle` is the canonical URL/display
// token for the active principal.
message HandlePrincipal {
  // Legacy ResolvedPrincipal.subject occupied tag 1. Reserving both its tag and
  // name prevents legacy response bytes from decoding into any public field.
  reserved 1;
  reserved "subject";
  string display_name = 2;
  string handle = 3;
  bool resolved = 4;
  string primary_handle = 5;
  HandleKind kind = 6;
  bool verified = 7;
  string discriminator = 8;
}

message ResolveHandleResponse {
  // Populated for an active name. Absent for a tombstoned name.
  optional HandlePrincipal principal = 1;
  // True when the name existed but was renamed away. Never-claimed names
  // return NOT_FOUND instead of this response.
  bool tombstoned = 2;
}

service IdentityService {
  option (heddle.api.v1alpha1.service_contract) = {
    deployment_targets: DEPLOYMENT_TARGET_WEFT
