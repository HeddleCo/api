syntax = "proto3";

package heddle.api.v1alpha1;

import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha1/contract.proto";
import "heddle/api/v1alpha1/registry.proto";
import "heddle/api/v1alpha1/types.proto";

// Typed thread lifecycle state, mirroring `repo::ThreadState`
// (`heddle/repo/src/thread_model.rs`). Wrapper message namespaces the enum.
message ThreadState {
  enum Kind {
    THREAD_STATE_UNSPECIFIED = 0;
    THREAD_STATE_DRAFT = 1;
    THREAD_STATE_ACTIVE = 2;
    THREAD_STATE_READY = 3;
    THREAD_STATE_BLOCKED = 4;
    THREAD_STATE_MERGED = 5;
    THREAD_STATE_ABANDONED = 6;
    THREAD_STATE_PROMOTED = 7;
  }
}

// Thread materialization mode from `heddle/repo/src/thread_model.rs`.
enum ThreadMode {
  THREAD_MODE_UNSPECIFIED = 0;
  THREAD_MODE_MATERIALIZED = 1;
  THREAD_MODE_VIRTUALIZED = 2;
  THREAD_MODE_SOLID = 3;
}

// Thread freshness vocabulary from `heddle/repo/src/thread_model.rs`.
enum ThreadFreshness {
  THREAD_FRESHNESS_UNSPECIFIED = 0;
  THREAD_FRESHNESS_CURRENT = 1;
  THREAD_FRESHNESS_STALE = 2;
  THREAD_FRESHNESS_UNKNOWN = 3;
  THREAD_FRESHNESS_NOT_CHECKED = 4;
}

// Coordination result emitted by the Heddle thread coordinator.
enum CoordinationStatus {
  COORDINATION_STATUS_UNSPECIFIED = 0;
  COORDINATION_STATUS_CLEAN = 1;
  COORDINATION_STATUS_AHEAD = 2;
  COORDINATION_STATUS_DIVERGED = 3;
  COORDINATION_STATUS_BLOCKED = 4;
  COORDINATION_STATUS_MERGE_READY = 5;
}

// Integration-policy evaluation state emitted by the Heddle workflow model.
enum IntegrationPolicyStatus {
  INTEGRATION_POLICY_STATUS_UNSPECIFIED = 0;
  INTEGRATION_POLICY_STATUS_PREVIEWED = 1;
  INTEGRATION_POLICY_STATUS_CURRENT = 2;
  INTEGRATION_POLICY_STATUS_BLOCKED = 3;
  INTEGRATION_POLICY_STATUS_MANUAL_RESOLVED = 4;
  INTEGRATION_POLICY_STATUS_AUTO_INTEGRATED = 5;
}

// Confidence band emitted by the Heddle workflow confidence model.
enum ConfidenceBand {
  CONFIDENCE_BAND_UNSPECIFIED = 0;
  CONFIDENCE_BAND_LOW = 1;
  CONFIDENCE_BAND_MEDIUM = 2;
  CONFIDENCE_BAND_HIGH = 3;
}

message ThreadSummary {
  reserved 14;

  // Renameable human-facing thread ref.
  string name = 1;
  optional StateId base_state = 2;
  optional StateId current_state = 3;
  optional string path = 4;
  optional string provider = 5;
  optional string model = 6;
  CoordinationStatus coordination_status = 7;
  bool is_current = 8;
  bool is_isolated = 9;
  optional string target_thread = 10;
  optional string parent_thread = 11;
  optional string task = 12;
  ThreadMode thread_mode = 13;
  ThreadFreshness freshness = 15;
  ThreadVerificationSummary verification_summary = 16;
  ThreadConfidenceSummary confidence_summary = 17;
  ThreadIntegrationPolicy integration_policy_result = 18;
  optional string harness = 19;
  optional string thinking_level = 20;
  UsageSummary usage_summary = 21;
  optional google.protobuf.Timestamp last_progress_at = 22;
  optional StateId report_flush_state = 23;
  optional string heddle_session_id = 24;
  optional string attach_reason = 25;
  optional string native_actor_key = 26;
  optional string native_parent_actor_key = 27;
  optional string probe_source = 28;
  optional float probe_confidence = 29;
  optional string recommended_action = 30;
  repeated string blockers = 31;
  optional string thread_health = 32;
  bool promotion_suggested = 33;
  repeated string child_threads = 34;
  uint32 stack_depth = 35;
  optional google.protobuf.Timestamp last_activity_at = 36;
  optional string visibility = 37;
  repeated string changed_paths = 38;
  repeated string impact_categories = 39;
  repeated string heavy_impact_paths = 40;
  optional string reason = 41; // +weft#469: abandonment/learning payload ("why")
  optional string superseded_by = 42; // +weft#469: the successor attempt that replaced this thread
  repeated string supersedes = 43; // +weft#469: prior attempts this thread replaces
  // Typed lifecycle field from `heddle/repo/src/thread_model.rs`; legacy tag 14
  // is retired in favor of the typed field introduced at tag 44.
  ThreadState.Kind thread_state = 44;
  // Stable opaque server-assigned identity. REQUIRED and immutable for the
  // lifetime of the thread. This is not a per-repository sequence number.
  string thread_id = 45;
  // Stable identities paired with the renameable relationship refs above.
  optional string target_thread_id = 46;
  optional string parent_thread_id = 47;
  // Positional peer of `child_threads`; both lists have the same length.
  repeated string child_thread_ids = 48;
  optional string superseded_by_thread_id = 49;
  // Positional peer of `supersedes`; both lists have the same length.
  repeated string supersedes_thread_ids = 50;
}

message ThreadVerificationSummary {
  optional bool tests_passed = 1;
  uint32 tests_failed = 2;
  optional float coverage_pct = 3;
  optional uint32 lint_warnings = 4;
}

message ThreadConfidenceSummary {
  optional float value = 1;
  ConfidenceBand band = 2;
}

message ThreadIntegrationPolicy {
  IntegrationPolicyStatus status = 1;
  string reason = 2;
}

message ThreadMetadata {
  // Renameable human-facing thread ref.
  string name = 1;
  optional string target_thread = 2;
  optional string parent_thread = 3;
  optional string task = 4;
  ThreadMode thread_mode = 5;
  ThreadState.Kind thread_state = 6;
  ThreadFreshness freshness = 7;
  StateId base_state = 8;
  bytes base_root = 9;
  optional StateId current_state = 10;
  optional StateId merged_state = 11;
  repeated string changed_paths = 12;
  repeated string impact_categories = 13;
  repeated string heavy_impact_paths = 14;
  bool promotion_suggested = 15;
  ThreadVerificationSummary verification_summary = 16;
  ThreadConfidenceSummary confidence_summary = 17;
  ThreadIntegrationPolicy integration_policy_result = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  // Stable opaque server-assigned identity. On create, the client leaves this
  // empty and the server assigns it; subsequent metadata MUST carry it.
  string thread_id = 21;
  optional string target_thread_id = 22;
  optional string parent_thread_id = 23;
}

message ListThreadsRequest {
  RepositoryRef repo_path = 1;
  // Zero streams all threads. A positive value streams at most this many threads.
  uint32 page_size = 2;
  // Opaque continuation token returned by ListThreadsPageEnd.
  string page_token = 3;
  // Empty selects all thread lifecycle states.
  repeated ThreadState.Kind states = 4;
  // Free-text search over thread name/title. Empty disables text filtering.
  string query = 5;
  // UNSPECIFIED is treated as LAST_ACTIVITY_DESC.
  ThreadOrder order = 6;
}

enum ThreadOrder {
  THREAD_ORDER_UNSPECIFIED = 0;
  // Most-recently-active first, ordered by ThreadSummary.last_activity_at.
  THREAD_ORDER_LAST_ACTIVITY_DESC = 1;
  THREAD_ORDER_NAME_ASC = 2;
}

message ListThreadsResponse {
  oneof frame {
    ThreadListItem item = 1;
    ListThreadsPageEnd page_end = 2;
  }
}

// Compact status and identity projection for thread-list rows. Fetch the full
// ThreadSummary through GetThread when detail is needed.
//
// Field selection is driven by list consumers (notably loadTasksView), not by
// mirroring every cheap ThreadSummary field. Do not re-add freshness,
// current_state, or changed_paths without a concrete reader: changed_paths is
// an unbounded repeated that regresses the streamed-list frame-size goal.
//
// Hosted-empty today (CLI may populate; hosted registry leaves unset so the
// next slim must not treat these as free list-row candidates):
//   - thread_health
message ThreadListItem {
  // Stable opaque server-assigned identity.
  string thread_id = 1;
  // Renameable human-facing thread ref/title.
  string name = 2;
  ThreadState.Kind thread_state = 3;
  // Grounds LAST_ACTIVITY_DESC ordering and renders row recency.
  optional google.protobuf.Timestamp last_activity_at = 4;
  // Stable identity of the thread's target, when one is configured.
  optional string target_thread_id = 5;
  // Compact server-computed status/health rollup for the row.
  // Hosted-empty today: the hosted ListThreads projection leaves this unset;
  // CLI implementations may populate it. Keep the field (consumer-read, free
  // when absent) rather than removing it for a formal break with no wire win.
  optional string thread_health = 6;
  // Human-facing task/title text. Same name/type as ThreadSummary.task so
  // mappers project 1:1 from the widened list row.
  optional string task = 7;
  // Base revision the thread is relative to. Same name/type as
  // ThreadSummary.base_state.
  optional StateId base_state = 8;
  // Renameable human-facing parent thread ref. Same name/type as
  // ThreadSummary.parent_thread (not parent_thread_id).
  optional string parent_thread = 9;
}

message ListThreadsPageEnd {
  // Empty when the last page, or the whole unpaged stream, was delivered.
  string next_page_token = 1;
  // Total threads matching states/query before pagination; present on the first page end only.
  optional uint32 total_count = 2;
}

message GetWorkspaceSummaryRequest {
  RepositoryRef repo_path = 1;
}

message GetThreadRequest {
  RepositoryRef repo_path = 1;
  // Renameable ref retained for human-facing routing and display. It may be
  // stale after a rename; `thread_id` is authoritative.
  string name = 2;
  // Stable server-assigned identity used for lookup. Both fields are REQUIRED.
  string thread_id = 3;
}

message WorkspaceThreadGroup {
  string id = 1;
  string label = 2;
  repeated ThreadSummary threads = 3;
}

message WorkspaceSummary {
  RepositoryRef repo_path = 1;
  optional string current_thread = 2;
  repeated WorkspaceThreadGroup groups = 3;
  uint32 thread_count = 4;
  // Present exactly when `current_thread` is present.
  optional string current_thread_id = 5;
}

// One member of a transactional stacked-land set. The thread's target and
// changed paths are server-derived from its current topology and state.
message LandStackMember {
  RepositoryRef repo_path = 1;
  // Renameable human-facing thread ref, paired with authoritative thread_id.
  string thread = 2;
  // Exact head state to gate and land. A changed head makes the request stale.
  StateId source_state = 3;
  // Stable server-assigned identity. Both thread and thread_id are REQUIRED.
  string thread_id = 4;
}

message LandStackRequest {
  // A set of members, not an apply order. The server topo-sorts the set from
  // ThreadSummary.parent_thread and applies it bottom-up; callers MUST NOT
  // pre-order members.
  //
  // v1 requires every member to resolve to one spool. Cross-spool stacked land
  // (including separate audit chains) is deliberately deferred to a later
  // capability. Keeping repo_path on each member lets that capability be added
  // without changing this request signature.
  repeated LandStackMember members = 1;
  string client_operation_id = 2;
}

enum LandStackOutcome {
  LAND_STACK_OUTCOME_UNSPECIFIED = 0;
  // Every requested member was durably landed in one atomic commit.
  LAND_STACK_OUTCOME_COMMITTED = 1;
  // No requested member was durably landed. This includes a gate abort and a
  // rollback after an apply failure.
  LAND_STACK_OUTCOME_ROLLED_BACK = 2;
}

message LandStackMemberResult {
  LandStackMember member = 1;
  // Mirrors CheckMergeEligibilityResponse.allowed for this member.
  bool allowed = 2;
  // Open merge-gate output reused directly; do not re-enumerate gate reasons.
  repeated UnmetRequirement unmet = 3;
  // Approvals the existing merge gate considered valid for this member.
  repeated ThreadApproval valid_approvals = 4;
  // Final durable state. False for every member when outcome is ROLLED_BACK,
  // including members whose apply was attempted before a later failure.
  bool landed = 5;
  // Non-empty only on the member whose apply failure caused a rollback.
  string failure_reason = 6;
}

message LandStackResponse {
  // The transaction has exactly one durable outcome: all members committed or
  // none committed.
  LandStackOutcome outcome = 1;
  // One result per requested member, returned in server-computed bottom-up
  // order rather than request order.
  repeated LandStackMemberResult results = 2;
}

