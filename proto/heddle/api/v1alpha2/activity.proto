syntax = "proto3";
package heddle.api.v1alpha2;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/thread.proto";

message AttentionItem {
  RecordRef ref = 1;
  bytes version = 2;
  EntityRef subject = 3;
  string headline = 4;
  string detail = 5;
  uint32 priority = 6;
  enum Resolution {
    RESOLUTION_UNSPECIFIED = 0;
    RESOLUTION_PENDING = 1;
    RESOLUTION_DISMISSED = 2;
    RESOLUTION_ACTED_ON = 3;
  }
  Resolution resolution = 7;
  bool pinned = 8;
  CaptureSummary capture = 9;
  repeated ActionAvailability actions = 10;
  repeated Requirement requirements = 11;
  Coverage analysis_coverage = 12;
  google.protobuf.Timestamp created_at = 13;
  // Unset or a time in the past means not snoozed. A future time removes the
  // item from pending on every device. It returns as pending when that time
  // passes, or earlier when new activity arrives on its subject; the server
  // then clears this field and bumps version.
  google.protobuf.Timestamp snoozed_until = 14;
}
message RecordInteractionRequest {
  string client_operation_id = 1;
  EntityRef subject = 2;
  RecordRef attention_item = 3;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_VIEW = 1;
    KIND_ACT = 2;
    KIND_DISMISS = 3;
  }
  Kind kind = 4;
}
message SetAttentionStateRequest {
  string client_operation_id = 1;
  RecordRef item = 2;
  bytes expected_version = 3;
  AttentionItem.Resolution resolution = 4;
  bool pinned = 5;
  // Absent leaves the current snooze unchanged, so a caller that only changes
  // resolution or pinned does not clear it. expected_version and
  // client_operation_id idempotency behave as today. pinned remains the
  // absolute pin value on every call, as today.
  oneof snooze {
    // Sets AttentionItem.snoozed_until. A future time removes the item from
    // pending on every device. It returns as pending when that time passes, or
    // earlier when new activity arrives on its subject; the server then clears
    // the snooze and bumps version. A past time means not snoozed.
    google.protobuf.Timestamp snoozed_until = 6;
    // Clear the snooze and unset AttentionItem.snoozed_until. Must be true;
    // false is rejected.
    bool clear_snooze = 7;
  }
}
message NotificationRecord {
  RecordRef ref = 1;
  bytes version = 2;
  EntityRef subject = 3;
  // Open kind vocabulary. HELD_NAME_REQUESTED goes to the held name's holder;
  // HELD_NAME_REQUEST_LAPSED goes to its requester when the 30-day window lapses.
  // Both are direct asks: inbox immediately, email immediately by default,
  // and push immediately once available, subject to per-channel preferences.
  string kind = 4;
  string title = 5;
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp read_at = 8;
  repeated ActionAvailability actions = 9;
}
// Per-channel stored selector. Empty kind or "*" matches all kinds; empty or
// "any" actor_origin matches both "human" and "agent". CHANNEL_UNSPECIFIED
// matches all channels. Spool rules take precedence over account rules; within
// a scope exact kind > exact channel > exact origin, with first rule winning ties.
// IN_APP and PUSH are on/off only (IMMEDIATE or DISABLED). First reject unknown
// channels/deliveries and UNSPECIFIED delivery with INVALID_ARGUMENT /
// FIELD_INVALID. Next check the email lock: an email rule matching
// account_security or security_surface must be IMMEDIATE, regardless of origin
// or Spool. Attempts to disable or digest their email, including wildcard rules
// and public unsubscribe, are rejected with FAILED_PRECONDITION / POLICY_DENIED
// before any write. This lock takes precedence over the email-only DIGEST check:
// other DIGEST rules on non-email or wildcard channels are rejected with
// INVALID_ARGUMENT / FIELD_INVALID.
message NotificationRule {
  string kind = 1;
  SpoolRef spool = 2;
  string actor_origin = 3;
  enum Channel {
    CHANNEL_UNSPECIFIED = 0;
    CHANNEL_IN_APP = 1;
    CHANNEL_EMAIL = 2;
    CHANNEL_PUSH = 3;
  }
  Channel channel = 4;
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    DELIVERY_IMMEDIATE = 1;
    DELIVERY_DIGEST = 2;
    DELIVERY_DISABLED = 3;
  }
  Delivery delivery = 5;
}
// Stored settings and weft-owned read projections are distinct. The inbox is
// the record and never waits for an email digest. ObserveNotifications with
// include_preferences returns all these fields in the same preferences payload.
message NotificationPreferences {
  bytes version = 1;
  repeated NotificationRule rules = 2;
  // Email-only account cadence: zero disables scheduled digest email;
  // supported nonzero intervals are one hour, one day and one week. Supplied
  // durations require zero nanos and seconds in {0, 3600, 86400, 604800}, otherwise
  // INVALID_ARGUMENT / FIELD_INVALID. Absence uses weft's daily default.
  // This does not delay inbox items or push.
  google.protobuf.Duration digest_interval = 3;
  // IANA timezone anchoring email digest windows; empty uses weft's default.
  string timezone = 4;
  // One override per Spool. Removing an override restores the account default.
  // Cadence can be overridden without overriding any routing rules.
  repeated NotificationDigestOverride digest_overrides = 5;
  // Read-only resolved cells, not stored rules. Complete account matrix plus
  // sparse cells whose result differs in configured Spool scopes. Unique by
  // (kind, spool, actor_origin, channel), at most 4096 cells and 1 MiB encoded
  // for the complete preferences message. No silent truncation: a larger read
  // fails with RESOURCE_EXHAUSTED / QUOTA_EXCEEDED. Omitted Spool cells inherit
  // the account cell. Only currently authorized Spool scopes may be disclosed.
  // Weft owns defaults and precedence; clients must not infer defaults from
  // missing stored rules. RULE identifies a matching stored rule, DEFAULT a
  // weft default. A locked email cell is always IMMEDIATE.
  repeated EffectiveDelivery effective_delivery = 6;
  // Read-only next account email digest window, absent when its effective
  // interval is off. A schedule projection, not a promise of queued email.
  google.protobuf.Timestamp next_digest_at = 7;
}
// One concrete resolved delivery, using the same selectors as a stored rule.
// kind and channel are concrete (never wildcard); actor_origin is human/agent,
// or empty for a kind whose delivery is independent of origin. spool absent is
// account scope. source must be RULE or DEFAULT; delivery must be concrete.
// An off effective digest interval resolves email DIGEST to DISABLED without
// changing the stored rule or its source. Destination readiness is separate.
message EffectiveDelivery {
  string kind = 1;
  SpoolRef spool = 2;
  string actor_origin = 3;
  NotificationRule.Channel channel = 4;
  NotificationRule.Delivery delivery = 5;
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_RULE = 1;
    SOURCE_DEFAULT = 2;
  }
  Source source = 6;
  // True for non-suppressible security/recovery email: account_security and
  // security_surface. This is a server policy marker, not client authority.
  bool locked = 7;
}
message NotificationDigestOverride {
  SpoolRef spool = 1;
  // Required, with the same values as the account default. Explicit zero means
  // off for this Spool, even when the account default enables digests.
  google.protobuf.Duration digest_interval = 2;
  // Read-only next email digest window for this Spool, absent when its interval
  // is off. Allows an enabled override while the account cadence is off.
  google.protobuf.Timestamp next_digest_at = 3;
}
message MarkNotificationsReadRequest {
  string client_operation_id = 1;
  repeated RecordRef notifications = 2;
  google.protobuf.Timestamp through = 3;
}
// Atomic settings replacement under expected_version. Read-only projection
// fields (effective_delivery and next_digest_at, including overrides) are ignored
// and recomputed, never persisted or used as authority. The server MUST validate
// every rule and digest interval before writing; invalid delivery or cadence
// rejects the whole request. Portable helpers complement remaining host validation
// of timezone, selectors, duplicate overrides and input budgets.
message SetNotificationPreferencesRequest {
  string client_operation_id = 1;
  NotificationPreferences preferences = 2;
  bytes expected_version = 3;
}
// Public, single-purpose disabling action. The opaque capability determines
// the recipient and exact allowed selectors; no account credential is required.
// Each requested rule must select an authorized channel and DISABLED delivery.
message UnsubscribeNotificationsRequest {
  string client_operation_id = 1;
  bytes unsubscribe_capability = 2;
  repeated NotificationRule rules = 3;
}
// Derived presentation of canonical signed evidence. The receiving endpoint
// verifies original authority independently; a reported pass is not itself
// cryptographic proof that an external process ran correctly.
message CheckEvidenceSummary {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_PASSED = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_ERROR = 3;
    OUTCOME_SKIPPED = 4;
  }
  Outcome outcome = 1;
  string detail = 2;
  PrincipalRef author = 3;
  string agent_id = 4;
  repeated RecordRef artifacts = 5;
  repeated RecordRef supersedes = 6;
  google.protobuf.Timestamp completed_at = 7;
}
message EvidenceRecord {
  RecordRef ref = 1;
  bytes version = 2;
  RevisionRef revision = 3;
  string check = 4;
  // heddle-check-evidence-v2: canonical named MessagePack CheckEvidence,
  // Ed25519 over UTF8(format) || 0x00 || canonical_record. Exactly one original
  // publisher signature. The payload binds this ID, Spool, original Thread, native revision,
  // check, terminal outcome, original actor/authority, completion time and any
  // independently authorized artifact references. Signature validity alone
  // neither grants Spool access nor satisfies the current review policy.
  SignedRecord evidence = 5;
  Coverage coverage = 6;
  // Always derived from evidence when observed. A command may omit this
  // projection; if supplied, every field must match the signed original.
  CheckEvidenceSummary summary = 7;
  // Required original audience scope, independently of matching source revisions.
  ThreadRef thread = 8;
}
// Immutable review progress for one accepted check result and exact policy.
// This does not change its outcome, supersede evidence or grant landing approval.
message CheckAcknowledgementRecord {
  RecordRef ref = 1;
  bytes version = 2;
  RecordRef evidence = 3;
  RevisionRef revision = 4;
  bytes policy_version = 5;
  PrincipalRef author = 6;
  string agent_id = 7;
  google.protobuf.Timestamp acknowledged_at = 8;
  SignedRecord acknowledgement = 9;
}
message RecordEvidenceRequest {
  string client_operation_id = 1;
  EvidenceRecord evidence = 2;
}
message VerifyEvidenceRequest {
  repeated EvidenceRecord evidence = 1;
}
message EvidenceVerification {
  RecordRef evidence = 1;
  bool verified = 2;
  repeated Requirement requirements = 3;
}
message VerifyEvidenceResponse {
  repeated EvidenceVerification results = 1;
}
message AcknowledgeCheckRequest {
  string client_operation_id = 1;
  RecordRef evidence = 2;
  RevisionRef revision = 3;
  bytes policy_version = 4;
  // heddle-check-acknowledgement-v1. Same canonical/signature rules as evidence;
  // binds the accepted evidence digest, revision, policy, original actor and
  // this client_operation_id. Acknowledging never changes the recorded outcome.
  SignedRecord acknowledgement = 5;
}
