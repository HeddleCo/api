syntax = "proto3";
package heddle.api.v1alpha2;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/owner_records.proto";
import "heddle/api/v1alpha2/stream.proto";

// Account names and paths resolve to stable resources once. They never become
// authorization roots or replace the stable IDs in subsequent commands.
message ResourceSelector {
  oneof selector {
    EntityRef resource = 1;
    string spool_address = 2;
    ThreadNameSelector thread_name = 3;
    string principal_handle = 4;
  }
}
message ThreadNameSelector {
  SpoolRef spool = 1;
  string name = 2;
}
message ResolveResourcesRequest {
  repeated ResourceSelector selectors = 1;
  ReadBudget budget = 2;
}
message ResourceResolution {
  uint32 selection_index = 1;
  EntityRef resource = 2;
  string principal_id = 3;
  Coverage coverage = 4;
}
message ResolveResourcesResponse {
  repeated ResourceResolution results = 1;
  // Mandatory, fully populated effective ReadBudget.
  ReadBudget accepted_budget = 2;
}

enum ResourceRole {
  RESOURCE_ROLE_UNSPECIFIED = 0;
  RESOURCE_ROLE_READER = 1;
  RESOURCE_ROLE_WRITER = 2;
  RESOURCE_ROLE_ADMINISTRATOR = 3;
}

// Delegated HOLD-verdict lifecycle on SpoolSettings. Not
// abandoned_thread_retention. v1 VersionedHoldLifecycle was chain-inherited
// and offline-citable; moving HOLD here drops that citation. UNSPECIFIED
// inherits; the built-in root default is EXPLICIT_SUPERSESSION.
enum HoldLifecycle {
  HOLD_LIFECYCLE_UNSPECIFIED = 0;
  HOLD_LIFECYCLE_EXPLICIT_SUPERSESSION = 1;
  HOLD_LIFECYCLE_AUTO_CLEAR_ON_RESUBMIT = 2;
}

// Delegated blocking-discussion rule, inherited down the spool tree. The
// nearest non-UNSPECIFIED setting wins; an unset root defaults to ANY_WRITER,
// preserving existing behavior. This is not an owner-signed policy ceiling.
// Every permitted actor still needs ordinary write access. Non-blocking
// discussions are unchanged. Reopening a resolved blocking discussion and
// changing blocking to non-blocking obey the same rule as resolving it.
// Agents act as their person (including opener identity), within agent ceilings;
// an administrator role never bypasses those ceilings or OPENER_ONLY.
// Unknown values MUST be rejected rather than widening permission.
enum BlockingDiscussionResolveRule {
  // Remove the local override and inherit; unset root means ANY_WRITER.
  BLOCKING_DISCUSSION_RESOLVE_RULE_UNSPECIFIED = 0;
  // Any otherwise-authorized writer; today's behavior.
  BLOCKING_DISCUSSION_RESOLVE_RULE_ANY_WRITER = 1;
  // Opener's person or an otherwise-authorized spool administrator.
  BLOCKING_DISCUSSION_RESOLVE_RULE_OPENER_OR_ADMIN = 2;
  // Opener's person only, including when the caller is an administrator.
  BLOCKING_DISCUSSION_RESOLVE_RULE_OPENER_ONLY = 3;
}

// Fresh bootstrap permits child creation and has no implicit approval mandate.
// Explicit review policies still apply. ReviseSpool patches selected settings;
// its settings participate in the observed review policy version.
//
// Mutation is SpoolService.ReviseSpool under delegated
// AUTHORIZATION_ROLE_RESOURCE_ADMINISTRATOR. An owner signature is not a
// prerequisite; independent of signed-policy expected_head CAS.
// audience / default_state_audience MUST NOT exceed the standing inherited
// owner-signed max_audience (min over this spool's tip and every ancestor's
// tip; absent tip or absent field contributes nothing; present UNSPECIFIED
// fails closed). Tightening does not recall already-cloned public bytes.
//
// Intentionally absent versus v1: write_policy (never enforced),
// bootstrap_kind / bootstrap_source / bootstrap_sync_direction /
// initial_tooling (create-time), sync_behavior (thread-domain). Format 1
// has no signed forbid_child_creation.
message SpoolSettings {
  // Bounded by the standing inherited max_audience ceiling.
  Audience audience = 1;
  // Must be <= audience. Also bounded by the inherited ceiling.
  Audience default_state_audience = 2;
  string description = 3;
  // Delegated. Lossy versus v1 DISABLED / MAINTAINERS / DEVELOPERS. The
  // inherited max_audience ceiling, not this flag, is what stops a PUBLIC
  // child from disclosing a locked PRIVATE ancestor.
  bool allow_child_creation = 4;
  bool require_review_to_land = 5;
  google.protobuf.Duration abandoned_thread_retention = 6;
  // Omit if the selected policy is deleted/unreadable by this caller, retaining
  // the stored reference. Unset/deleted/unreadable look identical; no hidden ID.
  // Set only to an existing readable policy in this spool. Clear explicitly
  // through ReviseSpool.settings_mask, with permission to read/clear its value.
  RecordRef default_review_policy = 7;
  HoldLifecycle hold_lifecycle = 8;
  // Local override, changed via ReviseSpool under resource administrator
  // authority, like hold_lifecycle. UNSPECIFIED removes the local override and
  // inherits from the parent; root fallback is ANY_WRITER. A child may choose
  // any explicit rule; this is nearest-ancestor inheritance, not a min ceiling.
  BlockingDiscussionResolveRule blocking_discussion_resolve_rule = 9;
  // Local stable Thread selection, no ancestor inheritance/name fallback.
  // Resource admins set/clear via ReviseSpool under the containing spool CAS.
  // Must refer to an existing readable Thread in this spool when set. Import
  // initializes it from the source default branch's exact imported Thread;
  // retry/reimport must preserve an existing administrator selection.
  // Returned in SpoolOverview.settings. Omit for callers when deleted/unreadable
  // without clearing the stored selection or silently replacing it. No hidden
  // ID/tombstone; unset/deleted/unreadable look identical. Omission from an
  // unmasked revision leaves it unchanged. Clear explicitly through
  // ReviseSpool.settings_mask, with permission to read/clear its current value.
  ThreadRef default_thread = 10;
  // Opaque compare-and-swap version belongs to the containing spool record.
}
message SpoolMount {
  RecordRef ref = 1;
  SpoolRef parent = 2;
  SpoolRef child = 3;
  string name = 4;
  bytes version = 5;
}
// People reads MUST contain human accounts only. Agents are delegations of
// their user and MUST NOT appear as independent member/grant/invitation rows.
message MemberRecord {
  RecordRef ref = 1;
  string principal_id = 2;
  ResourceRole role = 3;
  bytes version = 4;
  // When present, id must equal principal_id; absent means display unavailable.
  PublicPrincipalSummary principal = 5;
}
message GrantRecord {
  RecordRef ref = 1;
  bytes version = 2;
  // Human account only, never an agent/service principal. Delegated credentials
  // exercise their user's grant within their own attenuation ceilings.
  string principal_id = 3;
  ResourceRole role = 4;
  // Ancestor grants admit AUDIENCE_MEMBERS on a descendant only when this
  // bit is true. false does not admit a child. Invitation redemption MUST
  // preserve an existing bit on conflict (it does not silently set true).
  bool include_descendants = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Optional display projection, as on MemberRecord. When present, id equals
  // principal_id. Authorization always uses principal_id and the grant itself;
  // a handle or display name is never an authority assertion.
  PublicPrincipalSummary principal = 7;
  // Ordinary grants never imply owner purge authority.
}
enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  INVITATION_STATE_PENDING = 1;
  INVITATION_STATE_ACCEPTED = 2;
  INVITATION_STATE_DECLINED = 3;
  INVITATION_STATE_REVOKED = 4;
  INVITATION_STATE_EXPIRED = 5;
}

// Inviter-side People/invitations read model, also used in the invitee's inbox.
// Terminal states never reopen. Only the selected recipient arm is returned:
// a handle is NEVER replaced/supplemented with its resolved account UUID.
// Server-only recipient binding and inviter UUID are never wire fields.
message InvitationRecord {
  RecordRef ref = 1;
  bytes version = 2;
  reserved 3, 6, 7;
  reserved "revoked", "redeemed";
  oneof recipient {
    // Email-only link flow; trimmed, ASCII-lowercased, <= 320 UTF-8 bytes.
    string email = 8;
    // Same canonical lookup coordinates as ResolveHandles; <= 256 UTF-8 bytes
    // before trimming. Host resolves once and stores the account binding.
    // Reassignment/removal of this handle never retargets a pending invitation.
    string handle = 9;
    // Explicit human account UUID supplied by the caller, never an agent ID.
    string account_id = 10;
  }
  ResourceRole role = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Read-only. Create requires UNSPECIFIED; the host commits PENDING.
  InvitationState state = 11;
  // Read-only server commit times. No-op retries preserve version and times.
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // Current public accountable human, with the same lifecycle/handle omission
  // and "handle, optionally display name, optionally via label" rules as
  // InvitationResolution. Never an agent principal as a separate person.
  PublicOwner inviter = 14;
  string inviter_via_agent_label = 15;
  // Read-only invitation-scoped display, including for invitees without spool
  // membership. This permits no other spool read and does not imply membership.
  string spool_name = 16;
  SpoolAddress spool_address = 17;
  // Secrets are returned only for email CreateInvitation, never observations.
  // Accept/Redeem grant once, preserving an active existing role if stronger
  // and preserving its include_descendants bit; a new grant sets it false.
}
message ApprovalGroupRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string name = 3;
  string description = 4;
  repeated string principal_ids = 5;
}
message GroupRequirement {
  RecordRef group = 1;
  uint32 minimum_approvals = 2;
}
message ReviewPolicyRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string name = 3;
  repeated ThreadRef targets = 4;
  repeated string target_name_patterns = 5;
  uint32 required_approvals = 6;
  ResourceRole minimum_role = 7;
  repeated string required_paths = 8;
  bool forbid_author_approval = 9;
  bool stale_on_revision_change = 10;
  google.protobuf.Duration approval_ttl = 11;
  repeated GroupRequirement groups = 12;
  repeated string required_checks = 13;
}
message BookmarkRecord {
  BookmarkRef ref = 1;
  bytes version = 2;
  string label = 3;
  // False is a retained tombstone with its own CAS version.
  bool bookmarked = 4;
  // First save in the current saved interval; label edits preserve it. A re-save
  // after removal starts a new interval. Tombstones retain the last known value.
  // Unset for legacy/never-saved records; never fabricate a historical time.
  google.protobuf.Timestamp bookmarked_at = 5;
  // Server commit time of the last effective save, label edit or removal.
  // No-op/idempotent retries preserve it. Unset if historically unknown.
  // Workspace streams do not promise time order; clients sort loaded saved rows
  // newest-first by bookmarked_at, unknown last. See saved-source.md for ties.
  google.protobuf.Timestamp updated_at = 6;
}
message BookmarkMutationResponse {
  MutationReceipt receipt = 1;
  BookmarkRecord bookmark = 2;
}
message SupportAccessRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string support_principal_id = 3;
  ResourceRole role = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
  // Unrevoked support-access on this spool or on an ancestor that reaches
  // this spool is admitted to AUDIENCE_MEMBERS. Not a GrantRecord/MemberRecord
  // on the wire; writes go through SetSupportAccess, not PutGrant.
}
message CreateSpoolRequest {
  string client_operation_id = 1;
  // Existing parent; omit only for an authorized top-level creation.
  // Child audience is bounded by effective_max_audience(parent), including
  // grandparents. The child does not copy the parent's signed-policy record.
  SpoolRef parent = 2;
  // One address segment. The stable new spool UUID comes only from genesis.
  string slug = 3;
  SpoolSettings settings = 4;
  oneof ownership {
    // Signed by the account's current owner authority. Admission verifies the
    // account's root and accepted rotation history and compares its current key
    // atomically with creation. Historical membership alone cannot create a
    // new spool. Retry the original signed genesis and operation ID.
    SignedSpoolOwnerGenesis owner_genesis = 5;
    // Explicit creation through this account's existing server-held authority.
    // The client supplies a fresh UUIDv7. Only an active server-rooted account
    // with configured per-user custody can use this branch; it never establishes
    // a root or falls back to the deployment key. The response contains the same
    // portable signed genesis and owner history as client-signed creation.
    SpoolRef custodial_spool = 7;
  }
  optional string display_name = 6;
}
// Compare and replace display name and patch selected settings atomically. The stable
// UUID, parent, and immutable owner genesis are unchanged.
// Owner signature is not a prerequisite. The mere existence of a signed-policy
// tip does not block this RPC (independent CAS from expected_head).
// settings.audience / default_state_audience are bounded by the standing
// inherited max_audience (this spool and ancestors). Exceeding it is
// PERMISSION_DENIED.
message ReviseSpoolRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  bytes expected_version = 3;
  string name = 4;
  SpoolSettings settings = 5;
  // Optional new single address segment. Omission retains the current slug.
  // Rename updates descendant addresses in the same transaction and preserves
  // UUID-based references, grants and ownership. Empty is invalid when present.
  optional string slug = 6;
  // Paths relative to settings: only the ten top-level SpoolSettings field
  // names are valid. Nested paths, wildcards, unknown and duplicate paths are
  // INVALID_ARGUMENT. Omitted/empty mask leaves every setting unchanged;
  // settings values outside the mask are ignored, even on a filtered overview.
  // A selected path sets its supplied value, including false/empty/UNSPECIFIED.
  // An absent selected message explicitly clears it (settings may be absent).
  // Clears/reset-to-default require permission to read AND clear the current
  // value. Replacing default_thread or default_review_policy also removes the
  // current caller-filtered reference and requires that permission; setting an
  // equal reference does not. Independently validate permission for the new
  // target. Deny atomically with PERMISSION_DENIED and no hidden-value details.
  // Bind the stored-value check and update to the same expected_version and
  // recheck live authorization at commit. Validate resulting audience/policy
  // together; no partial apply. There is no complete-record mode.
  google.protobuf.FieldMask settings_mask = 7;
}
// Move a personal-root child to the account's root-level address at its current
// slug. UUID, genesis, descendants, and direct grants survive.
// Bound by the destination ancestry's effective max_audience: refuse promotion
// that would place a too-wide child under a tighter destination. Birth-parent
// lock does not follow the promoted spool.
message PromoteSpoolRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  bytes expected_version = 3;
}
message DeleteSpoolRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  bytes expected_version = 3;
}
message SetSpoolMountRequest {
  string client_operation_id = 1;
  SpoolMount mount = 2;
  bytes expected_version = 3;
}
message RemoveSpoolMountRequest {
  string client_operation_id = 1;
  SpoolMount mount = 2;
  bytes expected_version = 3;
}
message PutGrantRequest {
  string client_operation_id = 1;
  GrantRecord grant = 2;
  bytes expected_version = 3;
}
message RevokeGrantRequest {
  string client_operation_id = 1;
  RecordRef grant = 2;
  bytes expected_version = 3;
}
message CreateInvitationRequest {
  string client_operation_id = 1;
  // Exactly one typed recipient; no legacy string. Ref/role/future expiry are
  // inputs; all projection fields MUST be unset. Spool admin authorization
  // precedes handle resolution. See docs/alpha-v2/administration.md for the
  // exact public-directory disclosure and typed refusal.
  InvitationRecord invitation = 2;
}
message CreateInvitationResponse {
  MutationReceipt receipt = 1;
  InvitationRecord invitation = 2;
  // Nonempty for email only. Account/handle invitations have no link secret.
  bytes redemption_secret = 3;
}
// Public capability preview. The invitation ID alone reveals nothing; the
// redemption secret is passed in the request body and never placed in a URL
// path or query. Invitation links get forwarded: any holder of the secret can
// see the spool address (including path segments) and name, role, expiry,
// inviter's public handle and display name, and the delegated agent's display
// label when present. The inviter's handle also reveals that this person
// administers the spool, even if the spool is private. No recipient email is
// disclosed. The inviter lookup MUST use the same query shape for every status
// so timing does not reveal invitation validity.
message ResolveInvitationRequest {
  RecordRef invitation = 1;
  bytes redemption_secret = 2;
}
message InvitationResolution {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    STATUS_REDEEMED = 2;
    STATUS_UNAVAILABLE = 3;
  }
  Status status = 1;
  // Filled only for AVAILABLE and REDEEMED after the redemption-secret check;
  // path_segments is subject to the same gating as the other spool details.
  // Every UNAVAILABLE response MUST be byte-identical, with no spool details,
  // inviter or agent label, regardless of whether the secret is wrong, expired
  // or revoked.
  SpoolAddress spool = 2;
  string spool_name = 3;
  ResourceRole role = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Accountable human who created the invitation. Filled only for AVAILABLE
  // and REDEEMED, after the redemption-secret check. Resolve at read time:
  // show the current public handle even if this account is no longer a spool
  // member or administrator. Use only already-public values, never a username
  // fallback. Leave inviter and inviter_via_agent_label empty if the creator
  // has no public handle or its account is deleted, locked or disabled.
  // Clients MUST display inviter.handle. They MAY show display_name only
  // alongside the handle, never by itself.
  PublicOwner inviter = 6;
  // Already-public current display label of the delegated agent credential
  // used to create this invitation, if any. Only set alongside an inviter
  // with a public handle, after the redemption-secret check for AVAILABLE or
  // REDEEMED.
  // Clients MAY render it only as "via <label>" after inviter.handle; it
  // never replaces the accountable human inviter.
  string inviter_via_agent_label = 7;
}
message RedeemInvitationRequest {
  string client_operation_id = 1;
  RecordRef invitation = 2;
  bytes redemption_secret = 3;
}
// Caller-bound signed-in in-app commands. No secret, OAuth-only restriction,
// or pre-existing spool membership. The host MUST compare the verified caller's
// account with the stored resolved recipient before state/idempotency lookup.
// Foreign/nonexistent/link-only invitations uniformly hide existence.
message AcceptInvitationRequest {
  string client_operation_id = 1;
  RecordRef invitation = 2;
}
message DeclineInvitationRequest {
  string client_operation_id = 1;
  RecordRef invitation = 2;
}
message RevokeInvitationRequest {
  string client_operation_id = 1;
  RecordRef invitation = 2;
  bytes expected_version = 3;
}
message PutReviewPolicyRequest {
  string client_operation_id = 1;
  ReviewPolicyRecord policy = 2;
  bytes expected_version = 3;
}
message DeleteReviewPolicyRequest {
  string client_operation_id = 1;
  RecordRef policy = 2;
  bytes expected_version = 3;
}
message PutApprovalGroupRequest {
  string client_operation_id = 1;
  ApprovalGroupRecord group = 2;
  bytes expected_version = 3;
}
message DeleteApprovalGroupRequest {
  string client_operation_id = 1;
  RecordRef group = 2;
  bytes expected_version = 3;
}
message SetBookmarkRequest {
  string client_operation_id = 1;
  BookmarkRef bookmark = 2;
  bool bookmarked = 3;
  // Empty means no bookmark has ever existed; tombstones retain a version.
  bytes expected_version = 4;
  string label = 5;
}
message SetSupportAccessRequest {
  string client_operation_id = 1;
  SupportAccessRecord access = 2;
  bytes expected_version = 3;
}

// Grant-reachable unary Spool listing for whoami and admin surfaces.
// ObserveWorkspace remains the live composed workspace view; this RPC is the
// bounded one-shot catalog of Spools reachable through the caller's grants.
// `repos_only` keeps content-bearing (repository/project) rows.
message ListSpoolsRequest {
  bool repos_only = 1;
}
message ListedSpool {
  SpoolRef ref = 1;
  repeated string path_segments = 2;
  bool is_repo = 3;
  google.protobuf.Timestamp last_activity_at = 4;
  optional uint32 thread_count = 5;
  string head_thread = 6;
  // Retained logical bytes attributed to this Spool by the authoritative
  // storage ledger, including drained totals and undrained deltas. This is the
  // exact per-Spool quantity rolled up into the account's 5 GB Free-plan gate;
  // it is a decimal byte count, not physical/object-store size.
  uint64 retained_size_bytes = 7;
}
message ListSpoolsResponse {
  repeated ListedSpool spools = 1;
}

// Owner-signed spool policy submit. Not a prerequisite of ReviseSpool.
// request.spool MUST equal record.body.spool_uuid; mismatch fails closed.
// Proposed max_audience, if present and specified, MUST be <= the ancestors'
// effective ceiling (min over ancestors only). Retry by client_operation_id.
// The biscuit RESOURCE_OWNER role is necessary but not sufficient: the
// verifier checks the owner signature against the server-derived current
// owner OwnerState. Receipt binds SignedPolicyHead (Decision 8).
message SubmitSignedPolicyRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  SignedSpoolPolicyRecord record = 3;
}
message SubmitSignedPolicyResponse {
  MutationReceipt receipt = 1;
  // Accepted CAS head after this submit. Unset is not a successful apply.
  SignedPolicyHead signed_policy_head = 2;
}
