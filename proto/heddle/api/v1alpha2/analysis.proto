syntax = "proto3";

package heddle.api.v1alpha2;

import "heddle/api/common/repository.proto";
import "heddle/api/v1alpha2/behavior.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/stream.proto";

enum AnalysisKind {
  ANALYSIS_KIND_UNSPECIFIED = 0;
  ANALYSIS_KIND_SEMANTIC_INDEX = 1;
  ANALYSIS_KIND_SEMANTIC_DIFF = 2;
  reserved 3, 4, 5;
  reserved "ANALYSIS_KIND_HOT_SPOTS", "ANALYSIS_KIND_REVIEW", "ANALYSIS_KIND_CONTEXT_SUGGESTIONS";
  ANALYSIS_KIND_BEHAVIOR_CHANGES = 6;
}

message AnalysisRecord {
  RecordRef ref = 1;
  RevisionRef source = 2;
  RevisionRef base = 3;
  AnalysisKind kind = 4;
  string analyzer = 5;
  string analyzer_version = 6;
  Coverage coverage = 7;
  RecordRef operation = 8;
  bytes version = 9;
  // Exact total only when known. A bounded/partial projection must not report
  // the current page's size as the total or use zero to mean unknown.
  optional uint64 finding_count = 10;
  ThreadRef thread = 11;
  // Exact base owner; absent only when this analysis has no base revision.
  ThreadRef base_thread = 12;
}

message AnalysisFinding {
  RecordRef analysis = 1;
  string id = 2;
  string path = 3;
  optional uint32 line = 4;
  string explanation = 5;
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_INFORMATIONAL = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_BLOCKING = 3;
  }
  Severity severity = 6;
  repeated EntityRef evidence = 7;
}

message ObserveAnalysisRequest {
  RevisionRef source = 1;
  RevisionRef base = 2;
  repeated AnalysisKind kinds = 3;
  repeated string paths = 4;
  PageRequest page = 5;
  ObserveOptions observe = 6;
  // Exact qualified symbol addresses; empty selects all symbols in paths.
  repeated string symbols = 7;
  // Required owning Thread of source. A shared revision does not grant access
  // through another Thread. Its Spool must match source.spool.
  ThreadRef thread = 8;
  // Absent uses thread. An explicit comparison Thread is independently read.
  ThreadRef base_thread = 9;
}

message AnalysisEvent {
  StreamFrame frame = 1;
  oneof payload {
    AnalysisRecord analysis = 2;
    AnalysisFinding finding = 3;
    heddle.api.common.SemanticHotSpot hot_spot = 4;
    heddle.api.common.FileDiff diff = 5;
    Removal removal = 6;
    SectionStatus status = 7;
    BehaviorChange behavior_change = 8;
    BehaviorAnalysisCoverage behavior_coverage = 9;
    BehaviorChangeRemoval behavior_removal = 10;
    SectionReplacement replace_section = 11;
  }
}

message StartAnalysisRequest {
  string client_operation_id = 1;
  RevisionRef source = 2;
  RevisionRef base = 3;
  repeated AnalysisKind kinds = 4;
  // Explicit execution destination; private content is not uploaded merely
  // because a view asks for analysis. Provider disclosure requires policy.
  EndpointRef execution_endpoint = 5;
  bytes expected_disclosure_policy_version = 6;
  // Required owning Thread of source; matches source.spool.
  ThreadRef thread = 7;
  // Absent uses thread when base is present.
  ThreadRef base_thread = 8;
}

// One existing Heddle semantic root/file/directory object. The canonical bytes
// use the versioned Heddle semantic index codec. The 32-byte hash uses Heddle's
// Blob identity: BLAKE3(UTF8("blob") || uint64_le(canonical.length) || 0x00 ||
// canonical), matching Blob::hash(). Hashing canonical alone is incorrect.
// This object grants no right to fetch other CAS objects.
message SemanticIndexObject {
  bytes hash = 1;
  bytes canonical = 2;
}

// Self-contained derived index, readable in one bounded artifact stream.
// Nodes are unique and sorted by hash; root_hash is 32 bytes and must name an
// included root. All derived root/tree/file nodes are included and verified.
// Opaque file entries may identify source commitments, but their raw source
// bytes are never included. Parsed/opaque counts describe this exact source.
message SemanticIndexArtifact {
  bytes root_hash = 1;
  repeated SemanticIndexObject nodes = 2;
  uint64 parsed_files = 3;
  uint64 opaque_files = 4;
}

// Immutable derived analysis output. Stored under an opaque Thread-scoped
// artifact identity; this is never an authorization wrapper for source bytes.
// Readers decode one canonical message, not concatenated stream frames. The
// producer rejects outputs larger than its advertised artifact byte budget.
message AnalysisArtifact {
  // Version 1. Unknown versions must be rejected before interpreting payloads.
  uint32 schema_version = 1;
  RevisionRef source = 2;
  RevisionRef base = 3;
  repeated AnalysisRecord analyses = 4;
  repeated AnalysisFinding findings = 5;
  repeated heddle.api.common.FileDiff diffs = 6;
  repeated heddle.api.common.SemanticHotSpot hot_spots = 7;
  repeated BehaviorChange behavior_changes = 8;
  repeated BehaviorAnalysisCoverage behavior_coverage = 9;
  ThreadRef thread = 10;
  ThreadRef base_thread = 11;
  SemanticIndexArtifact semantic_index = 12;
  // Each analysis names its implementation/version and reports actual coverage.
  // Raw transcripts, runtime secrets, and original private attachments are not
  // analysis output and cannot be placed into this derived-artifact envelope.
}
