syntax = "proto3";

package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha2/administration.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/stream.proto";

// Unknown, including a missing path at the exact revision. Never infer from
// extensions, line numbers, the working tree or the current Thread head.
enum SourcePathKind {
  SOURCE_PATH_KIND_UNSPECIFIED = 0;
  SOURCE_PATH_KIND_FILE = 1;
  SOURCE_PATH_KIND_DIRECTORY = 2;
}
// Read-projection provenance, never part of a canonical signed source map.
enum SourcePathKindSource {
  SOURCE_PATH_KIND_SOURCE_UNSPECIFIED = 0;
  SOURCE_PATH_KIND_SOURCE_RECORDED = 1;
  SOURCE_PATH_KIND_SOURCE_DERIVED = 2;
}

message SourceAnchor {
  RevisionRef revision = 1;
  string path = 2;
  string symbol_id = 3;
  optional uint32 start_line = 4;
  optional uint32 end_line = 5;
  // Owning Thread for replicated source annotations; its spool must equal the
  // exact revision spool. Source bytes alone do not identify a causal history.
  ThreadRef thread = 6;
  // Optional shared target identity and explicit tracking policy. Coordinates
  // above remain original signed evidence. Omitted means exact-location only;
  // implementations MUST NOT infer tracking from the owning Thread.
  SourceTargetReference target = 7;
  // RECORDED means the original canonical source map contains path_kind,
  // appended after optional target, as "file" or "directory". Unknown omits
  // the key, preserving old bytes/signatures. DERIVED is read metadata only,
  // obtained from this exact revision and never written back into signed bytes.
  // Content-read authorization and redaction precede lookup AND emission,
  // including recorded kinds. Hidden/missing paths never disclose their type.
  SourcePathKind path_kind = 8;
  SourcePathKindSource path_kind_source = 9;
}

// Shared by primary anchors and annotation references. This is a reference,
// never a grant to read the target's source or its owning Thread.
message SourceTargetReference {
  bytes target_id = 1; // Canonical SourceTargetCore identity, exactly 32 bytes.
  oneof binding {
    // Must be true. Inherited references follow the Thread being viewed.
    bool viewed_thread = 2;
    ThreadRef named_thread = 3;
    PinnedSourceTargetRevision pinned_revision = 4;
  }
}
message PinnedSourceTargetRevision {
  RevisionRef revision = 1;
  // Optional originating Thread; when present its Spool must match revision.
  ThreadRef thread = 2;
}

// Exact current coordinates, never an authoring input or a replacement for the
// original evidence in SourceAnchor. No implicit tracking from these fields.
message SourceLocation {
  RevisionRef revision = 1;
  string path = 2;
  string symbol_id = 3;
  optional uint32 start_line = 4;
  optional uint32 end_line = 5;
  ThreadRef thread = 6;
  // Derived at this location's exact revision under content-read visibility.
  // This whole message is projection metadata, never original signed evidence.
  SourcePathKind path_kind = 7;
}

// Stable within an endpoint observation. Only a viewed_thread binding requires
// viewed_thread here; named and pinned bindings MUST omit it. The selected
// revision is a value, so capture moves one shared entry, not every referrer.
message SourceTargetResolutionKey {
  SourceTargetReference reference = 1;
  ThreadRef viewed_thread = 2;
}

message SourceTargetResolution {
  SourceTargetResolutionKey key = 1;
  // Exact revision actually checked; must respect a historical viewed revision.
  // Absent for UNAVAILABLE. Emission requires that revision's visibility proof.
  RevisionRef computed_for = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RESOLVED = 1;
    STATUS_AMBIGUOUS = 2;
    STATUS_DELETED = 3;
    // Absent or inaccessible source/descriptor, indistinguishable to the caller.
    STATUS_UNAVAILABLE = 4;
  }
  Status status = 3;
  // Present only for RESOLVED, with revision equal to computed_for. Both the
  // source Thread and whole-tip/entry visibility are independently authorized.
  SourceLocation location = 4;
}

// Shared map updates for anchors and tags. Snapshot/Upsert frames carry upsert;
// Remove frames carry remove. Deduplicate by key within a checkpoint batch.
// Maps clear with Thread collaboration / Spool context section replacement and
// replacement snapshots. Remove the entry when its last referrer leaves the
// observed window. Neither missing targets nor these events grant source access.
message SourceTargetResolutionEvent {
  oneof change {
    SourceTargetResolution upsert = 1;
    SourceTargetResolutionKey remove = 2;
  }
}

// Exact view selection for a Thread's inherited target bindings. This selects
// resolution only; it grants no source access and does not select more records.
message SourceTargetView {
  ThreadRef thread = 1;
  RevisionRef revision = 2;
}

message CollaborationAnchor {
  oneof target {
    ThreadRef thread = 1;
    SourceAnchor source = 2;
    SpoolRef spool = 3;
  }
}

enum DiscussionActionKind {
  DISCUSSION_ACTION_KIND_UNSPECIFIED = 0;
  DISCUSSION_ACTION_KIND_RESOLVE = 1;
  DISCUSSION_ACTION_KIND_REOPEN = 2;
  DISCUSSION_ACTION_KIND_CHANGE_BLOCKING = 3;
}

// Caller-specific advice following ActionAvailability's conventions. A typed
// action also describes blocking changes without inventing a mutation RPC or
// changing the signed collaboration format. Advice never grants authority.
message DiscussionActionAvailability {
  DiscussionActionKind action = 1;
  bool implemented = 2;
  bool authorized = 3;
  // Display reasons use Requirement.explanation, e.g. "Only the opener or an
  // administrator can resolve this blocking discussion". State/version and
  // policy requirements remain explicit even when the caller is authorized.
  repeated Requirement requirements = 4;
  repeated ExpectedVersion observed_versions = 5;
}

// Server-derived admission metadata for one original signed resolution. NOT
// part of ResolveDiscussionRequest or the canonical author-signed operation;
// neither the client nor the courier can assert an override. Retain the rule
// and marker at admission, never recompute history from today's spool settings.
// This projection is not an offline-verifiable authorization proof.
message DiscussionResolutionRecord {
  RecordRef discussion = 1;
  // Exact causal operation ID of the original signed resolution.
  bytes causal_id = 2;
  // Verified original actor, not the uploader. Agent acts as principal_id.
  string principal_id = 3;
  string agent_id = 4;
  // Effective, non-UNSPECIFIED rule in force when admitted.
  BlockingDiscussionResolveRule rule = 5;
  // True exactly when a blocking discussion was resolved under OPENER_OR_ADMIN
  // by an authorized spool administrator whose person differs from its opener.
  // False for opener resolutions, ANY_WRITER, and non-blocking discussions.
  // Missing metadata means unknown, not evidence that no override occurred.
  bool administrator_override = 6;
}

message DiscussionRecord {
  RecordRef ref = 1;
  bytes version = 2;
  CollaborationAnchor anchor = 3;
  string title = 4;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OPEN = 1;
    STATUS_RESOLVED = 2;
    STATUS_ORPHANED = 3;
  }
  Status status = 5;
  bool blocking = 6;
  uint64 turn_count = 7;
  RecordRef extracted_context = 8;
  // Exact replication-operation frontier at this record version. Pass these IDs to
  // AppendTurn; concurrent appends remain distinct until observed.
  repeated bytes causal_heads = 9;
  // Public maps to canonical Public; Members maps to Internal. Private maps
  // to Private{audience_label}; this is an additional restriction on scope ACL.
  Audience audience = 10;
  string audience_label = 11;
  // One entry per supported/unsupported DiscussionActionKind, evaluated for this
  // caller and version: actionable only if implemented, authorized, and with
  // no unmet requirements. Missing entries mean unknown, never permitted.
  // Resolve/reopen use the inherited blocking rule; blocking-to-non-blocking
  // cannot bypass it. Non-blocking discussions keep ordinary writer behavior.
  // CHANGE_BLOCKING remains unimplemented until a mutation is supported; this
  // field does not add an RPC or signed operation variant. Agents act as their
  // person within all existing agent ceilings, including administrator agents.
  repeated DiscussionActionAvailability actions = 12;
  // Metadata for current resolution operations; concurrent resolutions remain
  // distinct by causal_id. include_history also includes past resolutions,
  // including those followed by reopen. Only disclose reader-visible originals.
  repeated DiscussionResolutionRecord resolutions = 13;
}

message DiscussionTurn {
  RecordRef ref = 1;
  RecordRef discussion = 2;
  string body = 3;
  string principal_id = 4;
  string agent_id = 5;
  repeated EntityRef mentions = 6;
  google.protobuf.Timestamp created_at = 7;
  // Immutable replication-operation identity and dependencies, shared across replicas.
  // These are separate from the addressable record ID and mutable view version.
  bytes causal_id = 8;
  repeated bytes causal_parents = 9;
  // Server-derived live display name of the authenticated principal_id, even
  // after membership ends. Empty for unresolved/deleted/withheld attribution.
  // Imported labels never establish a verified identity; agent_id stays separate.
  // Projection only, outside the original signed operation.
  string author_display_name = 10;
}

// Structured context metadata. References describe a target; they grant no access
// to it and never change the annotation's primary anchor or audience.
message AnnotationDecimal {
  sint64 coefficient = 1;
  // Value = coefficient / 10^scale; scale <= 9. Canonical values have no
  // trailing coefficient zero when scale > 0; zero always has scale 0.
  uint32 scale = 2;
}
message AnnotationValue {
  oneof value {
    string text = 1;
    bool boolean = 2;
    sint64 integer = 3;
    AnnotationDecimal decimal = 4;
  }
}
message AnnotationSourceReference {
  // Exact revision and optional owning Thread, with a nonempty relative path.
  // Lines are one-based, inclusive, and require both endpoints.
  SourceAnchor source = 1;
}
message AnnotationSymbolTag {
  // Exact, case-sensitive grouping name; not proof of symbol identity.
  string name = 1;
  AnnotationSourceReference target = 2;
}
message AnnotationProperty {
  string key = 1;
  AnnotationValue value = 2;
}
message AnnotationTag {
  oneof tag {
    string text = 1;
    AnnotationSymbolTag symbol = 2;
    AnnotationSourceReference source = 3;
    EntityRef entity = 4;
    AnnotationProperty property = 5;
  }
}
message AnnotationPropertyPredicate {
  string key = 1;
  enum Comparison {
    COMPARISON_UNSPECIFIED = 0;
    COMPARISON_EQUAL = 1;
    COMPARISON_LESS = 2;
    COMPARISON_LESS_OR_EQUAL = 3;
    COMPARISON_GREATER = 4;
    COMPARISON_GREATER_OR_EQUAL = 5;
    COMPARISON_EXISTS = 6;
  }
  Comparison comparison = 2;
  // Absent only for EXISTS. No string/numeric or integer/decimal coercion.
  // Ordering is supported only for integer and decimal values.
  AnnotationValue value = 3;
}
message AnnotationTagPredicate {
  oneof predicate {
    AnnotationTag exact = 1;
    string symbol_name = 2;
    // Exact relative path, or component-aware directory prefix. Both include
    // resolved Symbol targets as well as Source tags, within any revision.
    string file_path = 3;
    string file_prefix = 4;
    // Overlap requires the same spool, revision and path. Optional Thread
    // narrows further. Coordinates on different revisions never overlap.
    AnnotationSourceReference lines_overlap = 5;
    AnnotationPropertyPredicate property = 6;
  }
}
message AnnotationQuery {
  // At most 64 predicates in total. Each predicate matches one complete tag.
  // ALL must all match; ANY must match at least one unless empty; NONE must
  // all fail. Missing properties fail positive predicates, including equality.
  repeated AnnotationTagPredicate all = 1;
  repeated AnnotationTagPredicate any = 2;
  repeated AnnotationTagPredicate none = 3;
}

message ContextRecord {
  RecordRef ref = 1;
  bytes version = 2;
  CollaborationAnchor anchor = 3;
  string content = 4;
  repeated AnnotationTag tags = 5;
  string principal_id = 6;
  string agent_id = 7;
  RecordRef supersedes = 8;
  RecordRef extracted_from = 9;
  Coverage anchor_coverage = 10;
  bool superseded = 11;
  // Context revisions form a causal register. Concurrent current revisions
  // share ref and version; retain each causal_id instead of choosing a winner.
  // expected_version uses the aggregate current-frontier version, including
  // when include_history also returns an earlier revision.
  bytes causal_id = 12;
  repeated bytes causal_parents = 13;
  repeated bytes causal_heads = 14;
  // Same live display-name semantics as DiscussionTurn.author_display_name.
  // Historical context revisions resolve at observation time, not admission.
  string author_display_name = 15;
}

// Write input. Actor attribution is carried by the signed canonical operation;
// coverage and current-view versions are server projections, never client input.
message ContextDraft {
  RecordRef ref = 1;
  CollaborationAnchor anchor = 2;
  string content = 3;
  repeated AnnotationTag tags = 4;
  RecordRef supersedes = 5;
  RecordRef extracted_from = 6;
}

message ObserveCollaborationRequest {
  SpoolRef spool = 1;
  repeated CollaborationAnchor anchors = 2;
  repeated DiscussionRecord.Status statuses = 3;
  repeated RecordRef discussions = 4;
  repeated RecordRef contexts = 5;
  bool include_history = 6;
  PageRequest page = 7;
  ObserveOptions observe = 8;
  // Include original author-signed operations for portable replica ingestion.
  // UI-only consumers can omit them; projection versions are not causal proofs.
  bool include_operations = 9;
  // Presence selects context revisions only, including an empty match-all query.
  // Predicates apply per revision; concurrent heads remain separate results.
  AnnotationQuery annotations = 10;
  // At most 64, unique by Thread, in this request's Spool. Each revision must
  // belong to its named Thread. ViewedThread bindings resolve at this revision;
  // omission uses that Thread's unique current source head. NamedThread and
  // PinnedRevision bindings retain their explicit policies.
  repeated SourceTargetView source_views = 11;
}

message CollaborationEvent {
  StreamFrame frame = 1;
  oneof payload {
    DiscussionRecord discussion = 2;
    DiscussionTurn turn = 3;
    ContextRecord context = 4;
    Removal removal = 5;
    SectionStatus status = 6;
    SignedRecord operation = 7;
    SourceTargetResolutionEvent source_target = 8;
  }
}

message OpenDiscussionRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  CollaborationAnchor anchor = 3;
  string title = 4;
  string initial_body = 5;
  bool blocking = 6;
  // Canonical actor-signed Thread operation. The request PoP authorizes this
  // delivery; it cannot substitute for the portable operation signature.
  SignedRecord signed_operation = 7;
  // Required explicit audience. Private requires a nonempty audience_label;
  // other audiences require an empty label. Sharing never widens this audience.
  Audience audience = 8;
  string audience_label = 9;
}

message AppendDiscussionRequest {
  string client_operation_id = 1;
  RecordRef discussion = 2;
  // Heads the author observed; concurrent appends are retained.
  repeated bytes causal_parents = 3;
  string body = 4;
  repeated EntityRef mentions = 5;
  SignedRecord signed_operation = 6;
}

message ResolveDiscussionRequest {
  string client_operation_id = 1;
  RecordRef discussion = 2;
  bytes expected_version = 3;
  oneof resolution {
    ContextDraft extract_context = 4;
    RevisionRef resolved_by_edit = 5;
    string dismissal_reason = 6;
  }
  // Original author-signed canonical operation. The override marker is derived
  // by the admitting server and exposed via DiscussionResolutionRecord; it is
  // never a client input and does not change these signed bytes.
  SignedRecord signed_operation = 7;
}

// Reopening a blocking discussion obeys the same inherited rule as resolving;
// non-blocking discussions retain ordinary writer authorization.
message ReopenDiscussionRequest {
  string client_operation_id = 1;
  RecordRef discussion = 2;
  bytes expected_version = 3;
  string reason = 4;
  SignedRecord signed_operation = 5;
}

message PutContextRequest {
  string client_operation_id = 1;
  ContextDraft context = 2;
  bytes expected_version = 3;
  SignedRecord signed_operation = 4;
  // Empty expected version creates; existing records require the observed
  // version. History is appended, never replaced by editing an old revision.
}
