syntax = "proto3";

package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/common/errors.proto";
import "heddle/api/common/types.proto";
import "heddle/api/v1alpha2/stream.proto";

message PrincipalRef {
  // Stable account UUID. Handles and active signing keys can change.
  string id = 1;
}

// Stable delegated agent identity, scoped to its owning account. Neither a
// display name nor a rotating signing key is an agent's resource identity.
message AgentRef {
  PrincipalRef account = 1;
  string id = 2;
}

// Public presentation only; never carries credential, account settings or rights.
message PublicPrincipalSummary {
  string id = 1;
  string handle = 2;
  string display_name = 3;
}

// A display label for a publicly visible account. Neither field grants
// access or supplies an owner verification key.
message PublicOwner {
  // Already-public canonical owner handle, without an address separator.
  string handle = 1;
  // Already-public owner display name; may be empty.
  string display_name = 2;
}

message SpoolRef {
  // Stable spool UUID; names, paths and account handles are presentation.
  string id = 1;
}

// Existence/history audience for a spool. Numeric tags match v1 Visibility
// (PRIVATE=1, INTERNAL/MEMBERS=2, PUBLIC=3). Do not add AUDIENCE_INTERNAL.
//
// AUDIENCE_MEMBERS — principals who hold a GrantRecord or MemberRecord on
// this spool, or a GrantRecord on an ancestor with include_descendants=true
// that reaches this spool (unexpired), or an unrevoked native_support_access
// row on this spool or on such an ancestor. It is not "any signed-in Heddle
// user" and is not keyed on parent kind. CreateSpool / ReviseSpool do not
// reject MEMBERS by parent kind. An ancestor grant with
// include_descendants=false does not admit a child. Persistence may store
// the token "internal"; a later rename to "members" is not a widening.
//
// Coherence: default_state_audience <= audience. No PRIVATE-existence +
// MEMBERS-history carve-out. PUBLIC history requires PUBLIC existence.
// Discriminant order is restrictiveness: PRIVATE < MEMBERS < PUBLIC.
//
// An owner-signed max_audience ceiling cannot widen this table; it only
// stops delegated writes from moving this spool or a descendant to a wider
// cell. See SignedSpoolPolicy.max_audience.
enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_PRIVATE = 1;
  AUDIENCE_MEMBERS = 2;
  AUDIENCE_PUBLIC = 3;
}

// Observed address of a stable Spool identity. Renames change the address,
// never the UUID. An address is presentation/routing metadata, not authority.
message SpoolAddress {
  SpoolRef ref = 1;
  repeated string path_segments = 2;
}

message ThreadId {
  // Exactly 32 bytes: hash of a versioned immutable creation record.
  // Canonical genesis encoding is a separate durable-format decision; endpoints
  // MUST NOT advertise creation until they implement the negotiated format.
  bytes value = 1;
}

message ThreadRef {
  SpoolRef spool = 1;
  ThreadId id = 2;
}

message CheckoutRef {
  SpoolRef spool = 1;
  EndpointRef device = 2;
  string id = 3;
}

message RevisionRef {
  SpoolRef spool = 1;
  oneof revision {
    heddle.api.common.StateId state = 2;
    // Exact lower-case object ID, never a mutable ref or abbreviated hash.
    string git_commit_oid = 3;
  }
}

message RecordRef {
  SpoolRef spool = 1;
  string id = 2;
}

// Caller-private preference identity; changing it never changes its target.
message BookmarkRef {
  // Must be the authenticated caller's account, including delegated agents.
  PrincipalRef account = 1;
  oneof target {
    SpoolRef spool = 2;
    ThreadRef thread = 3;
  }
}

message EntityRef {
  oneof entity {
    SpoolRef spool = 1;
    ThreadRef thread = 2;
    CheckoutRef checkout = 3;
    RevisionRef revision = 4;
    RecordRef discussion = 5;
    RecordRef context = 6;
    RecordRef operation = 7;
    RecordRef run = 8;
    RecordRef policy = 9;
    RecordRef analysis = 10;
    RecordRef invitation = 11;
    RecordRef grant = 12;
    RecordRef discussion_turn = 13;
    RecordRef review = 14;
    RecordRef notification = 15;
    RecordRef attention_item = 16;
    RecordRef member = 17;
    RecordRef approval_group = 18;
    RecordRef session = 19;
    RecordRef signup_invitation = 20;
    EndpointRef device = 21;
    RecordRef timeline_event = 22;
    RecordRef artifact = 23;
    BookmarkRef bookmark = 24;
    RecordRef mount = 25;
    RecordRef support_access = 26;
    // Registry identity is distinct from the device's transport locator.
    RecordRef device_record = 27;
    RecordRef delegation = 28;
    RecordRef recovery = 29;
    RecordRef owner_transition = 30;
    RecordRef billing = 31;
    RecordRef evidence = 32;
    RecordRef check_acknowledgement = 33;
    RecordRef provider_connection = 34;
    RecordRef remote_link = 35;
    RecordRef passkey = 36;
    PrincipalRef principal = 37;
    AgentRef agent = 38;
  }
}

message ExpectedVersion {
  EntityRef resource = 1;
  // Opaque compare-and-swap version returned with that resource's observation.
  bytes version = 2;
}

message Removal {
  // A deletion or removal from the current filtered window. It is not a claim
  // that source bytes were purged. Lost authority may instead terminate a view.
  EntityRef resource = 1;
}

enum Coverage {
  COVERAGE_UNSPECIFIED = 0;
  COVERAGE_NOT_REQUESTED = 1;
  COVERAGE_PENDING = 2;
  COVERAGE_PARTIAL = 3;
  COVERAGE_COMPLETE = 4;
  COVERAGE_STALE = 5;
  COVERAGE_UNAVAILABLE = 6;
  COVERAGE_FAILED = 7;
}

// A safe explanation for partial or unavailable section coverage. Reasons never
// grant access or disclose withheld content, identifiers, paths, or counts.
enum SectionStatusReason {
  // No explanation supplied (including older servers). Clients show a generic
  // coverage label; unknown future codes must use the same fallback.
  SECTION_STATUS_REASON_UNSPECIFIED = 0;
  // Required base ancestry cannot be resolved/read to build the comparison.
  // Clients show "Base ancestry unavailable", not an empty successful diff.
  SECTION_STATUS_REASON_BASE_ANCESTRY_UNAVAILABLE = 1;
  // Caller authority withholds data. Set only when this coarse state is safe
  // to disclose; preserve indistinguishable forbidden/absent responses otherwise.
  // Clients show "Access unavailable" without revealing any withheld content.
  SECTION_STATUS_REASON_ACCESS_WITHHELD = 2;
  // Multiple caller-visible heads prevent selecting one comparison head.
  // Clients show "Multiple heads" and offer explicit selection when supported.
  SECTION_STATUS_REASON_MULTIPLE_HEADS = 3;
  // Some requested coverage cannot be established and no more specific safe
  // reason applies. Clients show "Coverage incomplete" with available results.
  SECTION_STATUS_REASON_COVERAGE_INCOMPLETE = 4;
}

message SectionStatus {
  // Contract-defined section name, not a client-supplied query expression.
  string section = 1;
  Coverage coverage = 2;
  RevisionRef computed_for = 3;
  RecordRef operation = 4;
  PageInfo page = 5;
  // Supplement for COVERAGE_PARTIAL or COVERAGE_UNAVAILABLE; otherwise leave
  // UNSPECIFIED. Coverage remains authoritative. Set the most specific safe
  // reason, preferring ACCESS_WITHHELD if another code would expose hidden state.
  // Replace it with coverage at each status update; never retain a stale reason.
  SectionStatusReason reason = 6;
}

message SectionReplacement {
  // Stage clearing this section before subsequent records in the same bounded
  // batch. The clear becomes visible only at checkpoint, like the records.
  // Use for head-dependent diffs/evidence and collections without stable keys.
  string section = 1;
}

enum RequirementKind {
  REQUIREMENT_KIND_UNSPECIFIED = 0;
  REQUIREMENT_KIND_CAPABILITY = 1;
  REQUIREMENT_KIND_HUMAN_SIGNATURE = 2;
  REQUIREMENT_KIND_REVIEW = 3;
  REQUIREMENT_KIND_EVIDENCE = 4;
  REQUIREMENT_KIND_CONFLICT_RESOLUTION = 5;
  REQUIREMENT_KIND_WRITER_HANDOFF = 6;
  REQUIREMENT_KIND_INTENT_APPROVAL = 7;
  REQUIREMENT_KIND_ANALYSIS = 8;
  REQUIREMENT_KIND_PUBLICATION = 9;
  REQUIREMENT_KIND_REFRESH = 10;
  REQUIREMENT_KIND_POLICY = 11;
  REQUIREMENT_KIND_DISCUSSION = 12;
}

// Specific cause from a landing evaluator or a blocked LandThread/LandStack
// mutation receipt. Never infer it from explanation text. EVIDENCE_* pairs
// with Requirement.kind=EVIDENCE; REVIEW_* with REVIEW; REFRESH_* with
// REFRESH; POLICY_* with POLICY; CONFLICT_* with CONFLICT_RESOLUTION; and
// DISCUSSION_* with DISCUSSION. UNSPECIFIED is only a legacy/unknown cause,
// never evidence that landing is permitted. Do not report hidden record detail.
enum LandingRequirementKind {
  LANDING_REQUIREMENT_KIND_UNSPECIFIED = 0;
  LANDING_REQUIREMENT_KIND_EVIDENCE_MISSING = 1;
  LANDING_REQUIREMENT_KIND_EVIDENCE_STALE = 2;
  LANDING_REQUIREMENT_KIND_EVIDENCE_FAILED = 3;
  LANDING_REQUIREMENT_KIND_REVIEW_MISSING = 4;
  LANDING_REQUIREMENT_KIND_REVIEW_REJECTED = 5;
  LANDING_REQUIREMENT_KIND_REVIEW_CONCURRENT = 6;
  LANDING_REQUIREMENT_KIND_REFRESH_TARGET_MOVED = 7;
  LANDING_REQUIREMENT_KIND_POLICY_VERSION_CHANGED = 8;
  LANDING_REQUIREMENT_KIND_CONFLICT_MULTIPLE_HEADS = 9;
  LANDING_REQUIREMENT_KIND_CONFLICT_UNRESOLVED_METADATA = 10;
  LANDING_REQUIREMENT_KIND_DISCUSSION_BLOCKING = 11;
  LANDING_REQUIREMENT_KIND_CONFLICT_SOURCE_TARGET_DIVERGED = 12;
  LANDING_REQUIREMENT_KIND_CONFLICT_TARGET_MULTIPLE_HEADS = 13;
  LANDING_REQUIREMENT_KIND_CONFLICT_TARGET_NAME = 14;
  LANDING_REQUIREMENT_KIND_CONFLICT_TARGET_FRONTIER = 15;
  LANDING_REQUIREMENT_KIND_POLICY_DEFAULT_UNAVAILABLE = 16;
  LANDING_REQUIREMENT_KIND_POLICY_APPROVAL_GROUP_UNAVAILABLE = 17;
  LANDING_REQUIREMENT_KIND_POLICY_AUTHOR_BINDING_UNAVAILABLE = 18;
  LANDING_REQUIREMENT_KIND_REFRESH_SOURCE_ALREADY_LANDED = 19;
}

message Requirement {
  RequirementKind kind = 1;
  EntityRef subject = 2;
  RecordRef policy = 3;
  bytes policy_version = 4;
  string explanation = 5;
  // Canonical typed RPC route; advice never grants authority or executes it.
  string recovery_method = 6;
  // Set for landing assessments and blocked LandThread/LandStack mutation
  // receipts. The broad kind remains for older clients; use the typed cause
  // for landing presentation. Other operations leave this unset.
  LandingRequirementKind landing_kind = 7;
  // Typed unmet precondition, with the same semantics/privacy as Blocked.error.
  // Membership floor advice uses POLICY and the target grant as subject.
  // On PutGrant, field "grant.role" applies to proposals below ADMINISTRATOR,
  // not role-preserving edits/upgrades. Never infer this cause from explanation.
  heddle.api.common.ErrorDetail error = 8;
}

// Stable semantic affordance, independent of RPC spelling. Never authority.
// Zero/unknown values mean unknown: do not infer permission or show an action.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_RECORD_REVIEW = 1;
  CAPABILITY_LAND = 2;
  CAPABILITY_PUT_GRANT = 3;
  CAPABILITY_CREATE_INVITATION = 4;
  CAPABILITY_REVISE_SPOOL = 5;
  // Platform advice requires a fresh matching PlatformAdminService check within
  // each request before any side effect; these values never confer authority.
  CAPABILITY_PLATFORM_EMAIL_TEMPLATES = 6;
  CAPABILITY_PLATFORM_EMAIL_DELIVERY = 7;
  CAPABILITY_PLATFORM_ANALYTICS = 8;
  CAPABILITY_PLATFORM_INVITATION_DIRECTORY = 9;
  CAPABILITY_ACCEPT_INVITATION = 10;
  CAPABILITY_DECLINE_INVITATION = 11;
  CAPABILITY_REVOKE_GRANT = 12;
}

message ActionAvailability {
  string method = 1;
  EndpointRef endpoint = 2;
  EntityRef target = 3;
  bool implemented = 4;
  bool authorized = 5;
  repeated Requirement requirements = 6;
  repeated ExpectedVersion observed_versions = 7;
  // A known capability still requires implemented, authorized and no unmet
  // requirements. method remains the concrete route; missing advice is unknown.
  Capability capability = 8;
}

message Applied {
  repeated ExpectedVersion resulting_versions = 1;
}

message Blocked {
  repeated Requirement requirements = 1;
  // Primary typed refusal, matching existing CallFailure.error semantics.
  // Populate for settings, invitation, seat and plan refusals. Never reveal
  // hidden resources/policies; absent/zero/unknown reasons are generic refusal.
  heddle.api.common.ErrorDetail error = 2;
}

message MutationReceipt {
  string client_operation_id = 1;
  EndpointRef endpoint = 2;
  oneof outcome {
    Applied applied = 3;
    RecordRef pending_operation = 4;
    Blocked blocked = 5;
  }
  // Completion here is at endpoint. Publication has a separate receipt.
  google.protobuf.Timestamp observed_at = 6;
}

message MutationResponse {
  MutationReceipt receipt = 1;
}

message SkippedImportRef {
  string name = 1;
  string reason = 2;
}

message ImportReport {
  enum Fidelity {
    FIDELITY_UNSPECIFIED = 0;
    FAITHFUL = 1;
    PARTIAL = 2;
    FAILED = 3;
  }
  Fidelity fidelity = 1;
  uint64 commits = 2;
  uint64 branches = 3;
  uint64 tags = 4;
  repeated SkippedImportRef skipped_refs = 5;
}

// Typed operation identity. Same resource as OperationRecord.ref and existing
// RecordRef command inputs; links never confer permission to observe it.
message OperationRef {
  SpoolRef spool = 1;
  string id = 2;
}

// Extensible subject union. Absent/unknown case means unavailable, not a guess
// from the destination spool's name or current remotes.
message OperationSubject {
  oneof subject {
    ImportOperationSubject import = 1;
  }
}

// HYBRID logical-job discovery only; destination is OperationRecord.ref.spool.
// Not a physical operation ID, retry lineage, client operation ID or authority.
message HybridImportJobSelector {
  bytes logical_job_id = 1; // Exactly 16 bytes; the all-zero ID is invalid.
}

message ImportOperationSubject {
  // Source admitted for this attempt. Credential-free URL: never project
  // userinfo, secret query parameters, or a source hidden from this caller.
  string source_url = 1;
  // ProviderConnection.provider + ProviderRepository.provider_repository_id.
  // Both populated or both empty; source_url, this pair or hybrid_job is present.
  string provider = 2;
  string provider_repository_id = 3;
  // Populate from the durable destination/job association on EVERY physical
  // HYBRID attempt: initial and retry. Stable within that logical job,
  // including historical/terminal attempts; never infer it from attempt IDs.
  // Absent for non-HYBRID imports or before association is durably available.
  // Absent/unknown subject also means unavailable, never a guessed selector.
  // Visible only with the operation, independently of source-detail visibility.
  // Grants NO control authority: GetImportJobState remains destination-writer
  // only; control requests still require their existing authorization/signatures.
  HybridImportJobSelector hybrid_job = 4;
}

message OperationRecord {
  RecordRef ref = 1;
  string client_operation_id = 2;
  bytes version = 3;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED = 1;
    STATE_RUNNING = 2;
    STATE_COMPLETED = 3;
    STATE_FAILED = 4;
    STATE_CANCELED = 5;
    STATE_WAITING_FOR_HUMAN = 6;
    // Execution has acknowledged a pause. A queued pause request alone does
    // not establish this state, and resume preserves the same operation/run.
    STATE_PAUSED = 7;
  }
  State state = 4;
  uint64 completed_units = 5;
  optional uint64 total_units = 6;
  string unit = 7;
  bool cancellation_supported = 8;
  bool cancellation_requested = 9;
  heddle.api.common.CallFailure failure = 10;
  repeated EntityRef results = 11;
  repeated Requirement requirements = 12;
  // Current observed affordances. Clients still submit against this record's
  // exact version; the server rechecks authorization at command admission.
  repeated ActionAvailability actions = 13;
  ImportReport import_report = 14;
  OperationSubject subject = 15;
  // Admission, first execution, and terminal completion/failure/cancellation.
  // Omit unknown times; queued cancellation may finish without ever starting.
  // When present: created <= started <= finished. Pause/resume retains start.
  // Display times never establish causality or replace this record's CAS.
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp started_at = 17;
  google.protobuf.Timestamp finished_at = 18;
  // Direct predecessor/replacement, recorded atomically at retry admission.
  // Same subject/destination; no cycles/self-links. Original execution history
  // stays intact; updating supersession metadata advances the observed version.
  OperationRef retry_of = 19;
  // A superseded failure is historical, not live, even if the retry is queued
  // or fails. At most one direct replacement; historical attempts offer no
  // further retry. Omit unreadable links; absence then means unknown.
  OperationRef superseded_by = 20;
}

// A durable, versioned record. Its format defines canonical bytes, domain,
// signature algorithm, bounds and verifier. Generic protobuf serialization is
// never the signing input. Unknown critical formats fail closed.
message SignedRecord {
  string format = 1;
  bytes canonical_record = 2;
  repeated RecordSignature signatures = 3;
}
message RecordSignature {
  bytes public_key = 1;
  bytes signature = 2;
}
