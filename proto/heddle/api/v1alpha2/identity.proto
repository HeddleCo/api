syntax = "proto3";
package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/common/errors.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/owner_records.proto";
import "heddle/api/v1alpha2/owner_views.proto";
import "heddle/api/v1alpha2/stream.proto";

// Original author evidence bound into each signed Thread metadata operation.
// Supplied history never establishes trust: receivers verify against separately
// admitted current account authority at first durable admission. Canonical
// protobuf encoding is mandatory and the entire envelope is bounded to 64 KiB.
message ThreadControlAuthority {
  uint32 format = 1; // Must be 1.
  OwnerHistory owner = 2;
  bytes mint_root_public_key = 3; // Ed25519, exactly 32 bytes.
  // Durable owner-signed roots and temporary passkey roots are deliberately
  // distinct proof shapes; verifiers never reinterpret one as the other. A
  // verifier MUST scan the raw message before protobuf decoding and reject an
  // encoding containing both tags 4 and 6; oneof last-wins decoding is unsafe.
  oneof mint_root_association {
    SignedOwnerMintRootAttachment owner_mint_root_attachment = 4;
    SignedMintRootAttachment passkey_mint_root_attachment = 6;
  }
  // Sealed Biscuit only: never publish an appendable credential's proof secret.
  bytes sealed_biscuit = 5;
}

// User-root proof is portable. Account association records Weft's acceptance of
// an already user-authorized key; it is not the source of that key's authority.
message RootAttachment {
  bytes root_public_key = 1;
  bytes subject_public_key = 2;
  EndpointRef device = 3;
  SignedRecord attachment = 4;
  // Verification binds root, subject, device, scope, validity and possession.
  // An empty attachment is valid only for a directly proved root key.
}
// Portable binding of a proved delegated key to its Iroh endpoint. Authority
// remains the Biscuit's complete attenuation chain, not this locator binding.
// SignedRecord format heddle.root-attachment.v2 carries canonical bytes signed
// by both endpoint and subject (one signature when the keys are equal).
// The shared verifier requires a locally trusted root, verifies the Biscuit's
// effective proof key and limits, then verifies digest, time and endpoint.
message RootAttachmentBinding {
  uint32 format_version = 1;
  bytes root_public_key = 2;
  bytes subject_public_key = 3;
  EndpointRef device = 4;
  bytes credential_digest = 5;
  int64 not_before_unix_seconds = 6;
  int64 expires_at_unix_seconds = 7;
  string account_id = 8;
  bytes pairing_challenge = 9;
}
// Account onboarding state, never a substitute for a verified capability or
// owner-root binding. Promotions are explicit; a credential's attenuation must
// survive promotion of its account. AGENT_ROOTED denotes an unclaimed human
// account with an empty independent-root slot, not an account owned by an agent.
enum RootingTier {
  ROOTING_TIER_UNSPECIFIED = 0;
  ROOTING_TIER_SELF_ROOTED = 1;
  ROOTING_TIER_SERVER_ROOTED = 2;
  ROOTING_TIER_AGENT_ROOTED = 3;
}
message PrincipalRecord {
  string id = 1;
  string handle = 2;
  bytes version = 3;
  bytes root_public_key = 4;
  repeated RootAttachment attachments = 5;
  string account_id = 6;
  string acting_agent_id = 7;
  repeated EntityRef authorized_resources = 8;
  repeated ActionAvailability actions = 9;
  EntitlementRecord entitlement = 10;
  RootingTier rooting_tier = 11;
  // Generated pet name while agent-rooted and unclaimed; handle stays empty.
  string display_name = 12;
  // Personal namespace for creation and remote provisioning. Omitted when it
  // has not been created or is unavailable to this observing credential.
  SpoolAddress personal_spool = 13;
}
message EntitlementRecord {
  string plan = 1;
  uint64 storage_used_bytes = 2;
  uint64 storage_limit_bytes = 3;
}
message SessionRecord {
  RecordRef ref = 1;
  // Opaque version of durable authorization state, usable directly for revoke.
  // Serving endpoint and viewer-specific metadata do not affect this version.
  bytes version = 2;
  EndpointRef endpoint = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool revoked = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  string user_agent = 8;
  string ip_address = 9;
  bool is_current = 10;
}

// Account-private passkey inventory, requested through ObserveIdentity. The
// certificate is public verification material; no credential private key or
// reusable assertion is returned. Device registration is a separate lifecycle.
message PasskeyRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string label = 3;
  SignedPasskeyAuthority certificate = 4;
  bool revoked = 5;
}
message DelegationRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string label = 3;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_AGENT = 1;
    KIND_SERVICE = 2;
    KIND_DEVICE = 3;
  }
  Kind kind = 4;
  RootAttachment subject = 5;
  SignedRecord delegation = 6;
  bool revoked = 7;
  // Secret bearer material is never returned as an account-view record.
}
message SignupInvitation {
  RecordRef ref = 1;
  bytes version = 2;
  string bound_email = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool redeemed = 5;
  bool revoked = 6;
  string distribution_id = 7;
}
message InvitationQuota {
  string distribution_id = 1;
  uint32 remaining = 2;
}
// Explicit ceremony selection; omitted or unsupported methods are rejected.
// Password unlocks a client-held owner key; OAuth retains its own ceremony.
// Neither a password verifier signature nor an OAuth proof is owner authority.
enum CredentialMethod {
  CREDENTIAL_METHOD_UNSPECIFIED = 0;
  CREDENTIAL_METHOD_PASSKEY = 1;
  CREDENTIAL_METHOD_PASSWORD = 2;
  CREDENTIAL_METHOD_OAUTH = 3;
}
enum OAuthProvider {
  O_AUTH_PROVIDER_UNSPECIFIED = 0;
  O_AUTH_PROVIDER_GOOGLE = 1;
  O_AUTH_PROVIDER_APPLE = 2;
  O_AUTH_PROVIDER_GITHUB = 3;
  O_AUTH_PROVIDER_GITLAB = 4;
}
// Encrypted 32-byte Ed25519 owner seed. The server stores and returns these
// opaque bytes, never a password, KEK, auth seed, or decrypted owner seed.
// Reject unknown versions/KDFs before use. Discard unknown protobuf fields and
// persist only the canonical re-encoding of known fields (<= 4096 bytes).
// AES-GCM AAD is ASCII("heddle-owner-wrap-aad-v1") || 0x00 || u32be(version)
// || account_uuid || owner_public_key || owner_id || u32be(kdf_id)
// || u32be(memory_kib) || u32be(iterations) || u32be(parallelism) || wrap_salt.
message PasswordOwnerEnvelopeV1 {
  uint32 format_version = 1; // Exactly 1; reject any other value.
  bytes account_uuid = 2; // Exactly 16 bytes, non-nil.
  bytes owner_public_key = 3; // Exactly 32 bytes; canonical, decompressible, non-small-order Ed25519 key.
  bytes owner_id = 4; // Exactly 32 bytes; digest of the accepted root.
  uint32 kdf_id = 5; // Exactly 1 = Argon2id; reject unknown KDFs.
  uint32 memory_kib = 6; // Exactly 65536 in v1; reject other costs.
  uint32 iterations = 7; // Exactly 3 in v1.
  uint32 parallelism = 8; // Exactly 4 in v1.
  bytes wrap_salt = 9; // Exactly 16 independent random bytes.
  bytes nonce = 10; // Exactly 12 fresh random AES-256-GCM bytes.
  bytes ciphertext_and_tag = 11; // Exactly 48 bytes (32-byte seed + 16-byte tag).
}

// Public authentication metadata, stored separately from the encrypted seed.
// Client input is UTF8(NFC(password)), preserving case and all spaces. Client
// guidance is 15+ Unicode characters and at most 1024 UTF-8 bytes; the server
// cannot enforce strength without seeing the password. The independent inputs
// are UTF8("heddle-password-auth-v1") || 0x00 || UTF8(NFC(password)) with
// auth_salt, and UTF8("heddle-owner-wrap-v1") || 0x00 || UTF8(NFC(password))
// with wrap_salt. Both use the recorded Argon2id costs and 32-byte output.
// Only the Ed25519 public key derived from auth_seed crosses the network.
// Discard unknown fields, including nested envelope fields, and persist only
// the canonical re-encoding of known fields (<= 4608 bytes).
// The verifier and owner keys MUST be canonical, decompressible, and non-small-order.
// Ed25519 signatures use strict verification: canonical R and S, non-small-order
// points, and the standard group equation. Rust uses verify_strict; WebCrypto
// callers MUST precheck these conditions before its verify operation.
message PasswordOwnerSetup {
  PasswordOwnerEnvelopeV1 envelope = 1; // Required; <= 4096 encoded bytes.
  bytes auth_salt = 2; // Exactly 16 bytes, different from wrap_salt.
  bytes auth_verifier_public_key = 3; // Exactly 32-byte Ed25519 public key, never an auth seed.
  uint32 auth_memory_kib = 4; // Exactly 65536 in v1.
  uint32 auth_iterations = 5; // Exactly 3 in v1.
  uint32 auth_parallelism = 6; // Exactly 4 in v1.
  uint32 auth_kdf_id = 7; // Exactly 1 = Argon2id in v1.
  uint32 format_version = 8; // Exactly 1 in v1.
  // Future cost policies use a monotone floor, never below the pinned v1
  // minimum. Existing envelopes remain readable at their recorded costs.
  // Ed25519 signs the exact 32-byte RegistrationChallenge.challenge at signup,
  // or the signed setup-authorization digest on PUT. The server verifies this
  // with auth_verifier_public_key before persisting; the signature is excluded
  // from setup_sha256 to avoid a circular transcript.
  bytes auth_verifier_possession_signature = 9; // Exactly 64 bytes.
}

// Only returned for PASSWORD. Every handle without an active password setup
// (unknown, passkey-only, deleted, or disabled) gets indistinguishable public
// metadata: salt and revision derived deterministically from a server secret
// and the canonical handle, with the same costs and response shape. Challenge
// IDs/nonces remain fresh. The server binds the account internally, never via
// a handle-to-UUID value at begin. Creation is throttled; expiry <= 10 minutes.
message PasswordChallengeMetadata {
  reserved 1;
  reserved "account_uuid";
  bytes auth_salt = 2; // Exactly 16 bytes.
  uint32 auth_memory_kib = 3; // Exactly 65536 in v1.
  uint32 auth_iterations = 4; // Exactly 3 in v1.
  uint32 auth_parallelism = 5; // Exactly 4 in v1.
  uint64 envelope_revision = 6; // Nonzero; synthetic when setup is inactive.
  bytes challenge_id = 7; // Exactly 32 random bytes, one-use.
  bytes nonce = 8; // Exactly 32 random bytes, one-use.
}

// Proof of the public password verifier only. This message is never accepted
// by CompleteAuthentication, an owner mutation, or a credential issuer.
// Ed25519 signs SHA-256("heddle-password-proof-v1" || canonical transcript):
// challenge_id[32] || nonce[32] || u64be(revision)
// || caller_device_public_key[32] || u32be(operation_id UTF-8 byte length)
// || operation_id UTF-8 || i64be(expiry Unix seconds). No protobuf is signed.
message PasswordChallengeProof {
  bytes challenge_id = 1; // Exactly 32 bytes.
  bytes signature = 2; // Exactly 64 Ed25519 bytes.
  uint64 envelope_revision = 3; // Nonzero; equals challenge revision.
  bytes caller_device_public_key = 4; // Exactly 32 bytes; equals begin key.
}

message ProvePasswordUnlockRequest {
  string client_operation_id = 1; // 1..128 UTF-8 bytes, bound into proof.
  PasswordChallengeProof proof = 2; // Required; no owner authority.
  // CallContext.request_proof MUST be signed by proof.caller_device_public_key,
  // which equals the begin key. Every failed attempt consumes this challenge.
  // Reusing client_operation_id with a different proof is a conflict.
  // Apply shared, atomic per-account and per-IP/prefix limits before verification:
  // <=5 failed proofs/completions per account and <=20 per IP/prefix per 15 min;
  // 15-minute account cooldown, progressively extended to at most one hour.
  // Unknown account, bad proof, locked account, and wrong revision all return
  // CALL_FAILURE_CODE_UNAUTHENTICATED without account-specific details.
}

// One-use delivery receipt, never a session, bearer, owner authorization or
// Biscuit. The continuation is bound to the challenge, revision, account and
// caller device, expires with the challenge, and is consumed at completion.
message PasswordUnlockContinuation {
  PasswordOwnerEnvelopeV1 envelope = 1; // Required; <= 4096 bytes.
  bytes continuation_id = 2; // Exactly 32 unpredictable bytes.
  OwnerState current_owner_state = 3; // Public; client verifies active root.
  uint64 envelope_revision = 4; // Nonzero; equals proof revision.
  google.protobuf.Timestamp expires_at = 5; // Within 2 minutes and at most challenge expiry.
}

// The owner signs this exact admission, independently of the password proof.
// Ed25519 signs SHA-256("heddle-password-device-admission-v1" ||
// u32be(format_version) || account_uuid[16] || challenge_id[32] ||
// continuation_id[32] || caller_device_public_key[32] ||
// owner_state_hash[32] || u64be(owner_sequence) ||
// u32be(client_operation_id UTF-8 byte length) || client_operation_id UTF-8).
message PasswordDeviceAdmission {
  uint32 format_version = 1; // Exactly 1; reject unknown versions.
  bytes account_uuid = 2; // Exactly 16 bytes, non-nil.
  bytes challenge_id = 3; // Exactly 32 bytes.
  bytes continuation_id = 4; // Exactly 32 bytes.
  bytes caller_device_public_key = 5; // Exactly 32 bytes.
  bytes owner_state_hash = 6; // Exactly 32 bytes; current accepted state.
  uint64 owner_sequence = 7; // Current accepted sequence.
  string client_operation_id = 8; // 1..128 UTF-8 bytes; equals completion.
}
message SignedPasswordDeviceAdmission {
  PasswordDeviceAdmission admission = 1;
  AuthorizationSignature owner_signature = 2; // 32-byte key ID, 64-byte signature.
}
message PasswordUnlockCompletion {
  bytes continuation_id = 1; // Exactly 32 bytes; consumed atomically.
  SignedPasswordDeviceAdmission owner_admission = 2; // Required, current root.
  SignedOwnerMintRootAttachment mint_root_attachment = 3; // Required, same device key.
  // Completion's challenge RecordRef MUST equal the continuation's PASSWORD
  // challenge. Completion caller_public_key MUST equal the admission and
  // continuation device keys. The attachment's account_uuid, owner_state_hash,
  // and owner_sequence MUST equal the admission; its mint root key MUST equal
  // the device key. Its nonce MUST equal SHA-256(
  // "heddle-password-mint-nonce-v1" || challenge nonce[32] || continuation ID[32]);
  // its expiry MUST be <= challenge.credential_expires_at. Mismatches fail with
  // CALL_FAILURE_CODE_UNAUTHENTICATED, as do unknown accounts and expired or
  // wrong-revision continuations.
}

// Owner authorization for changing the password envelope. The owner signs
// SHA-256("heddle-password-owner-setup-change-v1" || u32be(format_version)
// || u32be(action) || account_uuid[16] || owner_state_hash[32]
// || u64be(expected_revision) || setup_sha256[32]
// || u32be(client_operation_id UTF-8 byte length) || client_operation_id
// || i64be(expires_at Unix seconds)). expires_at has zero nanos and is future,
// with a bounded lifetime of at most 10 minutes from issuance.
// setup_sha256 is SHA-256 of the fixed-order v1 setup fields (the envelope's
// fields in tag order, followed by auth_salt, verifier key, auth costs,
// auth_kdf_id and format_version; the possession signature is excluded),
// with byte fields raw and integers big-endian. DELETE uses 32 zero bytes.
// The current active account UUID, owner public key and owner ID MUST equal
// the setup envelope fields. Both actions CAS the account-lifetime revision.
// A successful PUT or DELETE atomically increments it and invalidates every
// outstanding password challenge and continuation. DELETE retains a tombstone
// revision; re-setup CASes against that value. Revision 0 is allowed only when
// no password setup has ever existed for this account; no revision is reused.
message PasswordOwnerSetupAuthorization {
  uint32 format_version = 1; // Exactly 1; reject unknown versions.
  uint32 action = 2; // Exactly 1=PUT or 2=DELETE.
  bytes account_uuid = 3; // Exactly 16 bytes, non-nil.
  bytes owner_state_hash = 4; // Exactly 32 bytes, current accepted state.
  uint64 expected_revision = 5; // 0 only if no setup ever existed; CAS thereafter.
  bytes setup_sha256 = 6; // Exactly 32 bytes; zero for DELETE.
  string client_operation_id = 7; // 1..128 UTF-8 bytes.
  google.protobuf.Timestamp expires_at = 8; // Required; covered by signature.
}
message SignedPasswordOwnerSetupAuthorization {
  PasswordOwnerSetupAuthorization authorization = 1;
  AuthorizationSignature owner_signature = 2; // Current active owner key.
}
message PutPasswordOwnerSetupRequest {
  string client_operation_id = 1; // Equals signed authorization.
  PasswordOwnerSetup setup = 2; // Required; new salts and nonce.
  SignedPasswordOwnerSetupAuthorization owner_authorization = 3; // Required.
}
message DeletePasswordOwnerSetupRequest {
  string client_operation_id = 1; // Equals signed authorization.
  SignedPasswordOwnerSetupAuthorization owner_authorization = 2; // Required.
}
message OAuthProof {
  // Provider comes from the original challenge. OIDC tokens bind its nonce;
  // access tokens are verified against that provider's authenticated user API.
  oneof proof {
    string id_token = 1;
    string access_token = 2;
  }
}
message AuthenticationChallenge {
  RecordRef ref = 1;
  // For CREDENTIAL_METHOD_PASSKEY this MUST be exactly the 32-byte
  // passkey_mint_grant_signing_digest(passkey_mint_grant). For PASSWORD this
  // MUST equal password_challenge.nonce (32 bytes); expires_at has zero nanos.
  // OAuth keeps its own challenge semantics.
  bytes challenge = 2;
  string relying_party_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated bytes allowed_credential_ids = 5;
  UserVerification user_verification = 6;
  CredentialMethod method = 7;
  OAuthProvider oauth_provider = 8;
  // Separate from ceremony expiry; completion cannot extend this upper bound.
  google.protobuf.Timestamp credential_expires_at = 9;
  // For passkey-backed temporary authoring, assert the signing digest of this
  // exact account-free grant. Completion cannot replace any of its fields. A
  // hinted begin uses the minimum max_session_ttl_seconds among every returned
  // credential that may sign. An empty-hint begin uses a deployment-configured
  // minimum that every accepted authority satisfies. This issuance choice does
  // not replace the verifier's per-authority ceiling and time-window checks.
  PasskeyMintGrant passkey_mint_grant = 10;
  // Owner-signed certificates for the allowed credentials. Certificate order
  // matches allowed_credential_ids; each id and key are verified at registration.
  // Both lists are empty for an empty account_hint or PASSWORD method.
  repeated SignedPasskeyAuthority passkey_authorities = 11;
  // Present only for PASSWORD; no envelope or account UUID is returned at begin.
  PasswordChallengeMetadata password_challenge = 12;
}
enum UserVerification {
  USER_VERIFICATION_UNSPECIFIED = 0;
  USER_VERIFICATION_REQUIRED = 1;
  USER_VERIFICATION_PREFERRED = 2;
  USER_VERIFICATION_DISCOURAGED = 3;
}
message PasskeyProof {
  bytes credential_id = 1;
  bytes client_data_json = 2;
  bytes authenticator_data = 3;
  bytes signature = 4;
  bytes attestation_object = 5;
  // Raw WebAuthn response.userHandle, bound to the credential's account.
  bytes user_handle = 6;
}
message BeginAuthenticationRequest {
  // Optional for PASSKEY. Empty selects discoverable authentication: begin
  // returns an account-free mint grant with no allowed credential IDs or
  // passkey authorities. Its TTL uses a deployment-configured minimum that
  // every accepted authority satisfies. Nonempty preserves account-selected
  // authentication and uses the minimum TTL ceiling among credentials that may
  // sign. Completion still verifies the selected authority's exact ceiling.
  string account_hint = 1;
  // Device key whose possession CompleteAuthentication must prove.
  // The challenge records this exact key and the enrollment choice below.
  // PASSWORD requires a fresh 32-byte Ed25519 key and enroll_device = true.
  bytes caller_public_key = 2;
  // Explicitly attach a fresh browser key after an existing account passkey
  // verifies this challenge. False requires an already enrolled active key.
  // Enrollment never replaces the human's root, revives a revoked key, or
  // reassigns a key owned by another account. The passkey assertion, request
  // proof, device admission and session receipt commit as one ceremony.
  bool enroll_device = 3;
  string device_label = 4;
  CredentialMethod method = 5;
  // Required exactly when method is OAUTH. Never a caller-supplied issuer URL.
  OAuthProvider oauth_provider = 6;
}
message CompleteAuthenticationRequest {
  reserved 5, 6;
  reserved "mint_root_attachment", "password";
  string client_operation_id = 1;
  RecordRef challenge = 2;
  oneof proof {
    PasskeyProof passkey = 3;
    OAuthProof oauth = 7;
    // Requires owner admission and existing CallContext device-key PoP.
    // All password completion failures use CALL_FAILURE_CODE_UNAUTHENTICATED.
    PasswordUnlockCompletion password_unlock = 10;
  }
  // Same key as BeginAuthentication. CallContext.request_proof signs the
  // exact completion request with this key, including the passkey assertion.
  bytes caller_public_key = 4;
  // Password completion MUST set true and enroll the owner-admitted device.
  // Other methods use the existing explicit browser consent path.
  bool enroll_device = 8;
  // When enroll_device == false, this 32-byte browser-derived ephemeral public
  // key is what Weft delegates the short-TTL ephemeral session Biscuit to
  // (PoP-bound to this key). The decline path holds no device root, so the
  // ephemeral session is renewable and self-revocable against this key only.
  // Forbidden for password completion: password never creates a temporary mint.
  // Ignored when enroll_device == true (an enrolled device roots its own key).
  bytes ephemeral_public_key = 9;
}
message AuthenticationResponse {
  MutationReceipt receipt = 1;
  PrincipalRecord principal = 2;
  CredentialResult credential = 4;
  // Exact accepted root, original binding and current signed transition history.
  // Available immediately after authentication, including while Weft is offline.
  OwnerState ownership = 5;
  // Current owner-signed authority selected by the verified credential. Present
  // for a temporary passkey mint and absent for other authentication methods.
  SignedPasskeyAuthority passkey_authority = 6;
  // Server-assembled owner -> passkey -> temporary mint-key proof. The server
  // uses the persisted grant and verified assertion; clients never supply owner
  // or account fields for this attachment.
  SignedMintRootAttachment mint_root_attachment = 7;
}
// Returned only by a successful credential ceremony, never by an observation.
// Keyed clients retain their own minting authority. Registration attaches their
// proved key to an account/session; it does not mint a bearer or confer an
// independent human root on an agent. Other keyless ceremonies can return an
// issued bearer. Password completion MUST return client_owned, never issued.
message CredentialResult {
  oneof outcome {
    ClientOwnedCredential client_owned = 1;
    IssuedCredential issued = 2;
  }
  SessionRecord session = 3;
  // Original accepted owner proofs where established. An unclaimed agent has
  // no independent human-root bundle; absence does not upgrade its authority.
  OwnerAuthorizationBundle owner_authorization = 4;
  // Exact retained public association for this credential’s original mint root.
  // A paired leaf inherits it; no owner signature or authority is reminted.
  SignedOwnerMintRootAttachment mint_root_attachment = 5;
  // Verified original human authentication, not inferred from credential kind.
  // Provisioned agent capabilities have no human authentication method.
  CredentialMethod method = 6;
  OAuthProvider oauth_provider = 7;
}
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_DEVICE = 1;
  CREDENTIAL_KIND_AGENT = 2;
  CREDENTIAL_KIND_SERVICE = 3;
  CREDENTIAL_KIND_ANONYMOUS = 4;
}
message ClientOwnedCredential {
  RecordRef ref = 1;
  // Exact verified credential subject, distinct from the human account UUID.
  string subject = 2;
  bytes proof_public_key = 3;
  CredentialKind kind = 4;
}
message IssuedCredential {
  RecordRef ref = 1;
  // Raw serialized Biscuit bytes, not a base64 string. Secret bearer material.
  // No response ever contains an authority or proof private key.
  bytes biscuit = 2;
  // Effective Ed25519 PoP key. Required for agent/device credentials; absence
  // is permitted only for an explicitly bearer-only credential class.
  bytes proof_public_key = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Credential classification is independent of the account's rooting tier.
  // An agent credential stays attenuated after the human claims the account.
  CredentialKind kind = 5;
  // Exact subject of the issued Biscuit, used to construct request possession
  // identity. Required: never infer it from the human account UUID or handle;
  // an agent or anonymous credential can have a different subject.
  string subject = 6;
}
message BeginRegistrationRequest {
  // One Ed25519 device key for Biscuit authority and request possession.
  // Completion proves this exact key; an existing bearer selects the account
  // but never substitutes for the enrolling device's signature.
  bytes caller_public_key = 1;
  // Required for signup/claim; optional for adding a device. An existing
  // account is selected by the authenticated UUID, never by a mutable handle.
  string handle = 2;
  string display_name = 3;
  // Signup uses one previously admitted reservation. With no admission, an
  // independently rooted bearer adds a device to its existing account, or a
  // claimable agent bearer claims its account under a new handle. Anonymous
  // signup preserves the anonymous account UUID. The challenge records which
  // ceremony was admitted; completion cannot switch ceremonies or accounts.
  oneof signup_admission {
    RecordRef invitation_reservation = 4;
    RecordRef verified_email = 5;
  }
  CredentialMethod method = 6;
  OAuthProvider oauth_provider = 7;
}
message RegistrationChallenge {
  RecordRef ref = 1;
  bytes challenge = 2;
  string relying_party_id = 3;
  string relying_party_name = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Stable UUID fixed before clients sign owner-root records. WebAuthn user.id
  // is this string's UTF-8 encoding, including for anonymous promotion/claim.
  string account_id = 6;
  string handle = 7;
  string display_name = 8;
  UserVerification user_verification = 9;
  // The passkey creation uses attestation="none". A follow-up assertion by
  // that passkey proves its binding to caller_public_key using these bytes.
  // The independent CallContext signature proves possession of the device key.
  bytes device_binding_challenge = 10;
  // Exact 32-byte nonce for OwnerKeyBinding; no extra challenge RPC is needed.
  bytes owner_binding_nonce = 11;
  // Prospective credential lifetime, independent of ten-minute ceremony expiry.
  // Owner-signed mint-root attachments may use this exact upper bound.
  google.protobuf.Timestamp credential_expires_at = 12;
  CredentialMethod method = 13;
  OAuthProvider oauth_provider = 14;
}
message PasskeyRegistration {
  bytes credential_id = 1;
  bytes client_data_json = 2;
  bytes attestation_object = 3;
}
message OwnerRegistration {
  SignedOwnerRoot root = 1;
  AuthorizationSignature proof_of_possession = 2;
  OwnerKeyBinding binding = 3;
  // Omission selects the independent guardians in the signed root; it never
  // selects custodial recovery. Existing warning/consent rules still apply.
  RegistrationRecoveryPolicy recovery = 4;
}
message CompleteRegistrationRequest {
  reserved 10;
  reserved "password";
  string client_operation_id = 1;
  RecordRef challenge = 2;
  oneof proof {
    PasskeyRegistration passkey = 3;
    OAuthProof oauth = 11;
    // Requires establish_owner, admitted signup, and caller device PoP.
    // The envelope account UUID, owner public key and owner ID MUST match
    // the registered account and accepted active root exactly. The verifier
    // possession signature MUST verify over RegistrationChallenge.challenge.
    PasswordOwnerSetup password_setup = 13;
  }
  bytes caller_public_key = 4;
  PasskeyProof device_binding = 5;
  string device_label = 6;
  // New signup establishes an owner root. Claim preserves the original
  // deferred root and appends CLAIM_DEFERRED_HUMAN. Adding a passkey/device
  // does not implicitly replace an existing owner root or change rooting tier.
  oneof owner {
    OwnerRegistration establish_owner = 7;
    SignedOwnerKeyTransition claim_owner = 8;
  }
  // Associates a newly enrolled independent mint root with current ownership.
  SignedOwnerMintRootAttachment mint_root_attachment = 9;
  // Required for a self-rooted passkey: owner certifies the verified credential
  // so a fresh browser can obtain temporary signing authority with devices offline.
  SignedPasskeyAuthority passkey_authority = 12;
}
message RegisterRootAttachmentRequest {
  string client_operation_id = 1;
  RootAttachment attachment = 2;
  SignedRecord subject_possession = 3;
  string label = 4;
}
message RevokeDeviceRequest {
  string client_operation_id = 1;
  // Original registry device identity from DeviceIdentity/CurrentCredentialRecord.
  // Ordinary revocation uses effective delegated account permissions; owner-key
  // transitions have their separate portable owner-authorization ceremony.
  RecordRef device = 2;
  bytes expected_version = 4;
}

// Irreversibly deletes the caller's account. The authenticating credential
// MUST be the direct account owner's proof-bearing credential: agent, service,
// delegated, derived and attenuated credentials are rejected even if they
// otherwise carry caller-bound account authority. confirmation_handle MUST
// exactly equal the account's current handle. Reusing client_operation_id
// returns the original outcome without deleting or canceling anything twice.
message DeleteAccountRequest {
  string client_operation_id = 1;
  string confirmation_handle = 2;
}

enum AccountDeletionOutcome {
  ACCOUNT_DELETION_OUTCOME_UNSPECIFIED = 0;
  // Account-owned live data was removed before this response was produced.
  ACCOUNT_DELETION_OUTCOME_COMPLETED = 1;
  // Some retained data remains until retained_data_delete_after.
  ACCOUNT_DELETION_OUTCOME_SCHEDULED = 2;
  // The same account deletion had already completed; no work was repeated.
  ACCOUNT_DELETION_OUTCOME_ALREADY_DELETED = 3;
}

message DeleteAccountResponse {
  // Carries the operation ID and applied/no-op result used for idempotency.
  MutationReceipt receipt = 1;
  AccountDeletionOutcome outcome = 2;
  // Number of account-owned Spools deleted by the original operation.
  uint64 spools_deleted = 3;
  // True when the original operation canceled an active paid subscription.
  bool subscription_canceled = 4;
  // Time the original deletion operation was accepted.
  google.protobuf.Timestamp deletion_requested_at = 5;
  // Latest scheduled deletion time for retained account data. Absent when no
  // account data is retained after the response.
  google.protobuf.Timestamp retained_data_delete_after = 6;
}
message PutDelegationRequest {
  string client_operation_id = 1;
  DelegationRecord delegation = 2;
  bytes expected_version = 3;
}
message RevokeDelegationRequest {
  string client_operation_id = 1;
  RecordRef delegation = 2;
  SignedRecord revocation = 3;
  bytes expected_version = 4;
}
message RevokeSessionRequest {
  string client_operation_id = 1;
  // Unscoped session ref from a credential ceremony or identity observation.
  // Ends this session only. Device/delegation revocation is a separate action.
  // A session-only credential may end its own key-bound session. Managing
  // another session requires the same human account's authority, which may be
  // delegated to an agent. All operation/resource/lifetime caveats still apply.
  RecordRef session = 2;
  // Required exact SessionRecord.version. A conflict changes no session state.
  bytes expected_version = 3;
}
// Renews a short-TTL ephemeral (declined-enrollment) session in place. The
// renewal is proven by the caller's existing ephemeral bearer plus a request
// PoP signed by the ephemeral key (CallContext.request_proof), so the body
// carries no session ref: the renewed session is exactly the caller's own.
message RenewEphemeralSessionRequest {
  string client_operation_id = 1;
  // Optional key rotation. When set, this 32-byte key becomes the ephemeral
  // session's new PoP subject and the renewed Biscuit is delegated to it; the
  // current request is still signed by the existing ephemeral key. Omitted to
  // renew the expiry without rotating the key.
  bytes new_ephemeral_public_key = 2;
}
message RenewEphemeralSessionResponse {
  MutationReceipt receipt = 1;
  // Renewed ephemeral session: Weft-delegated Biscuit, its PoP public key and
  // the new expiry. Mirrors the issued-credential token shape returned by the
  // authentication-completion path; no new token format is introduced here.
  IssuedCredential credential = 2;
}
message IntrospectCredentialRequest {
  bytes biscuit = 1;
}
message CredentialInspection {
  RootAttachment authority = 1;
  repeated ActionAvailability actions = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool revoked = 4;
}
// Provisional two-key possession, before an approving account is known.
// SignedRecord format heddle.pairing-initiation.v2; each actual receiver key signs
// domain || protobuf bytes in ascending tag order, omitting scalar defaults.
// Oneof presence is preserved. The host and operation prevent reuse.
// Credential-only receiver. Its subject key is not an Iroh endpoint.
message BrowserPairingReceiver {}
message PairingInitiationBinding {
  EndpointRef host = 1;
  string client_operation_id = 2;
  oneof receiver {
    EndpointRef device = 3;
    BrowserPairingReceiver browser = 7;
  }
  bytes subject_public_key = 4;
  int64 not_before_unix_seconds = 5;
  int64 expires_at_unix_seconds = 6;
}
message BeginPairingRequest {
  string client_operation_id = 1;
  oneof receiver {
    EndpointRef device = 2;
    BrowserPairingReceiver browser = 5;
  }
  bytes subject_public_key = 3;
  SignedRecord subject_possession = 4;
}
message PairingRecord {
  RecordRef ref = 1;
  bytes version = 2;
  oneof receiver {
    EndpointRef device = 3;
    BrowserPairingReceiver browser = 10;
  }
  bytes challenge = 4;
  // Public commitment only. The delegated credential is never observable.
  oneof approval {
    RootAttachmentBinding approval_binding = 5;
    BrowserPairingApprovalBinding browser_approval = 11;
  }
  google.protobuf.Timestamp expires_at = 6;
  bool completed = 7;
  bytes subject_public_key = 8;
  RootAttachment completed_attachment = 9;
}
message BeginPairingResponse {
  MutationReceipt receipt = 1;
  PairingRecord pairing = 2;
  // Configured browser origin with the public pairing reference. No secrets.
  string verification_uri = 3;
}
message ApprovePairingRequest {
  string client_operation_id = 1;
  RecordRef pairing = 2;
  bytes expected_version = 4;
  // Browser-created, root-derived Biscuit bound to the pairing's subject key.
  // The host verifies the same account and descendant authority; it never
  // substitutes a newly minted independent root. Only the subject's proved
  // completion receives this secret, never a PairingEvent/identity observation.
  bytes delegated_biscuit = 5;
  // Claimed upper lifetime bound, independently checked against the child.
  // Actual calls still satisfy every original caveat at their execution time.
  google.protobuf.Timestamp delegated_expires_at = 6;
}
message CompletePairingRequest {
  string client_operation_id = 1;
  RecordRef pairing = 2;
  // Receiver-specific possession before credential release. Browser completion
  // does not create an endpoint attachment or an independently trusted mint root.
  oneof proof {
    RootAttachment attachment = 3;
    SignedRecord browser_possession = 4;
  }
}
message BrowserPairingApprovalBinding {
  uint32 format_version = 1;
  bytes root_public_key = 2;
  bytes subject_public_key = 3;
  string account_id = 4;
  bytes credential_digest = 5;
  bytes pairing_challenge = 6;
  int64 not_before_unix_seconds = 7;
  int64 expires_at_unix_seconds = 8;
}
// SignedRecord format heddle.browser-pairing-completion.v1. The current subject
// key signs domain || deterministic protobuf bytes plus a fresh exact RPC proof.
message BrowserPairingCompletionBinding {
  EndpointRef host = 1;
  string client_operation_id = 2;
  RecordRef pairing = 3;
  BrowserPairingApprovalBinding approval = 4;
}
message ObservePairingRequest {
  RecordRef pairing = 1;
  ObserveOptions observe = 2;
}
message PairingEvent {
  StreamFrame frame = 1;
  oneof payload {
    PairingRecord pairing = 2;
    SectionStatus status = 3;
  }
}
message PutRecoveryPolicyRequest {
  string client_operation_id = 1;
  SignedRecord policy = 2;
  bytes expected_version = 3;
}
message BeginRecoveryRequest {
  string client_operation_id = 1;
  // Exactly one account selector is required. A lost device may know only the
  // public native handle; both unknown selectors receive synthetic KDF data.
  string account_id = 2;
  bytes proposed_root_public_key = 3;
  string method_id = 4;
  string account_handle = 5;
}
message RecoveryAttempt {
  RecordRef ref = 1;
  bytes version = 2;
  bytes challenge = 3;
  google.protobuf.Timestamp eligible_at = 4;
  bool vetoed = 5;
  bool completed = 6;
  repeated Requirement requirements = 7;
}
message BeginRecoveryResponse {
  MutationReceipt receipt = 1;
  RecoveryAttempt recovery = 2;
  // Real or synthetic material for the selected paper-code method. A public
  // begin never discloses whether an account or method exists.
  PaperCodeKdfMaterial paper_code_kdf = 3;
}
message RecoveryArgon2idParams {
  uint32 memory_kib = 1;
  uint32 iterations = 2;
  uint32 parallelism = 3;
}
message PaperCodeKdfMaterial {
  bytes salt = 1;
  RecoveryArgon2idParams params = 2;
}
message PaperCodeUnlock {
  // Fixed-length Argon2id result derived locally from the 24-word kit. The
  // original words never cross this boundary.
  bytes argon2id_hash = 1;
}
message SubmitRecoveryProofRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  oneof proof {
    // Portable guardian threshold plus proposed-root possession. For a paper
    // method this follows a successful paper_unlock on the same attempt.
    SignedRecord signed_transition = 3;
    // First paper stage: bounded method verification unlocks the current
    // owner history needed to sign the portable transition on a lost device.
    PaperCodeUnlock paper_unlock = 4;
  }
}
message SubmitRecoveryProofResponse {
  MutationReceipt receipt = 1;
  oneof outcome {
    // Only returned after a real declared paper method is verified.
    OwnerState unlocked_ownership = 2;
    RecoveryAttempt accepted = 3;
  }
}
message CompleteRecoveryRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  SignedRecord new_root_possession = 3;
  bytes expected_version = 4;
  // Explicitly retained passkeys, re-certified by the proposed new owner key
  // for the exact resulting owner state. Existing credential IDs and verified
  // public keys must match. Completion atomically replaces these certificates
  // and retires unselected old certificates; an empty list retains none.
  // At most 256 certificates; request PoP binds the complete list.
  repeated SignedPasskeyAuthority renewed_passkeys = 5;
}
message VetoRecoveryRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  oneof authorization {
    // Exact signed veto by the current owner or owner-certified passkey session.
    // A passkey session also presents its verifiable mint attachment and current
    // capability; a registered device/key label is not owner authorization.
    SignedRecord veto = 3;
    // Opaque secret delivered for this recovery attempt. This public branch
    // requires no account session. The server checks its retained secret hash
    // and atomically closes only the exact still-open attempt. Never observable,
    // logged, or usable to complete recovery or obtain an account credential.
    string email_secret = 4;
  }
}
message ResolveHandlesRequest {
  repeated string handles = 1;
  ReadBudget budget = 2;
}
enum HandleKind {
  HANDLE_KIND_UNSPECIFIED = 0;
  HANDLE_KIND_NATIVE = 1;
  HANDLE_KIND_GITHUB = 2;
  HANDLE_KIND_GITLAB = 3;
}
// Public directory metadata contains no stable subject/account identifiers.
// ResolveResources supplies those only within an authorized resource scope.
message PublicHandleRecord {
  string display_name = 1;
  string handle = 2;
  string primary_handle = 3;
  HandleKind kind = 4;
  bool verified = 5;
  string discriminator = 6;
}
message HandleResolution {
  string handle = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    STATUS_CLAIMED = 2;
    STATUS_HELD = 3;
    STATUS_UNAVAILABLE = 4;
    STATUS_RESERVED = 5;
    STATUS_CONFUSABLE = 6;
  }
  Status status = 3;
  repeated Requirement requirements = 4;
  PublicHandleRecord public_handle = 5;
  bool tombstoned = 6;
  // An active verified-owner hold exists. A caller's own nonblocking hold
  // yields AVAILABLE plus true; another owner's yields HELD. Never disclose
  // the holder identity. ClaimHandle rechecks the caller's actual entitlement.
  bool held_for_verified_owner = 7;
}

message ResolveHandlesResponse {
  repeated HandleResolution handles = 1;
}
message ClaimHandleRequest {
  string client_operation_id = 1;
  string handle = 2;
  SignedRecord entitlement_proof = 3;
}
message RequestHeldHandleRequest {
  string client_operation_id = 1;
  string handle = 2;
  // Preserve the existing normalized-name right-of-first-refusal transaction:
  // an eligible request starts the 30-day window without exposing its owner.
}
message RequestHeldHandleResponse {
  MutationReceipt receipt = 1;
  google.protobuf.Timestamp right_of_first_refusal_deadline = 2;
}
message ClaimHandleResponse {
  MutationReceipt receipt = 1;
  PublicHandleRecord public_handle = 2;
}
message CreateSignupInvitationRequest {
  string client_operation_id = 1;
  SignupInvitation invitation = 2;
}
message CreateSignupInvitationResponse {
  MutationReceipt receipt = 1;
  SignupInvitation invitation = 2;
  bytes redemption_secret = 3;
}
// A held shareable invitation code selects the admission directly; no lookup
// RPC, account bearer or device root is needed before choosing a passkey.
message RedeemSignupInvitationRequest {
  string client_operation_id = 1;
  bytes redemption_secret = 2;
}
message SignupReservation {
  // Opaque, short-lived admission. BeginRegistration accepts this exact ref.
  // Reservation does not create an account or consume the invite permanently.
  RecordRef ref = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message RedeemSignupInvitationResponse {
  MutationReceipt receipt = 1;
  SignupReservation reservation = 2;
}
message BeginEmailVerificationRequest {
  string client_operation_id = 1;
  string email = 2;
  // Optional held shareable code for binding an invitation after mailbox proof.
  // Empty selects an existing invitation already bound to this email.
  bytes invitation_code = 3;
  string handle = 4;
}
// Only the endpoint's authenticated, independently rooted signup-mailer
// service account may begin delivery. Its bearer is the possession factor.
message EmailVerificationChallenge {
  MutationReceipt receipt = 1;
  RecordRef challenge = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Secret for the delivery service to send to the specified mailbox. Never
  // return this field in a browser's begin-signup response. The durable public
  // receipt excludes it; an authorized retry may retrieve it while still live.
  bytes delivery_proof = 4;
}
message CompleteEmailVerificationRequest {
  string client_operation_id = 1;
  RecordRef challenge = 2;
  bytes proof = 3;
}
message VerifiedEmailReservation {
  // Use directly as BeginRegistration.verified_email; no bootstrap Biscuit.
  RecordRef ref = 1;
  google.protobuf.Timestamp expires_at = 2;
  string handle = 3;
  string email = 4;
}
message CompleteEmailVerificationResponse {
  MutationReceipt receipt = 1;
  VerifiedEmailReservation reservation = 2;
}

// Invite-gated creation of an unclaimed human account. The independent root
// slot stays empty. The agent proves its own key over this exact request using
// principal:device-key:<lowercase-hex-agent-public-key>; a human bearer cannot
// replace that proof. Existing key-bound accounts may be reused without an
// invitation. Reusing an operation ID with different bytes is rejected.
message ProvisionAccountRequest {
  string client_operation_id = 1;
  bytes invitation_secret = 2;
  bytes agent_public_key = 3;
}
message ProvisionAccountResponse {
  MutationReceipt receipt = 1;
  PrincipalRecord principal = 2;
  // Client-owned AGENT registration bound to the proved key, preserving the
  // server-enforced agent ceiling. Claiming the human account does not upgrade
  // this credential. A server-minted bearer is not required for keyed agents.
  CredentialResult credential = 3;
  // Authoritative browser origin for the agent's locally generated claim link.
  // The claim secret and its private state remain on the agent's device.
  string claim_web_origin = 4;
  // Original stored ownership proof on key-bound account reuse. Preserve it
  // exactly; an absent root permits the client to propose its first bootstrap.
  // This does not populate the account's independent human-root slot.
  OwnerState ownership = 5;
}

// Anonymous continuity has no human account and no independent owner root.
// The endpoint retains its existing anti-abuse, expiry and rotation checks.
message CreateAnonymousSessionRequest {
  string client_operation_id = 1;
  bytes continuity_secret = 2;
  string abuse_challenge_proof = 3;
}
message AnonymousSessionResponse {
  MutationReceipt receipt = 1;
  string anonymous_id = 2;
  IssuedCredential credential = 3;
  // Rotate after successful use; useful only for this ceremony, never as a
  // normal RPC bearer. Store separately from the short-lived Biscuit.
  bytes continuity_secret = 4;
  google.protobuf.Timestamp continuity_expires_at = 5;
}

// Creating/updating a delegation record and issuing a credential are different
// effects. The caller must prove the active delegation authority; the new key
// must prove possession. Scope/expiry cannot exceed the accepted delegation.
message IssueDelegationCredentialRequest {
  string client_operation_id = 1;
  RecordRef delegation = 2;
  bytes proof_public_key = 3;
  SignedRecord authority_proof = 4;
  // Canonical credential scope grammar, checked against the parent's ceiling.
  string scope = 5;
  // Omission requests no expiry only where the parent and server policy allow.
  google.protobuf.Timestamp expires_at = 6;
  bytes expected_delegation_version = 7;
  // Proof by proof_public_key over the credential request's canonical unsigned
  // statement. Both in-body proofs bind delegation, requested scope/expiry,
  // expected version and operation ID; neither can be replayed for another key.
  // CallContext independently authenticates and signs the complete request.
  SignedRecord subject_possession = 8;
}
message DelegationCredentialResponse {
  MutationReceipt receipt = 1;
  CredentialResult credential = 2;
}

message ResolveSignupInvitationRequest {
  bytes redemption_secret = 1;
}
message SignupInvitationResolution {
  RecordRef invitation = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    // Includes active reservations: it cannot currently admit another signup.
    STATUS_IN_USE = 2;
    STATUS_UNAVAILABLE = 3;
  }
  Status status = 2;
  repeated Requirement requirements = 3;
  // Context authorized by possession of the invitation identifier, sufficient
  // to populate the invitation page without identity/profile lookups.
  string inviter_display_handle = 4;
  uint64 inviter_member_ordinal = 5;
  string bound_email = 6;
}

// Metadata for the exact credential authenticating this observation. This is
// not issuance, and neither account tier nor account role upgrades its rights.
message CurrentCredentialRecord {
  RecordRef ref = 1;
  bytes version = 2;
  CredentialKind kind = 3;
  string subject = 4;
  bytes proof_public_key = 5;
  RecordRef device = 6;
  RecordRef delegation = 7;
  repeated string authentication_methods = 8;
  string acting_agent_id = 9;
  string delegated_by_principal_id = 10;
  string agent_provider = 11;
  string agent_model = 12;
  google.protobuf.Timestamp expires_at = 13;
  bool revoked = 14;
  repeated ActionAvailability actions = 15;
  // Original current session, selected by the verified credential's session
  // binding and account/mint key, independently of sessions pagination. Absent
  // for credentials without a persisted session; never synthesized from a
  // device or credential ID. Its exact ref/version authorizes session revoke.
  SessionRecord session = 16;
  // Canonical ThreadControlAuthority for this exact original credential. Sealed
  // once during identity observation, reusable for local authoring until its
  // original limits expire; delivery never refreshes or expands this proof.
  // Absent when portable owner association is unavailable. Receivers separately
  // validate current authority at first admission. Contains no private key.
  bytes thread_control_authority = 17;
  // Revoke the specific device, delegation or session using the corresponding
  // observed version; this metadata never permits an account-wide revocation.
}

// Bounded unary identity lookup for one-shot callers. The principal is always
// returned; callers can opt into metadata for the authenticating credential.
message GetIdentityRequest {
  bool include_current_credential = 1;
}

message GetIdentityResponse {
  PrincipalRecord identity = 1;
  CurrentCredentialRecord current_credential = 2;
  // Present while the account is restricted by the billing lock. The same
  // message is carried by PolicyDenial.billing_lock on denied calls.
  heddle.api.common.AccountBillingLock billing_lock = 3;
}
