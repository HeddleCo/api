syntax = "proto3";
package heddle.api.v1alpha2;

import "heddle/api/common/hosted_witness.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/owner_records.proto";

// Fixed field order, counted bytes, BE integers and domain-separated digests
// follow owner_records.proto, not protobuf serialization. See the normative
// contract and the ONE fixed Rust/TS fixture in tests/fixtures/.
enum ImportDelegationPurpose {
  IMPORT_DELEGATION_PURPOSE_UNSPECIFIED = 0;
  IMPORT_DELEGATION_PURPOSE_IMPORT_CONVERSION_V1 = 1;
}
enum ImportRefMode {
  IMPORT_REF_MODE_UNSPECIFIED = 0;
  IMPORT_REF_MODE_PINNED_COMMIT = 1;
  IMPORT_REF_MODE_OBSERVE_AT_EXECUTION = 2; // Explicitly disclosed weaker promise.
}
// Signed acknowledgement of the fixed disclosure in the normative contract:
// the exact OID is unavailable; the branch may move before execution and the
// job will convert its then-observed commit. Never infer consent from an empty
// OID. A known OID MUST use PINNED_COMMIT, including after an attempted pin.
enum ImportRefDisclosure {
  IMPORT_REF_DISCLOSURE_UNSPECIFIED = 0;
  IMPORT_REF_DISCLOSURE_OBSERVE_AT_EXECUTION = 1;
}
enum ImportGitHashAlgorithm {
  IMPORT_GIT_HASH_ALGORITHM_UNSPECIFIED = 0;
  IMPORT_GIT_HASH_ALGORITHM_SHA1 = 1;
  IMPORT_GIT_HASH_ALGORITHM_SHA256 = 2;
}
message ImportIdentityV1 {
  bytes spool_uuid = 1; // 16 bytes.
  bytes spool_genesis_digest = 2;
  bytes owner_id = 3;
  bytes owner_account_uuid = 4; // 16 bytes; importing member is NOT this owner.
  bytes owner_state_hash = 5;
  uint64 ownership_transfer_sequence = 6;
}
// Recomputed from independently verified owner histories and handoff audits,
// not an incoming digest. State hashes are sorted unique, transfer hashes are
// in accepted sequence order. The histories retain every original signature.
message ImportOwnerChainV1 {
  bytes spool_genesis_digest = 1;
  repeated bytes owner_state_hashes = 2;
  repeated bytes transfer_audit_hashes = 3;
}
// One authorized result slot. First release permits one result per branch;
// slot_id is stable across physical retries under the job's single certificate.
// Reservation identity is (spool UUID, full ref, slot_id), not slot_id alone.
// Full refs are exclusive across all non-terminal jobs in the same spool.
message ImportBranchLimitV1 {
  string ref_name = 1; // Full refs/heads/...; sorted unique UTF-8 bytes.
  ImportGitHashAlgorithm hash_algorithm = 2;
  ImportRefMode ref_mode = 3;
  bytes pinned_commit_oid = 4; // Raw 20/32 bytes; empty only for OBSERVE.
  bytes genesis_digest = 5;
  bytes target_thread_id = 6;
  bytes expected_frontier_digest = 7; // ImportFrontierV1 commitment.
  uint64 slot_id = 8;
  reserved 9;
  reserved "max_result_bytes";
  ImportRefDisclosure ref_disclosure = 10; // OBSERVE requires 1; PINNED requires 0.
}
message ImportPermissionScopeV1 {
  string provider = 1; // Canonical lowercase provider ID.
  string source_url = 2; // Credential-free canonical HTTPS URL.
  repeated ImportBranchLimitV1 branches = 3;
  // Prepare request: empty asks the host to issue its current destination CAS;
  // exactly 32 bytes requires that current CAS or typed DESTINATION_CONFLICT.
  // Success: always 32 opaque host-issued bytes. Never an overview version or
  // zero32 sentinel. All other proposed scope fields MUST remain unchanged.
  // Fences destination configuration, ownership and policy. Other imports do
  // not advance it; disjoint sibling jobs may Prepare/Commit concurrently.
  bytes destination_version = 4;
  bytes options_digest = 5;
  string converter_version = 6;
  uint32 max_operations = 7; // Logical-job total; never reset by retry.
  // ONE positive u64 logical-job authorization total; never reset.
  // Bounds server-held job-key writes under delegation; not a storage quota.
  uint64 max_result_bytes = 8;
}
// P2 #1: NEW direct owner -> device permission, unrelated to PURGE, timeline,
// self-PoP or online Developer/Admin grants. Exactly one logical job/lineage;
// grants genesis binding and bounded IMPORT_CONVERSION delegation, no device
// subdelegation. Durable accounting is (permission digest, logical job) and
// slot identity is (logical job, branch, slot); byte totals never reset by key/retry.
message ImportMemberPermissionV1 {
  uint32 format_version = 1;
  ImportIdentityV1 identity = 2;
  bytes logical_job_id = 3; // 16 bytes.
  bytes retry_lineage_id = 4; // Caller UUID, reserved first physical operation ID; non-nil.
  bytes subject_public_key = 5;
  ImportDelegationPurpose purpose = 6;
  ImportPermissionScopeV1 scope = 7;
  int64 not_before_unix_seconds = 8;
  int64 expires_at_unix_seconds = 9;
  // CSPRNG 32 bytes for this job's sole member permission; retries preserve it.
  // The delegation has a separate ID. Namespace heddle-import-cancel-v1.
  bytes cancellation_id = 10;
  bytes owner_chain_digest = 11; // Exact independently verified public chain digest.
  // Fresh CSPRNG 32 bytes per new grant. Byte-identical replay preserves it.
  bytes nonce = 12;
}
message SignedImportMemberPermissionV1 {
  ImportMemberPermissionV1 body = 1;
  AuthorizationSignature owner_signature = 2;
}
message ImportGenesisAuthorityV1 {
  uint32 format_version = 1;
  ImportIdentityV1 identity = 2;
  bytes genesis_digest = 3;
  bytes original_creator_signature = 4; // 64 bytes, preserved unchanged.
  bytes creator_public_key = 5;
  bytes creator_authority_envelope_digest = 6;
  bytes parent_permission_digest = 7; // Zero32 only for direct active owner authority.
  bytes owner_chain_digest = 8;
}
message SignedImportGenesisAuthorityV1 {
  ImportGenesisAuthorityV1 body = 1;
  AuthorizationSignature creator_signature = 2;
}
message ImportBranchManifestV1 {
  ImportBranchLimitV1 limit = 1; // Exact ordered prepared branch; server-frozen.
  bytes genesis_authority_digest = 2; // Browser-completed exact signed binding digest.
}
// The browser copies every field from ImportJobPreparationV1 byte-for-byte,
// adds only fields 8, 9, 13 (binding digests, never limits), 14 and 15, and signs
// the complete body. Prepare supplies no placeholders for these fields.
message ImportJobDelegationV1 {
  reserved 17;
  reserved "predecessor_delegation_digest";
  uint32 format_version = 1;
  ImportIdentityV1 identity = 2;
  bytes delegation_id = 3; // Unique random 16 bytes.
  bytes logical_job_id = 4;
  bytes retry_lineage_id = 5;
  bytes job_public_key = 6;
  bytes job_key_id = 7; // heddle-key-v1(ED25519 u32be, raw key).
  bytes delegating_public_key = 8; // Browser signer device / active owner.
  bytes parent_permission_digest = 9; // Browser's exact parent ref; zero32 for direct owner.
  bytes owner_chain_digest = 10;
  ImportDelegationPurpose purpose = 11;
  ImportPermissionScopeV1 scope = 12;
  repeated ImportBranchManifestV1 branch_manifest = 13;
  int64 not_before_unix_seconds = 14; // Browser-selected within prepared host bounds.
  int64 expires_at_unix_seconds = 15; // Exclusive; no clock-skew grace after expiry.
  bytes cancellation_id = 16;
}
message SignedImportJobDelegationV1 {
  ImportJobDelegationV1 body = 1;
  AuthorizationSignature delegating_signature = 2;
}
message ImportCommittedSlotV1 {
  string ref_name = 1;
  uint64 slot_id = 2;
  bytes signed_operation_digest = 3;
  bytes resulting_frontier_digest = 4;
  uint64 result_bytes = 5;
}
message ImportResultManifestV1 {
  uint32 format_version = 1;
  bytes logical_job_id = 2;
  bytes retry_lineage_id = 3;
  repeated ImportCommittedSlotV1 slots = 4; // Sorted by ref UTF-8, slot; unique.
}

message DelegatedImportOperationV1 {
  uint32 format_version = 1;
  bytes spool_uuid = 2;
  bytes spool_genesis_digest = 3;
  bytes logical_job_id = 4;
  bytes retry_lineage_id = 5;
  bytes physical_operation_id = 6; // NEW retry row ID, never logical identity.
  bytes delegation_digest = 7;
  string ref_name = 8;
  uint64 slot_id = 9;
  ImportGitHashAlgorithm hash_algorithm = 10;
  bytes observed_commit_oid = 11;
  bytes genesis_digest = 12;
  bytes target_thread_id = 13;
  bytes expected_frontier_digest = 14;
  bytes resulting_frontier_digest = 15;
  bytes resulting_content_digest = 16; // ImportContentV1 commitment.
  uint64 result_bytes = 17;
  bytes options_digest = 18;
  string converter_version = 19;
}
message SignedDelegatedImportOperationV1 {
  DelegatedImportOperationV1 body = 1;
  AuthorizationSignature job_signature = 2;
}
message ImportPublicationWitnessV1 {
  uint32 format_version = 1;
  bytes signed_operation_digest = 2;
  bytes delegation_digest = 3;
  bytes logical_job_id = 4;
  bytes retry_lineage_id = 5;
  bytes physical_operation_id = 6;
  string ref_name = 7;
  uint64 slot_id = 8;
  ImportGitHashAlgorithm hash_algorithm = 9;
  bytes observed_commit_oid = 10;
  bytes expected_frontier_digest = 11;
  bytes resulting_frontier_digest = 12;
  bytes terminal_manifest_digest = 13;
}
// Owner verification belongs to heddle capability-verifier: independently
// select the immutable lineage, verify owner histories/handoffs and current or
// witnessed historical authority. This public carrier cannot enroll its owner.
message ImportPublicProofBundleV1 {
  reserved 8, 18;
  reserved "renewals", "member_permissions";
  uint32 format_version = 1;
  SignedSpoolOwnerGenesis owner_genesis = 2;
  repeated OwnerHistory owner_histories = 3;
  repeated ResourceTransferAuditRecord ownership_transfers = 4;
  SignedImportMemberPermissionV1 member_permission = 5; // Absent for direct owner.
  repeated SignedImportGenesisAuthorityV1 genesis_authorities = 6;
  repeated SignedImportJobDelegationV1 delegations = 7; // Exactly ONE signed delegation per logical job.
  repeated SignedDelegatedImportOperationV1 operations = 9;
  ImportResultManifestV1 terminal_manifest = 10;
  heddle.api.common.SignedHostedWitnessSetV1 witness_set = 11;
  repeated heddle.api.common.SignedHostedWitnessStatementV1 statements = 12;
  repeated heddle.api.common.HostedWitnessHistoryProofV1 history_proofs = 13;
  repeated SignedSpoolPolicyRecord policies = 14;
  repeated SignedRecord original_geneses = 15;
  repeated bytes creator_authority_envelopes = 16;
  ImportOwnerChainV1 owner_chain = 17;
  // Digest-sorted unique cumulative publication manifests; field 10 selects an exact entry.
  repeated ImportResultManifestV1 manifests = 19; // At most 256: one cumulative manifest per publication, or one empty recovery manifest.
  // Exact statement payloads, indexed by H(purpose-domain || canonical payload).
  repeated ImportGenesisWitnessV1 genesis_witnesses = 20;
  repeated ImportAuthorityWitnessV1 authority_witnesses = 21;
  repeated HostedLandingWitnessV1 landing_witnesses = 22;
}
// Explicit custody selector. The URL is proposed_scope.source_url. The host
// resolves this selector for the authenticated caller at Prepare and Commit;
// a domain alone NEVER selects credential custody.
// Identifiers/visibility only: no credentials, grants or execution authority.
message ImportSourceSelectionV1 {
  RecordRef connection = 1; // Absent for unconnected public HTTPS Git.
  string provider_repository_id = 2;
  string installation_id = 3;
  bool private = 4;
}
message PrepareImportJobRequest {
  reserved 6;
  reserved "renew_logical_job_id";
  string client_operation_id = 1;
  SpoolRef destination = 2;
  ImportIdentityV1 identity = 3;
  // Caller selects EVERY field, including slots, frontiers and exact budgets.
  // Only empty destination_version is filled. No normalization, defaults,
  // reductions or substituted converter/options; accept unchanged or refuse.
  ImportPermissionScopeV1 proposed_scope = 4;
  bytes retry_lineage_id = 5;
  // Required. Revalidate current grants, provider support, repository object
  // format and known OIDs before issuing a reservation. Unknown format blocks.
  ImportSourceSelectionV1 source = 7;
}
// Exact server-frozen projection of ImportJobDelegationV1. No signer, parent
// permission, genesis-binding digests or validity window exists at Prepare.
// Canonical bytes use numbered-field order and the framing above. Commit must
// compare this projection byte-for-byte with the stored reservation.
message ImportJobPreparationV1 {
  reserved 12;
  reserved "predecessor_delegation_digest";
  uint32 format_version = 1;
  ImportIdentityV1 identity = 2;
  bytes delegation_id = 3;
  bytes logical_job_id = 4;
  bytes retry_lineage_id = 5;
  bytes job_public_key = 6;
  bytes job_key_id = 7;
  bytes owner_chain_digest = 8;
  ImportDelegationPurpose purpose = 9;
  ImportPermissionScopeV1 scope = 10;
  bytes cancellation_id = 11;
}
message PrepareImportJobResponse {
  reserved 3;
  reserved "renewal_state";
  ImportJobPreparationV1 proposal = 1;
  int64 reservation_expires_at_unix_seconds = 2; // Prepare time + 3600, exclusive.
  // Bounds from one authorized transaction with proposal, never stale reads.
  // Positive host duration, at most 604800 seconds (7 days); 86400 is supported.
  uint64 max_validity_duration_seconds = 4;
  uint64 clock_skew_allowance_seconds = 5; // No grace after exclusive expiry.
  int64 prepared_at_unix_seconds = 6; // Host clock; reservation expiry = this + 3600.
  // Exactly one of proposal/refusal. A refusal has no reservation, key or bounds.
  ImportPreparationRefusalV1 refusal = 7;
}
enum ImportPreparationRefusalReason {
  IMPORT_PREPARATION_REFUSAL_REASON_UNSPECIFIED = 0;
  IMPORT_PREPARATION_REFUSAL_REASON_INVALID_SCOPE = 1;
  IMPORT_PREPARATION_REFUSAL_REASON_UNSUPPORTED_CONVERTER = 2;
  IMPORT_PREPARATION_REFUSAL_REASON_UNSUPPORTED_OPTIONS = 3;
  IMPORT_PREPARATION_REFUSAL_REASON_BUDGET_EXCEEDED = 4;
  // Stale destination configuration/ownership/policy CAS, or a full ref/slot
  // reserved by a non-terminal job in this spool. See refusal.field.
  IMPORT_PREPARATION_REFUSAL_REASON_DESTINATION_CONFLICT = 5;
  IMPORT_PREPARATION_REFUSAL_REASON_POLICY_DENIED = 6;
}
message ImportPreparationRefusalV1 {
  ImportPreparationRefusalReason reason = 1;
  string field = 2; // Bounded request field path; never hidden resource details.
}
// An authenticated finite read, separate from provider inventory observation.
// Configuration is advice, never authority; Prepare and Commit recheck current
// support and refuse totals above the current advertised host maximum.
message GetImportConfigurationRequest {
  SpoolRef destination = 1;
}
message ImportConverterConfigurationV1 {
  string converter_version = 1; // Exact ASCII identifier, 1..128 bytes.
  // Versioned converter-owned encoding specification. Clients select returned
  // octets verbatim, never serialize JSON/protobuf or infer an empty default.
  string options_encoding = 2; // ASCII identifier, 1..128 bytes.
  repeated bytes canonical_options = 3; // 1..64 sorted unique choices, <=4096 each.
  bytes default_options = 4; // MUST equal one exact canonical_options entry.
}
message ImportBudgetLimitsV1 {
  uint32 max_branches = 1; // Positive, <=256.
  uint32 max_operations = 2; // Positive, <=256; total per logical job.
  // Operator-configurable positive u64 maximum per logical job; no protocol cap.
  uint64 max_result_bytes = 3;
  reserved 4;
  reserved "max_branch_result_bytes";
}
enum ImportSourceMode {
  IMPORT_SOURCE_MODE_UNSPECIFIED = 0;
  IMPORT_SOURCE_MODE_CONNECTED = 1;
  IMPORT_SOURCE_MODE_PUBLIC_HTTPS = 2;
}
message ImportProviderConfigurationV1 {
  // Launch registry: github -> CONNECTED; public-git -> PUBLIC_HTTPS.
  // gitlab is reserved for a future connected adapter and is not advertised.
  string provider = 1;
  repeated ImportSourceMode source_modes = 2; // Exactly the registered mode.
}
message GetImportConfigurationResponse {
  // Complete sorted unique converter-version list, 1..32; <=1 MiB response.
  repeated ImportConverterConfigurationV1 converters = 1;
  ImportBudgetLimitsV1 limits = 2;
  // Complete sorted unique provider list, 1..2 entries. Advice, not authority;
  // both Prepare and Commit revalidate support using current configuration.
  repeated ImportProviderConfigurationV1 providers = 3;
  // Optional host recommendation; if present, nonempty and MUST reference one
  // advertised converter. Absent -> explicit chooser; lexical order is not rank.
  optional string default_converter_version = 4;
}
// Destination-writer-only, authenticated finite read. No listing, pagination or
// seed/custody/bearer secrets. Unknown and unauthorized jobs use uniform NOT_FOUND.
// Discover destination + logical_job_id from OperationRecord.ref.spool and
// subject.import.hybrid_job; selector visibility grants no read/control authority.
message GetImportJobStateRequest {
  SpoolRef destination = 1;
  bytes logical_job_id = 2; // Exactly 16 nonzero bytes; <=4096 encoded request bytes.
}
// Narrow writer-only disclosure; does not expose a full OperationRecord or
// change ordinary OperationService visibility. Same destination/job/lineage.
message ImportEligibleRetryTargetV1 {
  OperationRef operation_ref = 1; // Canonical non-nil physical UUID; exact destination.
  bytes operation_version = 2; // Opaque CAS token, 1..256 bytes.
}
enum ImportRetryUnavailableReason {
  reserved "IMPORT_RETRY_UNAVAILABLE_REASON_ORIGINAL_WINDOW_ENDED";
  IMPORT_RETRY_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  IMPORT_RETRY_UNAVAILABLE_REASON_NO_TERMINAL_ATTEMPT = 1;
  IMPORT_RETRY_UNAVAILABLE_REASON_ATTEMPT_IN_PROGRESS = 2;
  IMPORT_RETRY_UNAVAILABLE_REASON_COMPLETE = 3;
  IMPORT_RETRY_UNAVAILABLE_REASON_JOB_CANCELLED = 4;
  IMPORT_RETRY_UNAVAILABLE_REASON_JOB_REVOKED = 5;
  IMPORT_RETRY_UNAVAILABLE_REASON_ALREADY_SUPERSEDED = 6;
  IMPORT_RETRY_UNAVAILABLE_REASON_AUTHORITY_EXPIRED = 7;
}

// One snapshot for Cancel and Retry; public proofs travel through Fetch/export.
// Host custody/source associations remain durable admission inputs, not read fields.
enum ImportJobStatus {
  IMPORT_JOB_STATUS_UNSPECIFIED = 0;
  IMPORT_JOB_STATUS_ACTIVE = 1;
  IMPORT_JOB_STATUS_COMPLETE = 2;
  IMPORT_JOB_STATUS_CANCELLED = 3;
  IMPORT_JOB_STATUS_REVOKED = 4;
  IMPORT_JOB_STATUS_EXPIRED = 5;
}
message GetImportJobStateResponse {
  reserved "state", "retained_proof", "retained_source", "control_availability";
  ImportJobStatus status = 1; // Required, known nonzero; expiry is terminal.
  bytes active_cancellation_id = 2; // 32 bytes, used by Cancel.
  uint64 authority_epoch = 3; // Positive; fences Cancel/Retry against terminal transitions.
  oneof retry_availability {
    ImportEligibleRetryTargetV1 eligible_retry_target = 4;
    ImportRetryUnavailableReason retry_unavailable = 5; // Required, known nonzero.
  }
  bytes active_delegation_digest = 6; // 32 bytes, used by Retry; one certificate per job.
}
message CancelImportJobRequest {
  // Any current destination writer with authenticated PoP may cancel; no
  // initiating-account restriction, provider connection or source fetch needed.
  string client_operation_id = 1;
  SpoolRef destination = 2;
  bytes logical_job_id = 3;
  // Delegation cancellation ID only, never its parent's cancellation ID.
  // With matching epoch: mismatch refuses Scope; stale epoch: StaleContext.
  bytes cancellation_id = 4;
  uint64 expected_authority_epoch = 5;
  // Whole-job terminal cancellation; epoch advances once. Exact caller-scoped
  // replay returns the stored receipt before epoch/terminal revalidation.
  // Changed inputs under client_operation_id refuse OPERATION_ID_REUSED.
}
// Public digest-holder policy, survives deletion and lost read grant. No batch,
// listing, prefix or pagination. Validate exactly 64 bytes before archive I/O.
message GetHostedWitnessHistoryProofRequest {
  bytes executor_id = 1;
  bytes statement_leaf_digest = 2;
}
// Proof ONLY. Uniform NOT_FOUND for unknown ID, leaf or unsealed archive.
// At most 64 siblings and 4096 encoded bytes, no original/resource identifiers.
message GetHostedWitnessHistoryProofResponse {
  heddle.api.common.HostedWitnessHistoryProofV1 proof = 1;
}

// Frozen cross-model SHA256 preimages, not native object IDs. Operation IDs are
// original native Thread operation IDs; complete sorted unique source frontier.
message ImportFrontierV1 {
  uint32 format_version = 1;
  bytes thread_id = 2;
  repeated bytes operation_ids = 3; // At most 128; empty frontier is explicit.
}
message ImportContentV1 {
  uint32 format_version = 1;
  bytes canonical_capture = 2; // Native Capture v1 named MessagePack; see contract.
}
// Typed purpose payloads use the same fixed-order canonical framing. SignedRecord
// flattens counted format, counted original native bytes, signature count then
// counted key/signature pairs, sorted by raw key. Native bytes are never changed.
// Complete exact native evidence, never reconstructed from sidecar identifiers.
// The acceptance signature commits to the complete manifest and intent native IDs.
// Native verification checks selected originals and each receipt's exact basis.
message ImportBoundaryAcceptanceV1 {
  heddle.api.common.HostedWitnessBoundaryAcceptanceV1 binding = 1;
  SignedRecord signed_acceptance = 2;
  bytes originals_manifest = 3;
  bytes publication_intent = 4;
  repeated SignedRecord original_receipts = 5; // Binding digest order, at most 128.
}
message ImportGenesisWitnessV1 {
  uint32 format_version = 1;
  SignedImportGenesisAuthorityV1 binding = 2;
  SignedRecord original_genesis = 3;
  bytes creator_authority_envelope = 4;
  ImportBoundaryAcceptanceV1 boundary_acceptance = 5;
}
enum ImportAuthorityRecordKind {
  IMPORT_AUTHORITY_RECORD_KIND_UNSPECIFIED = 0;
  IMPORT_AUTHORITY_RECORD_KIND_THREAD_OPERATION_V1 = 1;
  IMPORT_AUTHORITY_RECORD_KIND_OWNERSHIP_CLAIM_V1 = 2;
  IMPORT_AUTHORITY_RECORD_KIND_OWNERSHIP_RESOLUTION_V1 = 3;
}
message ImportAuthorityWitnessV1 {
  uint32 format_version = 1;
  ImportAuthorityRecordKind kind = 2;
  SignedRecord original = 3;
  repeated SignedRecord dependencies = 4; // Sorted signed-native-record digests.
  bytes authority_envelope = 5;
  repeated ImportBoundaryAcceptanceV1 boundary_acceptances = 6; // Acceptance-ID order, unique.
}
// Retained exact Tier-1 signing preimage + original signature; no bearer secret.
message HostedLandingRequestProofV1 {
  uint32 format_version = 1;
  string signing_identity = 2;
  string method_path = 3;
  int64 timestamp_millis = 4;
  bytes nonce = 5;
  bytes request_body = 6;
  RecordSignature signature = 7;
}
message HostedLandingWitnessV1 {
  uint32 format_version = 1;
  SignedRecord execution = 2; // ThreadOperation v1 Integration body, never HostedImport.
  HostedLandingRequestProofV1 request = 3;
  SignedRecord source_operation = 4;
  repeated SignedRecord review_evidence = 5; // Sorted signed-native-record digests.
  bytes authority_envelope = 6;
}
