syntax = "proto3";
package heddle.api.v1alpha2;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/import_authority.proto";
import "heddle/api/v1alpha2/stream.proto";

message ProviderConnection {
  RecordRef ref = 1;
  bytes version = 2;
  string provider = 3;
  string provider_account_id = 4;
  // All active installations authorized by this account's provider credential.
  repeated string installation_ids = 5;
  repeated ActionAvailability actions = 6;
  bool revoked = 7;
  // This record contains no provider token or OAuth authorization code.
}
message ProviderRepository {
  RecordRef connection = 1;
  string provider_repository_id = 2;
  string clone_url = 3;
  string name = 4;
  bool private = 5;
  // Exact installation whose user grant listed this repository. CommitImportJob
  // verifies this association again before selecting provider custody.
  string installation_id = 6;
  // Spools that already hold a remote link for this repository (same provider
  // repository id or clone origin) AND that the caller can observe. Spools the
  // caller cannot see are omitted — never revealed and never an error. Empty
  // means no visible link. Repeated: one repository may be linked into several
  // spools. Scope is the caller-visible spools of the account, not only the
  // spools named in the ObserveIntegrations request.
  repeated SpoolRef linked_spools = 7;
  // Current provider default branch, without refs/heads/. Empty means unknown,
  // unavailable or no default; never guess main/master. Independent of refs.
  string default_branch = 8;
  // Opt-in bounded page, ordered by full ref-name UTF-8 bytes. No secrets.
  repeated ProviderRef refs = 9;
  // Absent when unrequested. Section "provider_refs"; coverage plus PageInfo
  // distinguishes an exhausted known-empty page from partial/unavailable data.
  SectionStatus refs_status = 10;
}

message ProviderRef {
  // Fully qualified refs/heads/... or refs/tags/..., unique within a page.
  string name = 1;
  // Exact lowercase Git object ID of the ref target; tags are not peeled.
  string head_oid = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BRANCH = 1;
    KIND_TAG = 2;
  }
  // Zero/unknown means unknown, never implicitly a branch.
  Kind kind = 3;
}

message ProviderRefsRequest {
  // Select by exact connection and repository ID, not an ambiguous bare ID.
  RecordRef connection = 1;
  string provider_repository_id = 2;
  // Default 128, maximum 512. Cursor binds caller, connection, repository,
  // accepted bounds and provider snapshot; a changed snapshot invalidates it.
  PageRequest page = 3;
}
message RemoteLinkRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string clone_url = 3;
  RecordRef connection = 4;
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_FETCH = 1;
    DIRECTION_PUSH = 2;
    DIRECTION_BOTH = 3;
  }
  Direction configured_direction = 5;
  repeated Direction supported_directions = 6;
  google.protobuf.Duration sync_interval = 7;
  bool enabled = 8;
  repeated ThreadRef diverged_threads = 9;
  RecordRef latest_operation = 10;
  // Exact native source destination. A remote never selects a Thread from a
  // mutable latest-import pointer; divergence preserves this Thread unchanged.
  ThreadRef target = 11;
  // Optional explicit recurring-policy deadline, independent of bearer age.
  google.protobuf.Timestamp expires_at = 12;
  // Exact granted installation for a connected GitHub remote.
  string installation_id = 13;
}
message ObserveIntegrationsRequest {
  repeated SpoolRef spools = 1;
  repeated RecordRef connections = 2;
  bool include_repositories = 3;
  PageRequest page = 4;
  ObserveOptions observe = 5;
  // Requires include_repositories; at most eight unique authorized pairs.
  // Only emitted inventory rows load refs; inventory paging remains independent.
  // At most 4096 refs per snapshot/batch, bounded by observe.budget.
  // Oversized or duplicate selectors/pages are INVALID_ARGUMENT, not truncation.
  repeated ProviderRefsRequest include_refs_for = 6;
}
message IntegrationEvent {
  StreamFrame frame = 1;
  oneof payload {
    ProviderConnection connection = 2;
    ProviderRepository repository = 3;
    RemoteLinkRecord remote = 4;
    SectionStatus status = 5;
    Removal removal = 6;
    SectionReplacement replace_section = 7;
  }
}
message BeginProviderConnectionRequest {
  string client_operation_id = 1;
  string provider = 2;
  string return_uri = 3;
}
message ProviderChallenge {
  MutationReceipt receipt = 1;
  RecordRef challenge = 2;
  bytes state = 3;
  string authorization_url = 4;
}
message CompleteProviderConnectionRequest {
  string client_operation_id = 1;
  RecordRef challenge = 2;
  bytes authorization_code = 3;
  string installation_id = 4;
  // Exact opaque state returned by Begin and echoed by the provider callback.
  bytes state = 5;
}
// Attach a GitHub App installation that became available after OAuth consent.
// The hosted service validates the exact installation against the caller's
// stored provider credential before updating the connection.
message AttachProviderInstallationRequest {
  string client_operation_id = 1;
  RecordRef connection = 2;
  bytes expected_version = 3;
  string installation_id = 4;
}
message StoreProviderCredentialRequest {
  string client_operation_id = 1;
  string provider = 2;
  // Provider bearer input travels only over the authenticated encrypted RPC
  // transport. Weft validates it with the named provider and encrypts it using
  // server credential custody before storage. Never project or log this value.
  string access_token = 3;
}
message RevokeProviderConnectionRequest {
  string client_operation_id = 1;
  RecordRef connection = 2;
  bytes expected_version = 3;
}
message SetRemoteLinkRequest {
  string client_operation_id = 1;
  RemoteLinkRecord remote = 2;
  bytes expected_version = 3;
}
// Prepare -> sign -> Commit is sufficient for a new HYBRID import. Defined here
// to reuse ProviderRepository without an import cycle. Proof originals and the
// signed ordered branch manifest are the ONLY branch carrier.
message CommitImportJobRequest {
  string client_operation_id = 1;
  SpoolRef destination = 2;
  // Exactly one initial delegation; select the HOST-STORED reservation by its
  // delegation ID. Original geneses/envelopes/bindings match the signed manifest.
  ImportPublicProofBundleV1 proof = 3;
  // Required, same public URL / connected-provider validation as source import.
  // Resolve current authorized connection/repository/installation, and bind
  // its provider + clone_url to the signed scope before custody selection.
  ProviderRepository source = 4;
  // Optional canonical synthetic empty State, <=4096 bytes; its native identity
  // MUST equal the base in EVERY proof original genesis. Otherwise the exact
  // base closure must already be hosted. Nonempty closures use SyncService.
  bytes initial_base_state = 5;
}
// Closed route: always FAILED_PRECONDITION with typed
// ERROR_REASON_IMPORT_SOURCE_REQUIRES_COMMIT after authentication/authorization.
// Never creates, attaches, aliases Commit or activates a HYBRID job. Use Commit
// for initial submission and RetryImportSource for an existing physical job.
message ImportSourceRequest {
  string client_operation_id = 1;
  SpoolRef destination = 2;
  ProviderRepository source = 3;
  bytes expected_destination_version = 4;
  reserved 5, 6;
  reserved "thread_genesis", "creator_authority";
  // Unusable on this closed route. Initial base submission belongs to Commit.
  bytes initial_base_state = 7;
  reserved 8, 9;
  reserved "branches", "import_authority";
}
// Retry a failed native source fetch/adoption into its original Thread. The
// original operation remains immutable; this command creates a new operation
// and never creates a second Spool or Thread genesis.
message RetryImportSourceRequest {
  string client_operation_id = 1;
  RecordRef original_operation = 2;
  bytes expected_operation_version = 3;
  // Resolves retry_original_operation to this ORIGINAL logical job, not the
  // new physical operation UUID. Current same-key retry needs no new signature;
  // expired/cancelled authority needs explicit RenewImportJob first.
  bytes logical_job_id = 4;
  bytes active_delegation_digest = 5;
  uint64 expected_authority_epoch = 6;
}
message SynchronizeRemoteRequest {
  string client_operation_id = 1;
  RecordRef remote = 2;
  RemoteLinkRecord.Direction direction = 3;
  bytes expected_version = 4;
  ImportPublicProofBundleV1 import_authority = 5; // Own explicit recurring-sync scope.
}
