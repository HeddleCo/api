syntax = "proto3";

package heddle.api.v1alpha2;

import "heddle/api/v1alpha2/common.proto";

// Portable ownership evidence. These typed containers retain the independent
// canonical signature domains, field ordering and durable format versions.
// RPC package names are not signed. Only PURGE uses owner capabilities;
// ordinary spool access remains an ordinary Biscuit decision.
// No private key is transported or supplied by a verifier.

// Owner-anchored purge authorization and self-rooted identity objects.
//
// PURGE is the only operation authorized by an OwnerAuthorizationBundle.
// Ordinary redaction, state-visibility, and state-attachment writes are
// authorized by the transport's spool-write Biscuit and carry no owner sidecar.
//
// These protobuf messages are transport containers, not signed encodings.
// Signatures MUST NOT cover a protobuf serialization. Every canonical_*_v1
// body named below is domain-separated, fixed-order, and length-prefixed.
// Integer widths are fixed and big-endian; signed timestamps are Unix seconds;
// UUIDs are 16 raw bytes; v1 key ids, hashes, owner ids, and nonces are 32 raw
// bytes. Repeated key sets are sorted by key_id. Duplicate keys, unknown
// algorithms or versions, non-canonical paths, and trailing bytes fail closed.
// A v1 signature is Ed25519 over:
//
//   SHA-256(domain || canonical_body)
//
// No private key is ever transmitted. Weft is not a portable authorization
// signer. A WEFT recovery guardian contributes only its per-account public
// verification key here; its HSM-derived private key is an opt-in threshold
// guardian, not an owner, capability, bearer, or universal server trust root.

enum AuthorizationKeyAlgorithm {
  AUTHORIZATION_KEY_ALGORITHM_UNSPECIFIED = 0;
  AUTHORIZATION_KEY_ALGORITHM_ED25519 = 1;
}

message AuthorizationVerificationKey {
  AuthorizationKeyAlgorithm algorithm = 1;
  // Exactly 32 raw Ed25519 public-key bytes in format version 1.
  bytes public_key = 2;
}

message AuthorizationSignature {
  // SHA-256("heddle-key-v1" || algorithm || public_key).
  bytes signer_key_id = 1;
  // Exactly 64 raw Ed25519 signature bytes in format version 1.
  bytes signature = 2;
}

// Recovery-key provenance is part of the signed policy. A verifier can
// distinguish paper, social, and Weft guardians when counting signatures.
enum RecoveryGuardianKind {
  RECOVERY_GUARDIAN_KIND_UNSPECIFIED = 0;
  RECOVERY_GUARDIAN_KIND_PAPER = 1;
  RECOVERY_GUARDIAN_KIND_SOCIAL = 2;
  RECOVERY_GUARDIAN_KIND_WEFT = 3;
}

message RecoveryGuardian {
  RecoveryGuardianKind kind = 1;
  AuthorizationVerificationKey key = 2;
}

// The owner precommits to a threshold over distinct dedicated guardian keys.
// Product policy defaults to threshold >= 2 and a device-independent co-factor
// whenever Weft is a guardian. A 1-of-1 Weft policy is custodial and is allowed
// only after the client obtains the separately reviewed explicit confirmation.
message RecoveryPolicy {
  uint32 threshold = 1;
  repeated RecoveryGuardian guardians = 2;
  // Per-user veto window, in seconds, shared by account recovery and owner-key
  // transitions. Absence selects the 7-day default (604800 seconds).
  // ROTATE and RECOVER transitions preserve the current value. A
  // RECOVERY_POLICY transition may change it only with the current owner
  // authority authorization already required for that transition; lowering
  // the value takes effect no earlier than the current window.
  optional uint64 window_secs = 3;
}

// Registration defaults to this guardian M-of-N policy. If
// OwnerRegistration.recovery is absent, the policy in the
// signed root is treated as this branch and MUST contain a valid threshold and
// at least one non-WEFT guardian. Absence never selects Weft custody.
message GuardianRecoveryPolicySelection {
  RecoveryPolicy policy = 1;
}

// Versioned evidence that the user saw and accepted the exact 1-of-1 Weft
// custody warning. warning_sha256 is SHA-256 of the reviewed UTF-8 warning
// text for warning_version; unknown versions and digests fail closed.
message WeftCustodyWarningConsent {
  uint32 warning_version = 1;
  bytes warning_sha256 = 2;
  int64 acknowledged_at_unix_seconds = 3;
}

// The only supported custodial recovery shape is exactly one WEFT guardian
// with threshold one. It is never inferred from an omitted selection.
message WeftCustodyRecoveryPolicySelection {
  RecoveryGuardian guardian = 1;
  WeftCustodyWarningConsent warning_consent = 2;
}

message RegistrationRecoveryPolicy {
  oneof selection {
    GuardianRecoveryPolicySelection guardians = 1;
    WeftCustodyRecoveryPolicySelection weft_custody = 2;
  }
}

// ── 1. Owner root ───────────────────────────────────────────────────────────

message OwnerRoot {
  // Exactly 1.
  uint32 format_version = 1;
  // Recomputed as SHA-256("heddle-owner-root-v1" ||
  // canonical_owner_root_v1_without_owner_id).
  bytes owner_id = 2;
  // Raw 16-byte service/display locator. It is signed metadata, not authority.
  bytes account_uuid = 3;
  AuthorizationVerificationKey authority_key = 4;
  RecoveryPolicy recovery_policy = 5;
  bool claimable_deferred_human = 6;
  // Exactly 32 random bytes.
  bytes nonce = 7;
  // Required only for a deferred root. A transition cannot extend it.
  int64 claimable_until_unix_seconds = 8;
}

message SignedOwnerRoot {
  OwnerRoot root = 1;
  // The root authority key signs canonical_owner_root_v1(root).
  AuthorizationSignature authority_proof = 2;
  // Every declared guardian signs the same canonical root body as proof that
  // the recovery signing material was present at declaration.
  repeated AuthorizationSignature recovery_key_proofs = 3;
}

enum OwnerKeyBindingKind {
  OWNER_KEY_BINDING_KIND_UNSPECIFIED = 0;
  OWNER_KEY_BINDING_KIND_SELF_ROOTED_REGISTRATION = 1;
  OWNER_KEY_BINDING_KIND_SERVER_ROOTED_CUSTODY = 2;
  OWNER_KEY_BINDING_KIND_AGENT_CLAIM = 3;
}

// Self-asserted attachment of a root key to the stable owner UUID.
// `stable_owner_uuid` is exactly 16 bytes and never changes. `challenge_nonce`
// is exactly 32 bytes, single-use, and scoped by the service to the authenticated
// principal and UUID. binding_epoch begins at one and increases monotonically.
//
// root_proof_of_possession signs:
//   SHA-256("heddle-owner-key-binding-v1" ||
//          canonical_owner_key_binding_v1_without_proofs)
//
// There is deliberately no registry attestation or independent release root.
// The owner proves possession of its own root; spool consumers establish trust
// from SignedSpoolOwnerGenesis and TOFU-pin that binding.
message OwnerKeyBinding {
  // Exactly 1.
  uint32 format_version = 1;
  bytes stable_owner_uuid = 2;
  AuthorizationVerificationKey root_public_key = 3;
  bytes root_state_hash = 4;
  OwnerKeyBindingKind kind = 5;
  uint64 binding_epoch = 6;
  bytes challenge_nonce = 7;
  AuthorizationSignature root_proof_of_possession = 8;
}

// Immutable owner-key binding created with a spool. `spool_uuid` is the raw
// 16-byte UUIDv7 that is also the spool id. `owner_public_key` is the owner
// authority key at creation; no registry key or nonce participates.
message SpoolOwnerGenesis {
  bytes spool_uuid = 1;
  AuthorizationVerificationKey owner_public_key = 2;
}

// Self-signed genesis evidence. owner_signature.signer_key_id MUST identify
// genesis.owner_public_key, and that key signs the exact 32-byte digest:
//
//   SHA-256(genesis.owner_public_key.public_key || genesis.spool_uuid)
//
// A cloner verifies this proof and TOFU-pins spool_uuid -> owner_public_key
// before accepting the state tree. The owner's signed root and complete
// accepted rotation history must prove that this key belonged to that owner.
// New spools use the current key at admission. Later rotation preserves the
// immutable genesis; historical membership never authorizes a retired key to
// issue a new capability.
message SignedSpoolOwnerGenesis {
  SpoolOwnerGenesis genesis = 1;
  AuthorizationSignature owner_signature = 2;
  // Exactly one of owner_signature or delegated_creation is present.
  SpoolCreationProof delegated_creation = 3;
}

// Public association of a credential mint root with one exact owner authority
// state. This grants no operations: ordinary Biscuit checks remain mandatory.
// Canonical v1 fields follow tag order using fixed-width/length-prefixed encoding.
// Domain: "heddle-mint-root-attachment-v1".
message MintRootAttachment {
  uint32 format_version = 1;
  bytes account_uuid = 2;
  bytes owner_state_hash = 3;
  uint64 owner_sequence = 4;
  AuthorizationVerificationKey owner_key = 5;
  AuthorizationVerificationKey mint_root_key = 6;
  int64 not_before_unix_seconds = 7;
  int64 expires_at_unix_seconds = 8;
  bytes nonce = 9;
}
message SignedMintRootAttachment {
  MintRootAttachment attachment = 1;
  // Exactly one of owner_signature or passkey_delegation is required.
  AuthorizationSignature owner_signature = 2;
  PasskeyMintDelegation passkey_delegation = 3;
}

// Current owner authorization for a passkey to attach temporary Ed25519 mint
// keys. This certifies key lineage, not operations: Biscuit attenuation, resource
// audience and current revocation remain mandatory. It confers no independent
// owner/root-establishment authority. Canonical fields follow tag order using
// fixed-width/length-prefixed encoding; domain "heddle-passkey-authority-v1".
message PasskeyAuthority {
  uint32 format_version = 1;
  bytes account_uuid = 2;
  bytes owner_state_hash = 3;
  uint64 owner_sequence = 4;
  AuthorizationVerificationKey owner_key = 5;
  bytes credential_id = 6;
  // New passkeys support ES256 (-7) and Ed25519 (-8).
  int32 cose_algorithm = 7;
  // DER SubjectPublicKeyInfo returned by AuthenticatorAttestationResponse.
  // Enrollment compares this key with the verified credential's COSE key.
  bytes public_key_spki = 8;
  string relying_party_id = 9;
  // Exact serialized origins, sorted and unique; no wildcard matching.
  repeated string allowed_origins = 10;
  // Nonzero and at most 43200. Every issued attachment's interval is bounded by
  // this value. Renewal beyond the interval requires a new passkey assertion.
  uint32 max_session_ttl_seconds = 11;
  bytes nonce = 12;
}
message SignedPasskeyAuthority {
  PasskeyAuthority authority = 1;
  AuthorizationSignature owner_signature = 2;
}
message PasskeyMintDelegation {
  SignedPasskeyAuthority authority = 1;
  // WebAuthn get assertion over base64url-no-padding of the existing
  // mint_root_signing_digest(attachment). The challenge therefore commits to
  // account, owner state, temporary key, validity interval and fresh nonce.
  // Verification requires exact origin, RP hash, user presence and verification,
  // same-origin context, and the credential's signature. No registry signature
  // participates; receivers establish current owner trust independently.
  bytes client_data_json = 2;
  bytes authenticator_data = 3;
  bytes signature = 4;
}

// A creator's statement of exact intended creation. created_at is NOT an
// admission timestamp. Only actual current admission or independently retained
// accepted evidence establishes whether this creation was permitted then.
// Canonical v1 fields follow tag order; domain "heddle-spool-creation-v1".
message SpoolCreationStatement {
  uint32 format_version = 1;
  // SHA-256("heddle-spool-owner-genesis-v1" || canonical genesis fields 1,2).
  bytes genesis_digest = 2;
  bytes account_uuid = 3;
  bytes owner_state_hash = 4;
  uint64 owner_sequence = 5;
  AuthorizationVerificationKey creator_key = 6;
  // Empty only for account-root creation.
  bytes parent_spool_uuid = 7;
  repeated string parent_path_segments = 8;
  string name = 9;
  int64 created_at_unix_seconds = 10;
}
message SpoolCreationProof {
  SpoolCreationStatement statement = 1;
  AuthorizationSignature creator_signature = 2;
  // Sealed existing root-derived Biscuit, narrowed to exact CreateSpool method,
  // parent scope, UUID, genesis digest and creator key. Never an unrestricted
  // bearer or private attenuation key. A verifier checks all inherited caveats.
  bytes sealed_biscuit = 3;
  // Absent when the credential is rooted directly at the owner authority key.
  SignedMintRootAttachment mint_root_attachment = 4;
  // Complete witness for the statement's exact owner state. This witness and
  // creator timestamp alone do not establish that fresh admission occurred.
  OwnerHistory owner_history = 5;
}

// ── 3. Rotation and recovery ────────────────────────────────────────────────

enum OwnerKeyTransitionKind {
  OWNER_KEY_TRANSITION_KIND_UNSPECIFIED = 0;
  OWNER_KEY_TRANSITION_KIND_ROTATE = 1;
  OWNER_KEY_TRANSITION_KIND_RECOVER = 2;
  OWNER_KEY_TRANSITION_KIND_RECOVERY_POLICY = 3;
  OWNER_KEY_TRANSITION_KIND_CLAIM_DEFERRED_HUMAN = 4;
}

message OwnerKeyTransition {
  // Exactly 1.
  uint32 format_version = 1;
  bytes owner_id = 2;
  bytes previous_state_hash = 3;
  // Exactly the previous sequence plus one.
  uint64 sequence = 4;
  OwnerKeyTransitionKind kind = 5;
  AuthorizationVerificationKey next_authority_key = 6;
  RecoveryPolicy next_recovery_policy = 7;
  int64 valid_from_unix_seconds = 8;
  // A bounded handover no longer than the maximum capability TTL. Recovery
  // after suspected compromise uses no overlap.
  int64 previous_key_valid_until_unix_seconds = 9;
  // Exactly 32 random bytes.
  bytes nonce = 10;
}

// Authorizations sign canonical_owner_key_transition_v1(transition).
//
// ROTATE requires the current authority and next key. RECOVER requires the
// current recovery threshold and next key. RECOVERY_POLICY requires the
// current authority, current recovery threshold, and possession proofs from
// every next guardian. CLAIM_DEFERRED_HUMAN requires the origin key, the next
// human authority key, and every next guardian. These entries are appended to
// the spool state tree and form a self-verifying chain from spool genesis;
// neither an entry nor its verification uses a registry field or signature.
message SignedOwnerKeyTransition {
  OwnerKeyTransition transition = 1;
  repeated AuthorizationSignature authorizations = 2;
  AuthorizationSignature next_authority_key_proof = 3;
  repeated AuthorizationSignature next_recovery_key_proofs = 4;
}

// ── 4. Owner-anchored capability submission ────────────────────────────────

enum CapabilityPrincipalKind {
  CAPABILITY_PRINCIPAL_KIND_UNSPECIFIED = 0;
  CAPABILITY_PRINCIPAL_KIND_HUMAN_DEVICE = 1;
  CAPABILITY_PRINCIPAL_KIND_SERVICE_ACCOUNT = 2;
  CAPABILITY_PRINCIPAL_KIND_AGENT = 3;
  CAPABILITY_PRINCIPAL_KIND_ANONYMOUS_KEY = 4;
  CAPABILITY_PRINCIPAL_KIND_ANY_ANONYMOUS = 5;
}

enum SpoolCapabilityAction {
  SPOOL_CAPABILITY_ACTION_UNSPECIFIED = 0;
  // The sole owner-anchored capability action. Ordinary spool operations use
  // transport Biscuits and cannot be expressed by this enum.
  SPOOL_CAPABILITY_ACTION_PURGE = 1;
}

message SpoolSelector {
  // Raw 16-byte spool UUID.
  bytes root_spool_uuid = 1;
  // Complete canonical path segments, never strings or general globs.
  repeated string path_segments = 2;
  bool include_descendants = 3;
}

message CapabilityPrincipal {
  CapabilityPrincipalKind kind = 1;
  // Signed audit identity, not an ownership anchor.
  bytes principal_id = 2;
  // Absent only for ANY_ANONYMOUS.
  AuthorizationVerificationKey key = 3;
}

message SpoolCapabilityGrant {
  SpoolSelector spool = 1;
  // Exactly PURGE.
  SpoolCapabilityAction action = 2;
}

message OwnerCapability {
  // Exactly 1.
  uint32 format_version = 1;
  bytes owner_id = 2;
  bytes issuer_state_hash = 3;
  // Empty only for a direct owner grant.
  bytes parent_capability_id = 4;
  CapabilityPrincipal subject = 5;
  repeated SpoolCapabilityGrant grants = 6;
  int64 not_before_unix_seconds = 7;
  int64 expires_at_unix_seconds = 8;
  // Exactly 32 random bytes.
  bytes nonce = 9;
  // Recomputed from canonical_owner_capability_v1_without_capability_id.
  bytes capability_id = 10;
}

message SignedOwnerCapability {
  OwnerCapability capability = 1;
  AuthorizationSignature signature = 2;
}

message OwnerAuthorizationBundle {
  SignedOwnerRoot owner_root = 1;
  repeated SignedOwnerKeyTransition owner_state_chain = 2;
  repeated SignedOwnerCapability capability_chain = 3;
  // A subject-signed Biscuit whose authority facts are a subset of the leaf
  // capability and match its subject key, kind, and id.
  bytes subject_biscuit = 4;
}

// Portable authorization for an exact purge, independently of its transport.
message SidecarAuthorization {
  OwnerAuthorizationBundle capability = 1;
  AuthorizationSignature operation_signature = 2;
}

message PurgeSidecarIdentity {
  // Exactly 64 lower-case hexadecimal ASCII bytes.
  string blob_hash = 1;
}

// Protobuf serialization is never signed. canonical_purge_operation_v2 is:
// u32_be(format_version), raw 16-byte spool_uuid, blob_hash as a u32-length-
// prefixed string, raw 32-byte payload_sha256, raw 32-byte leaf_capability_id.
// The leaf subject signs SHA-256("heddle-purge-operation-v2" || canonical_body).
// The verifier binds this body to the actual spool, payload and direct PURGE
// grant. Moving the RPC package does not change this durable signing format.
message PurgeOperationSigningBody {
  // Exactly 2.
  uint32 format_version = 1;
  bytes spool_uuid = 2;
  PurgeSidecarIdentity purge_identity = 3;
  bytes payload_sha256 = 4;
  bytes leaf_capability_id = 5;
}

// ── 6. Clone keyring persistence ────────────────────────────────────────────

enum CloneOwnerPinKind {
  CLONE_OWNER_PIN_KIND_UNSPECIFIED = 0;
  CLONE_OWNER_PIN_KIND_LOCAL_CREATION = 1;
  CLONE_OWNER_PIN_KIND_INVITATION_FINGERPRINT = 2;
  // First authenticated PullReady observed by an ordinary hosted clone. This
  // is distinct from a spool created locally and is persisted before any pack
  // or sidecar is accepted.
  CLONE_OWNER_PIN_KIND_CLONE_TOFU = 3;
}

// Local provenance chosen and persisted by the client. There is no UUID-to-key
// migration or legacy TOFU arm: all accounts start owner-anchored.
message CloneOwnerPin {
  CloneOwnerPinKind kind = 1;
  bytes expected_owner_id = 2;
  int64 first_seen_unix_seconds = 3;
}

// This local persistence wrapper is not served as clone-readiness evidence.
// PullReady carries SignedSpoolOwnerGenesis; after TOFU-pinning it, the client
// constructs this keyring from the verified root and state-tree transition
// entries. Loading it recomputes every id/hash and verifies the full chain;
// unknown versions, gaps, duplicate sequences, forks, owner-id mismatch, or
// capabilities for another spool fail closed.
// Portable proof of one exact owner-key state, including historical states used
// by resource transfers. Several states of the same owner may appear.
message OwnerHistory {
  SignedOwnerRoot root = 1;
  repeated SignedOwnerKeyTransition accepted_transitions = 2;
  bytes state_hash = 3;
}

message CloneAuthorizationKeyring {
  // Exactly 1.
  uint32 format_version = 1;
  // Raw 16-byte spool UUID.
  bytes spool_uuid = 2;
  repeated string canonical_spool_path_segments = 3;
  CloneOwnerPin pin = 4;
  SignedOwnerRoot owner_root = 5;
  repeated SignedOwnerKeyTransition accepted_transitions = 6;
  bytes accepted_state_hash = 7;
  SignedSpoolOwnerGenesis owner_genesis = 8;
  // Ordered, gap-free ownership re-anchors accepted after the initial pin.
  repeated ResourceTransferAuditRecord ownership_transfers = 9;
  // Every transfer party is resolved by (account UUID, exact state hash).
  // Proofs include original signed records; hosts cannot synthesize authority.
  // Total encoded keyring and history/transition counts are verifier-bounded.
  repeated OwnerHistory transfer_owner_histories = 10;
}

// Canonical source offer for an atomic resource ownership re-anchor.
// canonical_resource_transfer_handoff_v1 encodes fields 1 through 8 in field
// order using fixed-width big-endian integers and length-prefixed byte strings.
// UUIDs are exactly 16 bytes, state hashes and nonce are exactly 32 bytes.
message ResourceTransferHandoff {
  // Exactly 1.
  uint32 format_version = 1;
  // Stable 16-byte resource/spool UUID; transfer never changes it.
  bytes resource_uuid = 2;
  // Exactly the previously committed transfer sequence plus one.
  uint64 transfer_sequence = 3;
  bytes source_owner_uuid = 4;
  bytes source_owner_key_state_hash = 5;
  bytes destination_owner_uuid = 6;
  bytes destination_owner_key_state_hash = 7;
  bytes nonce = 8;
}

message SignedResourceTransferHandoff {
  ResourceTransferHandoff handoff = 1;
  // The active source-owner authority key signs:
  //   SHA-256("heddle-resource-transfer-handoff-v1" ||
  //          canonical_resource_transfer_handoff_v1(handoff))
  AuthorizationSignature source_signature = 2;
}

message ResourceTransferAcceptance {
  SignedResourceTransferHandoff signed_handoff = 1;
  // The active destination-owner authority key signs the domain-separated
  // canonical handoff plus the complete source signature. This prevents an
  // acceptance from being paired with a different or incomplete source offer.
  AuthorizationSignature destination_signature = 2;
}

// Complete client-authored transfer. Missing either signature fails closed.
message ResourceOwnershipTransfer {
  ResourceTransferAcceptance acceptance = 1;
}

// Append-only result committed atomically with the resource-to-owner re-anchor.
// audit_record_hash is SHA-256("heddle-resource-transfer-audit-v1" || the
// canonical transfer, commit time, and previous audit hash).
message ResourceTransferAuditRecord {
  ResourceOwnershipTransfer transfer = 1;
  int64 committed_at_unix_seconds = 2;
  bytes previous_audit_record_hash = 3;
  bytes audit_record_hash = 4;
}

// ── 7. Owner-signed spool policy ────────────────────────────────────────────
//
// Narrow owner-gated device capability: grow-only heddle-key-v1 revocations
// and an enforced max_audience ceiling. NOT a wrap of SpoolSettings. NOT
// common.SignedRecord. There is no min_write_role / SignedWriteFloor and no
// forbid_child_creation in format 1. Do not fork OwnerRoot, RecoveryPolicy,
// or the keyring.
//
// These protobuf messages are transport containers, not signed encodings.
// Signatures MUST NOT cover a protobuf serialization (Decision 3(a)).
// Canonical encoding inherits L17–27 of this file and the nested/optional
// rules:
//
//   - Nested messages flatten in field-number order.
//   - Enums encode as u32 big-endian.
//   - optional fields take an explicit presence byte (0x00 = absent, stop;
//     0x01 = present, then the field body). Absent max_audience and
//     AUDIENCE_UNSPECIFIED are different byte strings; LWW treats them
//     differently. Do not encode presence as "zero enum means unset."
//   - revoked_key_ids: u32 count, then each 32-byte id length-prefixed,
//     sorted bytewise, unique. Wrong width fails closed.
//   - merge_parent_state_hashes: u32 count which MUST be 0 in format 1.
//     Non-empty fails closed.
//   - merge_policies sorted by UTF-8 setting_key.
//   - owner_id and owner_state_hash are raw 32-byte fields, matching
//     OwnerCapability.owner_id / OwnerRoot.owner_id.
//   - ownership_transfer_sequence is u64 big-endian.
//   - policy_state_hash = SHA-256("heddle-spool-signed-policy-v2" ||
//     canonical fields 1–10).
//   - Signature covers SHA-256("heddle-spool-signed-policy-signature-v2" ||
//     canonical fields 1–11).
//   - signer_key_id MUST equal owner_key_id of the authority key resolved
//     for (owner_id, owner_state_hash). Never a RecoveryGuardian key,
//     including RecoveryGuardianKind::Weft.
//   - Do not reuse heddle-owner-governance-state-v1 /
//     heddle-owner-governance-signature-v1.
//   - format_version is exactly 1 while the domain strings say -v2. Do not
//     "fix" one to match the other.
//
// Verifier-owned merge table (unknown / missing / duplicate keys fail
// closed):
//   revoked_key_ids → GROW_ONLY_SET_UNION
//   max_audience    → LAST_WRITER_WINS
// A successor cannot subtract a revoked key id. Empty revoked_key_ids at
// genesis is valid. Absent max_audience at genesis is valid (no own
// contribution). forbid_child_creation is not reserved; adding it is a
// format bump.
//
// revoked_key_ids namespace is AuthorizationSignature.signer_key_id =
// SHA-256("heddle-key-v1" || algorithm || public_key). It is not owner-root
// / owner-authority retirement. A record whose set contains the id of the
// key resolved for its own owner_state_hash, or of any key in that owner's
// accepted transition history, is rejected on the introducing record (F7).
// Hosted content writes (PublishContent / ReplicateThread / hosted land)
// whose PoP AuthorizationSignature.signer_key_id is in the accepted tip's
// union MUST be refused. Those RPCs use the same heddle-key-v1 namespace.
// Weft MUST NOT refuse ReviseSpool / grants because a device key is listed.
//
// Transfer-aware key resolution. Body.owner_state_hash is OwnerState.version
// of body.owner_id. Hosted SubmitSignedPolicy derives the authority key from
// the spool's current owner OwnerState unconditionally (never a request key,
// never owner_user_id.is_some() as a skip). Offline: verify_clone_keyring +
// verify_current_owner. Parties at k >= 1 are resolved by
// (handoff.destination_owner_uuid, handoff.destination_owner_key_state_hash)
// via owner_for — not root.account_uuid. When k == k_max, bind the current
// owner's account history with verify_current_owner. A record with
// k < k_max is accepted only if a later record in the same served chain has
// k == k_max and hash-chains to it (N2). Account OwnerHistory alone is not
// the resolver.
//
// Ceiling enforcement is standing and inherited, not a birth bound: effective
// max_audience is min over this spool's tip and every ancestor's tip. Absence
// of a tip, or a tip with max_audience absent, means that spool contributes
// nothing (it is not a license for descendants to ignore ancestors). Present
// UNSPECIFIED fails closed. SubmitSignedPolicy on a child that would store a
// looser max_audience than the ancestors' min is rejected.
//
// Weft never constructs or signs this record.

enum SignedPolicyMergeSemantics {
  SIGNED_POLICY_MERGE_SEMANTICS_UNSPECIFIED = 0;
  SIGNED_POLICY_MERGE_SEMANTICS_LAST_WRITER_WINS = 1;
  SIGNED_POLICY_MERGE_SEMANTICS_GROW_ONLY_SET_UNION = 2;
}

message SignedPolicyMergeRule {
  // Canonical field name on SignedSpoolPolicy ("revoked_key_ids",
  // "max_audience").
  string setting_key = 1;
  SignedPolicyMergeSemantics semantics = 2;
}

// CAS predecessor. Independent of ReviseSpool.expected_version.
// Zero hash + sequence 0 = genesis.
message SignedPolicyHead {
  // 32 bytes; genesis is 32 zero bytes.
  bytes state_hash = 1;
  // Genesis is 0.
  uint64 sequence = 2;
}

// Offline-verifiable, owner-gated payload. NOT a copy of SpoolSettings.
// Substantive content: grow-only revocations + max_audience ceiling.
message SignedSpoolPolicy {
  // Grow-only. Verifier key "revoked_key_ids".
  // Each entry is a 32-byte heddle-key-v1 signer_key_id
  // (SHA-256("heddle-key-v1" || algorithm || public_key)).
  // Sorted unique. Empty is valid.
  repeated bytes revoked_key_ids = 1;
  // Optional max existence/history audience. LWW.
  // proto3 optional: canonical encoding uses an explicit presence byte.
  // Absence = no own contribution to the inherited min.
  // Present UNSPECIFIED fails closed.
  // Discriminant order is restrictiveness: PRIVATE < MEMBERS < PUBLIC.
  // Tightening PUBLIC → PRIVATE does not un-disclose bytes already cloned
  // while the spool (or a descendant) was public. Tightening an ancestor's
  // ceiling likewise does not recall already-public descendants.
  optional Audience max_audience = 2;
}

message SignedPolicyBody {
  // Exactly 1 (domains say -v2).
  uint32 format_version = 1;
  // 16 raw bytes.
  bytes spool_uuid = 2;
  SignedPolicyHead expected_head = 3;
  // expected_head.sequence + 1.
  uint64 sequence = 4;
  // Format 1: MUST be empty.
  repeated bytes merge_parent_state_hashes = 5;
  SignedSpoolPolicy policy = 6;
  repeated SignedPolicyMergeRule merge_policies = 7;
  // 32 bytes; OwnerCapability.owner_id / OwnerRoot.owner_id.
  bytes owner_id = 8;
  // OwnerState.version of owner_id; 32 bytes.
  bytes owner_state_hash = 9;
  // Spool's accepted transfer_sequence at signing; 0 = genesis owner.
  uint64 ownership_transfer_sequence = 10;
  // SHA-256(state domain || canonical 1–10).
  bytes policy_state_hash = 11;
}

message SignedSpoolPolicyRecord {
  SignedPolicyBody body = 1;
  // Authority key of (body.owner_id, body.owner_state_hash) signs.
  // Weft never signs.
  AuthorizationSignature owner_signature = 2;
}
