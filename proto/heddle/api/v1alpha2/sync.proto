syntax = "proto3";
package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/common/contract.proto";
import "heddle/api/common/errors.proto";
import "heddle/api/common/types.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/git_transport.proto";
import "heddle/api/v1alpha2/import_authority.proto";
import "heddle/api/v1alpha2/native_witness.proto";
import "heddle/api/v1alpha2/owner_records.proto";
import "heddle/api/v1alpha2/owner_views.proto";
import "heddle/api/v1alpha2/stream.proto";
import "heddle/api/v1alpha2/thread.proto";

// These are native v2 transfers, not envelopes carrying v1 Push/Pull requests.
// A signed opening binds exact v2 scope, operation, policy, inventory and resume
// context. Packs and indexes travel as bounded protobuf chunks under flow control.
message ObjectAddress {
  string algorithm = 1;
  bytes digest = 2;
}
message TransferCheckpoint {
  bytes transfer_id = 1;
  bytes plan_digest = 2;
  bytes resume_token = 3;
  uint64 committed_bytes = 4;
}
message TransferObject {
  ObjectAddress address = 1;
  string kind = 2;
  SharedFacet facet = 3;
  uint64 size = 4;
  Coverage availability = 5;
}
message TransferSelection {
  repeated SharedFacet facets = 1;
  repeated RevisionRef exclude_revisions = 2;
  uint32 depth = 3;
  bool allow_partial = 4;
  // Fetch the admitted client index and complete closure for this exact
  // revision, if present and authorized. Default false keeps source-only Fetch.
  // This selects no server-produced AnalysisArtifact and never runs parsing.
  bool include_semantic_index = 5;
}
message FetchOpen {
  ThreadRef thread = 1;
  // An exact State. Since alpha.42 it may also name a converted Git ancestor
  // inside an authenticated HYBRID import floor (an older imported commit that
  // is not any operation's State). The endpoint then proves membership with
  // ImportAncestryPage frames (see that message) and the source pack carries
  // exactly that State's tree closure, so a client can lazily materialize any
  // older imported commit without re-fetching the whole floor.
  RevisionRef revision = 2;
  TransferSelection selection = 3;
  TransferCheckpoint checkpoint = 4;
  reserved 5;
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0; // Defaults to direct transfer.
    DELIVERY_DIRECT = 1;
    DELIVERY_PROVIDER_PREFERRED = 2;
  }
  Delivery delivery = 6;
  // Transport hints only. The connected peer identity remains authoritative.
  repeated ProviderDialRoute routes = 7;
  heddle.api.common.ProtocolCompatibility protocol = 8;
}
message PackExtent {
  ObjectAddress pack = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_NATIVE_PACK = 1;
    KIND_NATIVE_INDEX = 2;
    KIND_GIT_PACK = 3;
    KIND_GIT_INDEX = 4;
  }
  Kind kind = 2;
  uint64 offset = 3;
  uint64 length = 4;
  ObjectAddress extent_digest = 5;
  // Admission verifies extent and whole-object hashes and closure.
  // Receiving an extent alone is not acceptance.
}
message PackChunk {
  PackExtent extent = 1;
  bytes data = 2;
}

message TransferSidecar {
  RevisionRef revision = 1;
  ObjectAddress address = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_REDACTION = 1;
    KIND_VISIBILITY = 2;
    KIND_ATTACHMENT = 3;
    KIND_PURGE = 4;
  }
  Kind kind = 3;
  string record_format = 4;
  bytes canonical_record = 5;
  repeated SignedRecord owner_authorization = 6;
  // PURGE requires the independently verified owner authorization chain and
  // exact operation signature. Ordinary write cannot satisfy that requirement.
  // KIND_ATTACHMENT generically carries native StateAttachments. SemanticIndex
  // uses record_format "heddle-state-attachment-msgpack-v1" and original named
  // MessagePack bytes, with typed native state-attachment identity in address.
  // It requires a matching PublishContentOpen.semantic_indexes manifest and
  // current spool-write plus per-author/provenance/predecessor validation.
  // No AnalysisArtifact is accepted as a client attachment.
}

// Hard ingestion ceilings, independently of general source-transfer budgets.
// Absent on Ready means client SemanticIndex ingestion is unsupported. A
// supporting endpoint advertises positive limits no greater than 100000 nodes,
// 67108864 decoded bytes and depth 64. See code-navigation.md for accounting.
message SemanticIndexLimits {
  uint32 max_nodes = 1;
  uint64 max_bytes = 2;
  uint32 max_depth = 3;
}

message SemanticClosureObject {
  // Exactly 32 bytes, native Blob identity over the canonical object payload.
  bytes hash = 1;
  uint64 size = 2; // Decoded canonical payload byte length, not pack length.
}

// Signed opening inventory for one client-attested native StateAttachment.
// At most one index for this exact opening Thread/revision. Original attachment
// bytes travel in TransferSidecar; all semantic object bytes travel in the
// declared native pack/index pair. The complete transitive closure includes
// binding-delta parents, edge target file nodes and reverse dependencies.
message SemanticIndexPublication {
  ObjectAddress attachment = 1; // algorithm "state-attachment", native typed ID.
  bytes root_hash = 2; // SemanticIndexRoot Blob hash, exactly 32 bytes.
  // Exact State.tree native hash. SemanticIndexRoot.tree is a DIFFERENT hash
  // naming the semantic tree; structural path/blob binding must also be checked.
  bytes source_tree_hash = 3;
  // Unique, lexicographically hash-sorted full closure including root_hash.
  // No semantic reference may be satisfied from an unrelated hosted CAS object.
  repeated SemanticClosureObject objects = 4;
}
message TransferReady {
  EndpointRef endpoint = 1;
  ThreadRef thread = 2;
  RevisionRef current = 3;
  bytes current_version = 4;
  SignedSpoolOwnerGenesis owner_genesis = 5;
  repeated TransferObject have = 6;
  repeated TransferObject need = 7;
  TransferCheckpoint checkpoint = 8;
  // Mandatory effective ReadBudget echo, with the stream.proto clamp/floor.
  ReadBudget budget = 9;
  bool full_closure_available = 10;
  repeated TransferObject missing = 11;
  repeated ThreadOverview advertised_threads = 12;
  PageInfo page = 13;
  // Exact whole artifacts selected for this download, in transmission order.
  // Chunk offsets/lengths must stay inside these independently hashed extents.
  repeated PackExtent packs = 14;
  // Clone verifies owner history and installs the original Thread genesis
  // before materializing source. Neither identity is minted by the receiver.
  OwnerState ownership = 15;
  ThreadGenesisRecord thread_genesis = 16;
  SemanticIndexLimits semantic_index_limits = 17;
  // Fetch inventory, present only for include_semantic_index and a usable,
  // authorized attachment. Same manifest/closure validation as PublishContent.
  repeated SemanticIndexPublication semantic_indexes = 18;
  heddle.api.common.ProtocolCompatibility protocol = 19;
  ImportPublicProofBundleV1 import_authority = 20;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 21;
}
message ProviderExtent {
  EndpointRef provider = 1;
  ProviderReadTicket ticket = 2;
  ProviderPhysicalRange range = 3;
}
// A physical R2 range exactly tiled by independently hashed encoded records.
// record_set_commitment is a metadata commitment over pack identity, offset,
// length and ordered encoded record digests; it is not a hash of range bytes.
message ProviderPhysicalRange {
  bytes pack_id = 1;
  string object_etag = 2;
  uint64 offset = 3;
  uint64 length = 4;
  bytes record_set_commitment = 5;
}
// The provider verifies this typed ticket against the published canonical
// extent set and the attenuated caller capability. A ticket alone grants no
// access; the opening's native request proof binds the bearer key, the
// authenticated Iroh client peer matches client, and the receiver's endpoint
// matches provider. Root rotation and expiry are independently checked.
message ProviderReadTicket {
  bytes attenuated_capability = 1;
  bytes extent_set_digest = 2;
  SpoolRef spool = 3;
  SharedFacet facet = 4;
  string audience = 5;
  bytes content_root = 6;
  bytes pack_id = 7;
  string object_etag = 8;
  uint64 offset = 9;
  uint64 length = 10;
  EndpointRef provider = 11;
  EndpointRef client = 12;
  bytes assembly_digest = 13;
  google.protobuf.Timestamp expires_at = 14;
  bytes record_set_commitment = 15;
}
// One record in output-pack order. Provider bytes must occupy an exact tiled
// physical range; inline bytes arrive as bounded ProviderInlineChunk frames.
// In either case the client verifies the encoded bytes and decoded object.
message ProviderAssemblyRecord {
  TransferObject object = 1;
  uint64 encoded_length = 2;
  ObjectAddress encoded_digest = 3;
  uint64 output_offset = 4;
  oneof source {
    ProviderRangeSource provider = 5;
    ProviderInlineSource inline = 6;
  }
}
message ProviderRangeSource {
  uint32 extent_index = 1;
  // Offset relative to that ProviderPhysicalRange, starting at zero.
  uint64 source_offset = 2;
}
message ProviderInlineSource {}
message ProviderInlineChunk {
  bytes assembly_digest = 1;
  uint32 record_index = 2;
  uint64 offset = 3;
  bytes data = 4;
}
// An unsigned challenge carried over an already authenticated Fetch stream.
// Only the client's exact-plan consent is signed. Both digests and the
// selected Thread/revision bind all tickets and virtual-pack placement.
message ProviderPlanChallenge {
  bytes nonce = 1;
  ThreadRef thread = 2;
  RevisionRef revision = 3;
  EndpointRef issuer = 4;
  EndpointRef client = 5;
  google.protobuf.Timestamp expires_at = 6;
  bytes extent_set_digest = 7;
  bytes assembly_digest = 8;
}
// Authenticated transport hints only. The connected Iroh peer must still
// match provider.public_key; a URL is never a source of authority.
message ProviderDialRoute {
  EndpointRef provider = 1;
  oneof address {
    string relay_url = 2;
    string websocket_url = 3;
  }
}
message ProviderPlan {
  bytes extent_set_digest = 1;
  repeated ProviderExtent extents = 2;
  ProviderPlanChallenge challenge = 3;
  bytes assembly_digest = 4;
  // Canonical LMPK v4 header: 16 bytes, including the exact record count.
  bytes pack_header = 5;
  // Must equal 16 + sum(encoded record lengths) + the final 32-byte
  // BLAKE3(header || ordered encoded record bytes) trailer.
  uint64 output_pack_length = 6;
  repeated ProviderAssemblyRecord records = 7;
}
// Capability-free candidate layout. It is not a serving grant. The client
// consents to its exact challenge before the issuer publishes ticket-bearing
// ProviderPlan; both phases use the same canonical layout commitments.
message ProviderOfferExtent {
  EndpointRef provider = 1;
  ProviderPhysicalRange range = 2;
  SpoolRef spool = 3;
  SharedFacet facet = 4;
  string audience = 5;
  bytes content_root = 6;
}
message ProviderOffer {
  bytes extent_set_digest = 1;
  repeated ProviderOfferExtent extents = 2;
  ProviderPlanChallenge challenge = 3;
  bytes assembly_digest = 4;
  bytes pack_header = 5;
  uint64 output_pack_length = 6;
  repeated ProviderAssemblyRecord records = 7;
}
message ProviderConsent {
  bytes extent_set_digest = 1;
  SignedRecord exact_plan_consent = 2;
  bytes assembly_digest = 3;
}
message ProviderResult {
  bytes extent_set_digest = 1;
  bytes assembly_digest = 2;
  // Ordered metadata commitments for ranges actually verified by the client.
  // This report never authorizes source publication or claims server truth.
  repeated bytes verified_range_commitments = 3;
  ObjectAddress assembled_pack = 4;
}
message PublicationReceipt {
  string client_operation_id = 1;
  EndpointRef destination = 2;
  ThreadRef thread = 3;
  RevisionRef revision = 4;
  bytes sharing_policy_version = 5;
  ObjectAddress accepted_inventory = 6;
  ImportPublicProofBundleV1 import_authority = 9;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 10;
  // Present only for an atomic Git command, after every historical source
  // closure and the expected-old fence committed in the native transaction.
  GitPushAcceptanceReceipt git_acceptance = 11;
  oneof outcome {
    Applied accepted = 7;
    heddle.api.common.CallFailure rejected = 8;
  }
}
message FetchClientFrame {
  oneof body {
    FetchOpen open = 1;
    ProviderConsent consent = 2;
    ProviderResult provider_result = 3;
    TransferCheckpoint checkpoint = 4;
  }
}
message FetchComplete {
  RevisionRef revision = 1;
  TransferCheckpoint checkpoint = 2;
  Coverage closure = 3;
  repeated TransferObject missing = 4;
}
// One converted Git ancestor of a HYBRID import tip: the exact canonical State
// bytes a source pack would carry, and nothing else. No tree or blob travels
// here; the source pack still holds exactly the selected revision's closure.
message ImportAncestorState {
  heddle.api.common.StateId id = 1;
  bytes canonical_state = 2;
}
// Current disclosure constraints for the complete (publication, Thread) floor,
// including on COVERAGE_PATH pages. Not signed ancestry proof or authority.
// The endpoint MUST send every positive native_import_floor_tiers row from
// weft migration 019: only private/restricted, grouped by (tier, label), with
// tier_rows counting ALL member tier rows, across all sources/origins. Public,
// internal and team tiers do not constrain inherited ancestry and are omitted.
// Send an explicitly present empty summary when no such rows exist. Refuse
// Fetch when native_import_floor_refs.incomplete_members is nonzero or a
// member node is incomplete; never represent an incomplete floor as empty.
// Every page repeats the identical summary, sorted by (tier, label), without
// duplicate pairs; receivers reject absent summaries and invalid/zero rows.
message ImportFloorTierSummary {
  message Row {
    enum Tier {
      TIER_UNSPECIFIED = 0;
      TIER_PRIVATE = 1;
      TIER_RESTRICTED = 2;
    }
    Tier tier = 1;
    string label = 2;
    uint64 tier_rows = 3;
  }
  repeated Row rows = 1;
}
// Imported Git ancestry of one delegated import tip, paged (alpha.42).
//
// A HYBRID import is ONE signed native operation per branch result slot; the
// converted Git ancestors are States in that tip State's parent closure (the
// "import floor"), not native operations, so ReplicationOperations cannot
// carry them and a source pack carries only the selected State. This frame
// carries the floor's States. The floor is already bound by signature: the
// import operation's resulting_content_digest commits to the exact tip
// Capture, the tip State commits to its parent StateIds, and every member
// commits to its own parents, so the whole set is a Merkle closure rooted at
// the signed tip. No additional signed floor digest or count exists or is
// needed; member_count and page_count are endpoint bookkeeping that let the
// receiver refuse early and detect truncation, never a source of trust.
//
// Receiver checks, all before installing anything:
//  1. TransferReady.import_authority is present and was authenticated
//     independently (descriptor root, owner, witness); signed_operation_digest
//     is the digest of one of its `operations`, whose resulting frontier
//     selects a carried ReplicationOperations original whose Capture State is
//     `tip`. A page for any other operation, Thread or tip is rejected.
//  2. Every page of one floor repeats identical thread, tip,
//     signed_operation_digest, coverage, page_count, member_count and floor_tiers;
//     pages may arrive in any order; after sorting by page_index they are
//     contiguous 0..page_count-1 with no gap or repeat; the
//     sum of carried States equals member_count.
//  3. Every carried State decodes canonically and its content-derived
//     StateId equals `id` (address check). A duplicate id within one page set
//     is rejected; different floors may share converted Git States.
//  4. Every carried State is reachable from `tip` through carried States by
//     State parents. A State outside the floor is rejected, whatever it is.
//  5. COVERAGE_FLOOR: the closure is complete. Every parent named by `tip` or
//     by a carried State is either carried or is the source State of one of
//     the tip operation's causal parent operations (the signed frontier; a
//     continuation import's parents are exactly those, so its floor is
//     empty). A missing middle State fails here. This set is exactly the
//     signed floor, and it is what a fresh clone must install.
//  6. COVERAGE_PATH: TransferReady.current names a carried State (an older
//     imported commit); completeness below it is not required. The endpoint
//     uses this to prove FetchOpen.revision lies inside the floor.
//  7. The receiver installs the States only after the whole Fetch verified
//     (the Complete frame), together with the selected revision's closure,
//     and records the floor and floor_tiers. The local visibility walk stops
//     at floor MEMBERS, applying the whole floor tier summary to each member.
//     The tip's causal parents (its frontier) are still walked.
//
// Every delegated import operation in the carried causal ancestry whose tip
// has parents outside the signed frontier MUST be covered by exactly one
// page set; an uncovered floor fails the Fetch (a clone that installs only
// the tip shows nothing but an embargo placeholder).
//
// Paging and limits. A page carries at most 4096 States and, like every
// frame, fits ReadBudget.max_frame_bytes. Pages are charged against the
// receiver's separate ancestry budget, apart from the 100000-object
// source pack limit, because they are States, not pack objects. A receiver
// MUST accept at least 131072 States and 256 MiB per Fetch so the largest
// known HYBRID history (boost, 94794 commits) fits with headroom; endpoints
// refuse larger imports at Prepare rather than truncating a floor.
message ImportAncestryPage {
  ThreadRef thread = 1;
  heddle.api.common.StateId tip = 2;
  // Digest of the exact SignedDelegatedImportOperationV1 in
  // TransferReady.import_authority.operations (heddle-signed-delegated-import-operation-v1).
  bytes signed_operation_digest = 3;
  enum Coverage {
    COVERAGE_UNSPECIFIED = 0;
    COVERAGE_FLOOR = 1;
    COVERAGE_PATH = 2;
  }
  Coverage coverage = 4;
  uint32 page_index = 5;
  uint32 page_count = 6;
  // Total States across all pages of this floor or path.
  uint32 member_count = 7;
  repeated ImportAncestorState states = 8;
  // Required-present, whole-floor current disclosure summary, even for PATH.
  ImportFloorTierSummary floor_tiers = 9;
}
message FetchServerFrame {
  oneof body {
    TransferReady ready = 1;
    PackChunk pack = 2;
    TransferSidecar sidecar = 3;
    ProviderPlan provider_plan = 4;
    FetchComplete complete = 5;
    // Original signed causal operations for the selected facets. A receiver
    // admits these to the same replica as live sync; projections are not proofs.
    // Bounded originals and matched retained authority receipts use exactly
    // the live-replication batch shape; a receipt is not current disclosure permission.
    ReplicationOperations operations = 6;
    // Original creator-signed genesis for a required cross-Thread source
    // dependency. Target access never grants access to this dependency.
    ThreadGenesisRecord thread_genesis = 7;
    ProviderInlineChunk provider_inline = 8;
    ProviderOffer provider_offer = 9;
    // Converted Git ancestors of a HYBRID import tip, States only. Accepted
    // only when Ready carries an authenticated import_authority; see the
    // message for the receiver's checks. May arrive anywhere before Complete.
    ImportAncestryPage import_ancestry = 10;
  }
}
// Bulk content availability for an already admitted Thread capture. Metadata
// replication owns causal heads; uploading bytes cannot select or replace one.
// The opening PoP binds the exact Thread/revision, policy, complete pack/index
// addresses and lengths, operation identity, and any resume checkpoint.
message PublishContentOpen {
  ThreadRef thread = 1;
  RevisionRef revision = 2;
  bytes sharing_policy_version = 3;
  // Complete pack/index objects: offset is zero and length is the whole object.
  // The server validates hashes and the exact authorized source closure before
  // installation. Extra context, forensic objects, or history are not admitted
  // merely because they were included in a source pack.
  repeated PackExtent packs = 4;
  TransferCheckpoint checkpoint = 5;
  // Bound by the opening proof and checked against the authenticated transport.
  // A proof for one receiver cannot be forwarded to publish at another.
  EndpointRef source = 6;
  EndpointRef destination = 7;
  // Optional explicit admission of client SemanticIndex closure. Empty preserves
  // source-only transfer. The opening proof and plan bind this complete manifest;
  // Finish atomically installs source, attachment, closure and lookup/projections.
  // Over-limit decode/walk fails with typed RESOURCE_EXHAUSTED, never partial
  // installation. Only exactly declared semantic extras may enter source packs.
  repeated SemanticIndexPublication semantic_indexes = 8;
  heddle.api.common.ProtocolCompatibility protocol = 9;
  ImportPublicProofBundleV1 import_authority = 10;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 11;
  // Opt-in native Git admission. Ordinary source publication remains unchanged.
  GitPushAcceptance git_acceptance = 12;
}
// The native publisher authenticates the complete opening with its own PoP.
// transport_token authenticates a distinct Git actor; it never supplies native
// authorship. Fresh session tokens do not change semantic command identity.
message GitPushAcceptance {
  bytes expected_revision = 1;
  bytes expected_git_commit = 2;
  bytes accepted_git_commit = 3;
  bytes gateway_publisher = 4;
  string transport_token = 5;
  // Parent-before-child, exact independently validated source packs. The main
  // opening is the final tip; these entries contain every other required
  // historical revision. The receiver charges all entries to one budget.
  repeated GitPushHistoryRevision history = 6;
  // Exact registry-resolved Git scope, compared to the authenticated session.
  GitTransportScope scope = 7;
  // Mandatory presence; observed server Thread generation, including zero.
  // Checked with expected_revision under the native writer row lock.
  optional int64 expected_native_generation = 8;
  // Mandatory 32-byte heddle.git.acceptance.originals.v1 digest over the
  // complete distinct signed operation manifest across every uploaded revision.
  // Binds exact canonical and signature bytes; transport batching is irrelevant.
  bytes originals_digest = 9;
}
message GitPushHistoryRevision {
  string client_operation_id = 1;
  PublishContentOpen open = 2;
}
message GitPushHistoryFrame {
  uint32 index = 1;
  oneof body {
    PackChunk pack = 2;
    TransferSidecar sidecar = 3;
    PublishContentFinish finish = 4;
    ReplicationOperations operations = 5;
    ThreadGenesisRecord thread_genesis = 6;
  }
}
message GitPushAcceptanceReceipt {
  bytes expected_revision = 1;
  bytes expected_git_commit = 2;
  bytes accepted_git_commit = 3;
  bytes gateway_publisher = 4;
  string actor_account_id = 5;
  bytes actor_credential_digest = 6;
  bytes request_digest = 7;
  int64 native_generation = 8;
  // Exact uploaded SourcePack inventories, including the selected tip. These
  // remain bound to the command even when an ancestor was already retained in
  // a different physical representation.
  repeated PublicationReceipt history = 9;
  // Exact sorted unique blob closure reconstructed by the receiver. Used to
  // recheck native redaction locks on reads/retries; never caller-authored.
  repeated bytes blob_ids = 10;
  // Authoritative source generation at the expected-old native head fence.
  int64 previous_native_generation = 11;
  // Server-derived durable native source markers, in exactly the same ordered
  // Thread/State set as history. Native first inventories and their historical
  // Sharing frontiers are stable and may differ from a later valid upload.
  repeated GitHistoryRevision retained_history = 12;
}
// POST /git/history/authorize. Exact current disclosure of a durable command's
// complete history; a response must never be cached as future authorization.
message GitHistoryAuthorizeRequest {
  string transport_token = 1;
  GitTransportScope scope = 2;
  string client_operation_id = 3;
  // With no operation ID, authorize an existing native head for first Git
  // discovery. Exactly one selector is required; this is never push acceptance.
  bytes expected_revision = 4;
}
message GitHistoryAuthorizeResponse {
  PublicationReceipt receipt = 1;
  int64 authorization_epoch = 2;
  int64 source_generation = 3;
  GitHistoryBootstrap bootstrap = 4;
  // Current authoritative nearest owning ancestor's account, not Git actor.
  string billing_owner_account_id = 5;
  // Verified immutable SignedSpoolOwnerGenesis body digest.
  bytes spool_genesis = 6;
  // Current selected Thread Sharing frontier under the same disclosure fence.
  bytes sharing_policy_version = 7;
}
message GitHistoryRevision {
  ThreadRef thread = 1;
  RevisionRef revision = 2;
  ObjectAddress accepted_inventory = 3;
  bytes sharing_policy_version = 4;
}
message GitHistoryBootstrap {
  ThreadRef thread = 1;
  RevisionRef head = 2;
  // Complete retained native source graph, including dependency Threads.
  // Fetch each revision independently; a tip pack is not historical content.
  repeated GitHistoryRevision revisions = 3;
  repeated bytes blob_ids = 4;
  bytes closure_digest = 5;
}
message PublishContentFinish {
  // Names the server's current committed transfer plan, not a caller assertion
  // that bytes or closure were accepted. A FIN alone never publishes content.
  TransferCheckpoint checkpoint = 1;
}
message PublishContentClientFrame {
  // Required and unchanged on every frame; the opening proof covers this value.
  string client_operation_id = 1;
  oneof body {
    PublishContentOpen open = 2;
    PackChunk pack = 3;
    TransferSidecar sidecar = 4;
    PublishContentFinish finish = 5;
    // Original signed source causal dependencies, symmetric with Fetch. Stage
    // within the transfer budget; receiving a record does not admit its source.
    // Finish verifies original authority, each Thread audience and complete
    // causal/source closure before atomically publishing source availability.
    // Bounded originals and matched retained authority receipts use exactly
    // the live-replication batch shape; a receipt is not current disclosure permission.
    ReplicationOperations operations = 6;
    // Original genesis and independently verifiable creator/admission proof for
    // the selected Thread or a required source dependency. A courier cannot
    // replace the creator, enroll an account or implicitly claim local ownership.
    ThreadGenesisRecord thread_genesis = 7;
    // All history finishes must precede the outer Finish. Receiving this frame
    // stages bytes only; no intermediate head or source availability commits.
    GitPushHistoryFrame git_history = 8;
  }
}
message PublishContentServerFrame {
  oneof body {
    TransferReady ready = 1;
    TransferCheckpoint checkpoint = 2;
    // Accepted only after complete authorized closure is durably installed.
    // Observers may then treat this exact hosted revision as source-available.
    PublicationReceipt receipt = 3;
  }
}

message ReadProviderExtentRequest {
  ProviderReadTicket ticket = 1;
  bytes extent_set_digest = 2;
  ProviderPhysicalRange range = 3;
  reserved 4;
}
message ProviderRangeChunk {
  // Offset within the single ticket-bound physical range.
  uint64 offset = 1;
  bytes data = 2;
}
message ProviderExtentEvent {
  oneof body {
    ProviderPhysicalRange ready = 1;
    ProviderRangeChunk chunk = 3;
    TransferCheckpoint complete = 2;
  }
}

// A causal frontier is portable within its exact Thread/facet/format. It is
// never an Observe cursor or a bulk-transfer checkpoint. Heads are paged using
// the negotiated max_items; repeated Have frames contribute to the same round.
message CausalFrontier {
  SharedFacet facet = 1;
  repeated bytes heads = 2;
}
// Carries original ownership proof with the immutable creator-signed identity.
// The receiver independently verifies it; transport credentials never select
// the owning account or enroll an otherwise-untrusted account root.
message ThreadGenesisRecord {
  SignedRecord genesis = 1;
  bytes creator_authority = 2;
  // Original account authority admitted by an independently pinned hosted executor.
  // Does not authorize current disclosure or enroll the original account locally.
  SignedRecord admission = 3;
  // Exact co-signed claims, including those retained as resolved history.
  // Unresolved conflicting claims fail closed; a transport must never select a
  // winner or rewrite immutable genesis. Claims and their resolutions share the
  // metadata/frame budgets below; large histories require bounded sync batches.
  repeated SignedRecord ownership_claims = 4;
  // Optional independently trusted first-admission testimony matched by claim
  // identity. Original acceptance expiry does not invalidate retained admission.
  repeated SignedRecord ownership_claim_admissions = 5;
  // Exact heddle-original-boundary-acceptance-v1 signatures needed by this
  // genesis/claim bundle. Fresh acceptance binds the complete streamed-original
  // manifest and publication intent; verify the accepting authority now. It does
  // not assert historical validity of expired/revoked original authority or
  // change original attribution. On relay, require independently pinned,
  // versioned admission testimony explicitly referencing the acceptance digest;
  // acceptance alone cannot authorize another destination or a manifest subset.
  // At most 128 distinct acceptances per transfer, each canonical record <=96KiB,
  // within the existing metadata/frame budgets (16MiB transfer, 256KiB frame).
  // Deduplicate identical evidence across wrappers/batches; reject conflicting
  // or unreferenced evidence. No executor/root trust is enrolled from this field.
  repeated SignedRecord boundary_acceptances = 6;
  // Original local-owner/recipient co-signed ownership resolutions in causal
  // order. Retain losing claims as evidence. Duplicate records are idempotent;
  // a settled claim replay cannot reopen the same conflict. Admission verifies
  // exact Thread, Spool, conflict set and observed source frontier.
  repeated SignedRecord ownership_resolutions = 7;
  // Independently trusted first-admission testimony for the matching resolution
  // identities. Current authorization governs a new admission; retained exact
  // history is not invalidated merely by the accepting credential's expiry.
  repeated SignedRecord ownership_resolution_admissions = 8;
  // Original public creator binding; retain byte-identically on relay.
  SignedNativeGenesisAuthorityV1 native_genesis_authority = 9;
}

message ReplicationOpen {
  ThreadRef thread = 1;
  repeated SharedFacet facets = 2;
  bytes sharing_policy_version = 3;
  // Original creator-signed genesis for first publication. The receiver must
  // authorize the destination spool and verify canonical bytes, creator proof,
  // and exact Thread/spool identity before durably installing it and emitting
  // Ready. Reconnects may include it again; it cannot replace another genesis.
  ThreadGenesisRecord thread_genesis = 4;
  ReadBudget budget = 5;
  repeated string record_formats = 6;
  heddle.api.common.ProtocolCompatibility protocol = 10;
  ImportPublicProofBundleV1 import_authority = 11;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 12;
  // Fresh session binding; the request PoP covers this exact opening.
  bytes session_nonce = 7;
  // The opening PoP binds both Iroh identities; replay on another peer or
  // destination cannot open a stream under the captured credential.
  EndpointRef source = 8;
  EndpointRef destination = 9;
}
// budget is the mandatory effective ReadBudget echo under stream.proto rules.
message ReplicationReady {
  EndpointRef endpoint = 1;
  ThreadRef thread = 2;
  repeated SharedFacet facets = 3;
  bytes sharing_policy_version = 4;
  ReadBudget budget = 5;
  repeated string record_formats = 6;
  heddle.api.common.ProtocolCompatibility protocol = 7;
  ImportPublicProofBundleV1 import_authority = 8;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 9;
}
message ReplicationHave {
  repeated CausalFrontier frontiers = 1;
}
message ReplicationNeed {
  // Content-addressed canonical Thread operation IDs, exactly 32 bytes each.
  repeated bytes operation_ids = 1;
}
message ReplicationOperations {
  // Each canonical record binds Thread, facet and causal parents. Peers verify
  // the format, ID, authorization and dependency scope before admitting it.
  repeated SignedRecord operations = 1;
  // Optional original-author admission statements, signed by an independently
  // pinned hosted executor. The explicit canonical format defines the admission
  // basis; adding evidence never reinterprets an older receipt. Each binds
  // one operation ID above, its immutable Spool genesis, Thread, original actor,
  // publisher and authority digest. Reject duplicate or unmatched sidecars.
  // Preserve the original operation signature. A receipt proves first durable
  // authority admission, including pending causal work; it is not causal
  // acceptance, current permission, approval or landing eligibility. Receivers
  // retain the exact statement atomically with the original pending bytes and
  // never infer executor trust from an incoming statement or courier identity.
  repeated SignedRecord authority_admissions = 2;
  // Same acceptance evidence and transfer-wide limits as ThreadGenesisRecord.
  // Fresh publication verifies the exact complete original manifest, intent and
  // current accepting capability; retained relay requires a matched explicitly
  // acceptance-based admission receipt from an independently trusted executor.
  // Preserve the original author and bytes; this is separate present-tense
  // acceptance, never a fabricated historical authorization timestamp. Evidence
  // contributes to the existing batch byte budget; operations remains nonempty.
  repeated SignedRecord boundary_acceptances = 3;
  ImportPublicProofBundleV1 import_authority = 4;
  // Explicit native arm; reject simultaneous import/native carriers.
  NativePublicProofBundleV1 native_authority = 5;
}
message ReplicationRejection {
  bytes operation_id = 1;
  heddle.api.common.CallFailure failure = 2;
}
message ReplicationReceipt {
  // Accepted means durably stored with accepted causal closure. A record merely
  // received with missing parents is pending, and must not advance this frontier.
  repeated bytes accepted_operation_ids = 1;
  repeated bytes pending_operation_ids = 2;
  repeated ReplicationRejection rejected = 3;
  repeated CausalFrontier accepted_frontiers = 4;
  // Metadata admission is distinct from source/object availability.
  repeated TransferObject missing_objects = 5;
  bytes sharing_policy_version = 6;
}
message ReplicateThreadRequest {
  oneof body {
    ReplicationOpen open = 1;
    ReplicationHave have = 2;
    ReplicationNeed need = 3;
    ReplicationOperations operations = 4;
    ReplicationReceipt receipt = 5;
  }
}
message ReplicateThreadResponse {
  oneof body {
    ReplicationReady ready = 1;
    ReplicationHave have = 2;
    ReplicationNeed need = 3;
    ReplicationOperations operations = 4;
    ReplicationReceipt receipt = 5;
  }
}
