syntax = "proto3";

package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha2/administration.proto";
import "heddle/api/v1alpha2/collaboration.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/stream.proto";

enum ThreadLifecycle {
  THREAD_LIFECYCLE_UNSPECIFIED = 0;
  THREAD_LIFECYCLE_DRAFT = 1;
  THREAD_LIFECYCLE_ACTIVE = 2;
  THREAD_LIFECYCLE_READY = 3;
  THREAD_LIFECYCLE_LANDED = 4;
  THREAD_LIFECYCLE_ABANDONED = 5;
}

enum ReviewReadiness {
  REVIEW_READINESS_UNSPECIFIED = 0;
  REVIEW_READINESS_UNKNOWN = 1;
  REVIEW_READINESS_NEEDS_APPROVAL = 2;
  REVIEW_READINESS_BLOCKED = 3;
  REVIEW_READINESS_ELIGIBLE = 4;
}

message ThreadIntent {
  string outcome = 1;
  repeated string acceptance_criteria = 2;
  string principal_id = 3;
  string agent_id = 4;
  bytes version = 5;
  bool principal_approved = 6;
  repeated string origin_urls = 7;
}

message ThreadRelationship {
  ThreadRef thread = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PARENT = 1;
    KIND_CHILD = 2;
    KIND_DEPENDENCY = 3;
    KIND_SUPERSEDES = 4;
  }
  Kind kind = 2;
}

message ThreadOverview {
  ThreadRef ref = 1;
  string name = 2;
  bytes version = 3;
  ThreadIntent intent = 4;
  // All non-dominated accepted captures at this endpoint. Concurrent heads are
  // preserved until explicit source integration; arrival time is not authority.
  // The source endpoint and coverage remain part of the observation.
  repeated RevisionRef source_heads = 5;
  RevisionRef base = 6;
  ThreadLifecycle lifecycle = 7;
  ReviewReadiness readiness = 8;
  repeated Requirement requirements = 9;
  repeated ThreadRelationship relationships = 10;
  repeated ActionAvailability actions = 11;
  repeated SectionStatus sections = 12;
  // Count only captures visible to this reader. Absent when a bounded window
  // cannot establish the reader-visible total; never expose an unfiltered count.
  optional uint64 capture_count = 13;
  uint64 open_discussion_count = 14;
  google.protobuf.Timestamp updated_at = 15;
  RevisionRef integrated_revision = 16;
  // Exact aggregate policy/group version required by review and landing,
  // including the explicit empty-policy set. Never inferred from no records.
  bytes review_policy_version = 17;
  // Caller-private preference composed by an exact Thread page. Missing means
  // unavailable, unrequested, or anonymous (including ordinary list rows).
  // Present false + empty version proves no bookmark exists at this snapshot;
  // present false + nonempty version is a retained tombstone. Never substitute
  // this version for Thread.version. The ref binds the authenticated account.
  BookmarkRecord current_bookmark = 18;
  // Independent causal fields compose across devices. Concurrent candidates
  // for one field remain explicit until a caller signs a successor observing
  // every candidate; timestamps never select a winner.
  repeated ThreadMetadataConflict metadata_conflicts = 19;
  // Includes empty frontiers for genesis/default fields. Supplies all parent
  // operation IDs needed to sign an update without another round trip.
  repeated ThreadPropertyFrontier metadata_frontiers = 20;
  ThreadAudiencePolicy audience = 21;
  ThreadRetentionPolicy retention = 22;
  // Independently admitted effective owner. Missing means unavailable, never
  // infer ownership from the connected endpoint or current account.
  ThreadOwnership ownership = 23;
  // Exact signed source operation IDs, not materialized revision hashes.
  // An incomplete frontier cannot be used for an ownership claim.
  SourceOperationFrontier source_frontier = 24;
  // Present only when ObserveThread selected an independently readable target.
  // Legacy single-head projection. New producers also fill landing_assessments
  // and alternatives; never choose one competing head for this field.
  LandingAssessment landing_assessment = 25;
  // Exactly one per visible published source head when a target is readable.
  // Every assessment.source matches one source_heads entry; a multi-head
  // source is blocked for conflict while each head still has a result.
  // Each entry must equal the matching alternative.assessment below.
  repeated LandingAssessment landing_assessments = 26;
  // One per visible published source head, including a sole head. Each has an
  // assessment when the target is readable. The same audience/section gates
  // apply to actor, review, evidence and diff material as to their originals.
  repeated ThreadAlternative alternatives = 27;
  // Optional after landing. A local landing can supply its own signed executor
  // record with the same semantics; absence is not evidence of permission.
  LandingRecord landing_record = 28;
  // Present whenever a landing_target was requested but the singular
  // landing_assessment is absent. MULTIPLE_HEADS explains an intentionally
  // absent singular result while per-head results remain available.
  // No target or a returned singular assessment means no gap status.
  LandingAssessmentStatus landing_assessment_status = 29;
}

// Why a requested assessment is absent, not a verdict permitting landing.
// An emitted status has a known nonzero state and a Requirement with a known
// kind and nonempty explanation. UNSPECIFIED/unknown/missing means unknown to
// readers; producers MUST NOT emit UNSPECIFIED as a reason to wait or land.
// State, explanation, subject and policy MUST NOT reveal hidden base/target
// identity or existence. Missing/forbidden targets keep identical RPC behavior.
message LandingAssessmentStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_FAILED = 2;
    STATE_NOT_ELIGIBLE = 3;
    // No caller-visible published source head; never count hidden heads.
    STATE_NO_PUBLISHED_HEAD = 4;
    // Only when this caller independently already knows the base exists.
    // Otherwise use generic UNAVAILABLE with no hidden reference/explanation.
    STATE_BASE_UNREADABLE = 5;
    // Source/target material unavailable; does not distinguish absent/forbidden.
    STATE_UNAVAILABLE = 6;
    // Singular overview omitted; per-head assessments may still be present.
    STATE_MULTIPLE_HEADS = 7;
  }
  State state = 1;
  // Same typed requirement/display explanation pattern as ActionAvailability.
  // Sanitize errors; advice never grants authority. No hidden references.
  Requirement reason = 2;
}

message LandingAssessment {
  ThreadRef target = 1;
  RevisionRef source = 2;
  RevisionRef expected_target = 3;
  bytes policy_version = 4;
  ReviewReadiness readiness = 5;
  repeated Requirement requirements = 6;
  // Successful policy requirements for this exact source, target and policy
  // version. Empty/unset never asserts that an unavailable policy passed.
  LandingSatisfaction satisfied_by = 7;
  // One result for every required check, including checks with no record.
  repeated CheckEvidenceCurrency checks = 8;
}

message LandingSatisfaction {
  // Must equal LandingAssessment.policy_version. Never borrow satisfying
  // records from another source, target or policy version.
  bytes policy_version = 1;
  repeated SatisfiedPolicyRequirement requirements = 2;
}

message SatisfiedPolicyRequirement {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_REQUIRED_CHECK = 1;
    KIND_REVIEW_APPROVALS = 2;
    KIND_REVIEW_GROUP = 3;
  }
  Kind kind = 1;
  // For REQUIRED_CHECK, the exact policy check name.
  string check = 2;
  // For REVIEW_GROUP, the exact policy group record.
  RecordRef group = 3;
  // Signed ReviewRecord.decision.ref values that passed the evaluator for the
  // assessment's source, target and policy. No opinions or previews here.
  repeated RecordRef approvals = 4;
  // Signed EvidenceRecord.ref values that passed for the assessment's source.
  repeated RecordRef evidence = 5;
  // Rule identity within LandingSatisfaction.policy_version. A review policy
  // uses review_policy plus rule_index: zero for required_approvals, otherwise
  // the 1-based position in required_checks or groups (selected by kind).
  // The settings approval rule has its own source and index zero. Do not merge
  // equal check/group names from different policies or repeated rules.
  enum RuleSource {
    RULE_SOURCE_UNSPECIFIED = 0;
    RULE_SOURCE_REVIEW_POLICY = 1;
    RULE_SOURCE_SPOOL_SETTINGS_REQUIRE_REVIEW_TO_LAND = 2;
  }
  RuleSource rule_source = 6;
  RecordRef review_policy = 7;
  uint32 rule_index = 8;
}

enum EvidenceCurrency {
  EVIDENCE_CURRENCY_UNSPECIFIED = 0;
  // Passing, authorized evidence for the exact source revision.
  EVIDENCE_CURRENCY_CURRENT = 1;
  // Previously passing evidence on recorded_revision, not this source.
  EVIDENCE_CURRENCY_STALE = 2;
  // The current exact-source terminal result is failed, errored or skipped.
  EVIDENCE_CURRENCY_FAILED = 3;
  // No retained result available for this required check/source.
  EVIDENCE_CURRENCY_MISSING = 4;
}

message CheckEvidenceCurrency {
  string check = 1;
  // Exact head being assessed. A stale record never satisfies this revision.
  RevisionRef source = 2;
  EvidenceCurrency currency = 3;
  // Present for CURRENT, STALE or FAILED; the exact signed evidence record.
  RecordRef evidence = 4;
  // The revision on which the cited evidence was recorded. Required for STALE;
  // equals source for CURRENT and FAILED. Absent with evidence/actor for MISSING.
  RevisionRef recorded_revision = 5;
  // Derived from that evidence's signed original, not the observer/courier.
  string principal_id = 6;
  string agent_id = 7;
}

message ThreadAlternative {
  RevisionRef head = 1;
  // Attribution comes from this head's State; a missing producer stays unknown.
  CaptureSummary producer = 2;
  // The exact comparison used when requesting diff frames for this head.
  ReviewComparison diff = 3;
  // Only reviews bound to this head, selected target and policy version.
  repeated ReviewRecord reviews = 4;
  LandingAssessment assessment = 5;
  repeated CheckEvidenceCurrency checks = 6;
  // Present when a target was requested and this head has no assessment.
  // Mutually exclusive with assessment; same visibility rules as the overview.
  LandingAssessmentStatus assessment_status = 7;
}

// Decoded executor-signed integration, plus the exact signed Thread operation.
// The decoded fields are display/index hints, not independent authority. Verify
// raw_signed_operation against an independently pinned executor and referenced
// source, policy, review and evidence originals before trusting a landing. A
// local equivalent is a signed local target-history landing record with the
// same bindings, produced by a locally trusted executor. Only disclose these
// fields when the reader can inspect the corresponding signed originals.
message LandingRecord {
  ThreadRef source_thread = 1;
  RevisionRef source_revision = 2;
  ThreadRef target_thread = 3;
  RevisionRef result_revision = 4;
  bytes source_operation_digest = 5;
  // Exact sorted operation digests from the signed record, not a mutable tip.
  repeated bytes expected_target_frontier = 6;
  bytes policy_version = 7;
  // Exact sorted digests from the signed record. Review and evidence originals
  // are distinguished by resolving each digest, not by array position.
  repeated bytes review_evidence_digests = 8;
  // Typed digest of the exact retained signed landing request proof. Weft
  // must index and serve to authorized verifiers, by this digest, the canonical
  // signed preimage (method, exact request body, timestamp, nonce and signing
  // identity), signature, and portable account/delegation authority that bound
  // the signer at admission. Do not disclose a reusable bearer credential.
  // A digest or an account database row alone names no actor.
  bytes initiating_request_proof_digest = 9;
  bytes executor_key = 10;
  // Hosted integrations use the immutable Spool owner genesis. A local record
  // can name its independently pinned local executor trust anchor.
  bytes executor_trust_anchor_digest = 11;
  google.protobuf.Timestamp executed_at = 12;
  // Exact original signed operation bytes, including signature. Locally signed
  // integration records can use this slot with their own format and trust pin.
  bytes raw_signed_operation = 13;
  // Display attribution derived from the retained request proof and its
  // verified account/delegation chain, never from the executor signature.
  // Agent is empty for a direct principal request. If the proof or authority
  // is unavailable, leave both IDs unset; do not guess from the uploader.
  string initiating_principal_id = 14;
  string initiating_agent_id = 15;
  // Server-derived snapshot of the blocking-discussion resolutions considered
  // at landing, exposing administrator overrides in the landing receipt. Same
  // admission metadata as discussion history, bound to exact operation IDs.
  // Auxiliary display metadata, outside the executor-signed landing body and
  // raw_signed_operation; never infer signed approval/authorization from it.
  // Only disclose reader-visible originals. Empty may mean unavailable on an
  // older server; it does not prove that no administrator override occurred.
  repeated DiscussionResolutionRecord blocking_discussion_resolutions = 16;
}

message ThreadOwnership {
  oneof owner {
    bytes local_key = 1;
    PrincipalRef account = 2;
    ThreadOwnershipConflict conflict = 3;
  }
  // Present only after an explicit admitted local-key to account claim.
  bytes claim_id = 4;
}
message ThreadOwnershipConflict {
  // At most two distinct admitted claims. Neither candidate wins by time.
  repeated bytes claim_ids = 1;
}
message SourceOperationFrontier {
  // At most 128 distinct, ordered IDs. Empty and complete means genesis only.
  repeated bytes operation_ids = 1;
  bool complete = 2;
}

enum ThreadProperty {
  THREAD_PROPERTY_UNSPECIFIED = 0;
  THREAD_PROPERTY_NAME = 1;
  THREAD_PROPERTY_INTENT = 2;
  THREAD_PROPERTY_LIFECYCLE = 3;
  THREAD_PROPERTY_SHARING = 4;
  THREAD_PROPERTY_REVIEW = 5;
  THREAD_PROPERTY_AUDIENCE = 6;
  THREAD_PROPERTY_RETENTION = 7;
}
message ThreadPropertyFrontier {
  ThreadProperty property = 1;
  // Canonical review UUID for REVIEW; empty for the singleton properties.
  string record_id = 2;
  bytes version = 3;
  repeated bytes operation_ids = 4;
}
message ThreadMetadataConflict {
  ThreadPropertyFrontier frontier = 1;
  // Exact original caller-signed metadata operations, not projections or
  // device-synthesized user approval. Each operation binds actor, Spool,
  // Thread, property, causal parents and value.
  repeated SignedRecord candidates = 2;
}

message ThreadQuery {
  repeated SpoolRef spools = 1;
  repeated ThreadLifecycle lifecycle = 2;
  repeated ReviewReadiness readiness = 3;
  string attention_for_principal = 4;
  string participating_principal = 5;
  ThreadRef parent = 6;
  string text = 7;
  enum Order {
    ORDER_UNSPECIFIED = 0;
    ORDER_UPDATED_DESC = 1;
    ORDER_NAME_ASC = 2;
  }
  Order order = 8;
  // Endpoint-local results only. Browser composition reports source coverage.
}

enum ThreadSection {
  THREAD_SECTION_UNSPECIFIED = 0;
  THREAD_SECTION_OVERVIEW = 1;
  THREAD_SECTION_CAPTURES = 2;
  THREAD_SECTION_REVIEW = 3;
  THREAD_SECTION_COLLABORATION = 4;
  THREAD_SECTION_ANALYSIS = 5;
  THREAD_SECTION_CHECKOUTS = 6;
  THREAD_SECTION_TIMELINE = 7;
  THREAD_SECTION_SHARING = 8;
  THREAD_SECTION_EVIDENCE = 9;
  THREAD_SECTION_RESOLVED_ALTERNATIVES = 10;
}

message CaptureSummary {
  RevisionRef revision = 1;
  ThreadRef thread = 2;
  string summary = 3;
  uint64 changed_files = 4;
  // Authenticated account/delegation bindings only. A State does not contain
  // these IDs. Leave them empty if the portable binding proof is unavailable.
  string principal_id = 5;
  string agent_id = 6;
  google.protobuf.Timestamp captured_at = 7;
  // Copied from the producing State when present. State actor labels are
  // claims, not proof that a provider ran a model or a person made a capture.
  string agent_provider = 8;
  string agent_model = 9;
  enum AttributionAssurance {
    ATTRIBUTION_ASSURANCE_UNSPECIFIED = 0;
    ATTRIBUTION_ASSURANCE_CLAIMED = 1;
  }
  // Applies to State labels only. Authenticated IDs have separate provenance.
  AttributionAssurance attribution_assurance = 10;
  string principal_name = 11;
  string principal_email = 12;
  // Exact signed source/capture operation and its account/delegation authority
  // chain, retained in portable replication history. These are public binding
  // proofs, never live bearer credentials. A consumer verifies the
  // operation's exact State/thread binding and the signer-to-principal/agent
  // chain against independent trust pins before using the IDs. The State's
  // name/email and provider/model are never used to derive those IDs.
  bytes raw_signed_capture_operation = 13;
  repeated SignedRecord identity_binding_authority = 14;
  // Exact parents of this capture's State. A merge names every head it
  // combined; these are revisions, not mutable source-head positions.
  repeated RevisionRef parent_revisions = 15;
}

enum ResolutionKind {
  RESOLUTION_KIND_UNSPECIFIED = 0;
  RESOLUTION_KIND_MERGED = 1;
  RESOLUTION_KIND_SUPERSEDED = 2;
  RESOLUTION_KIND_PICKED = 3;
}

// A former source head resolved by a later capture. Producer and resolver
// retain the State's claimed actor labels and their attribution assurance;
// authenticated IDs remain subject to CaptureSummary's proof requirements.
message ResolvedAlternative {
  RevisionRef head = 1;
  CaptureSummary producer = 2;
  // Reviews of this exact former head, including rejections.
  repeated ReviewRecord reviews = 3;
  RevisionRef resolving_revision = 4;
  CaptureSummary resolver = 5;
  ResolutionKind kind = 6;
}

enum SharedFacet {
  SHARED_FACET_UNSPECIFIED = 0;
  SHARED_FACET_SOURCE = 1;
  SHARED_FACET_COLLABORATION = 2;
  SHARED_FACET_EVIDENCE = 3;
  SHARED_FACET_SCRUBBED_TIMELINE = 4;
  SHARED_FACET_METADATA = 5;
  // Raw forensic and confidential runtime disclosure are separate explicit
  // consent contracts; these values cannot sweep them into ordinary sync.
}

message SharingDestination {
  EndpointRef endpoint = 1;
  SpoolRef spool = 2;
  repeated SharedFacet facets = 3;
}

message ThreadSharingPolicy {
  // Sync destinations/material only. Uploading does not change audience.
  ThreadRef thread = 1;
  bytes version = 2;
  repeated SharingDestination destinations = 3;
  bool ongoing = 4;
}

message ThreadInvitee {
  string principal_id = 1;
  // Empty includes this principal's otherwise-authorized delegates; nonempty
  // selects one exact agent attribution. Capability attenuation still applies.
  string agent_id = 2;
}
message ThreadAudiencePolicy {
  ThreadRef thread = 1;
  bytes version = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_OWNER = 1;
    KIND_INVITED = 2;
    KIND_SPOOL = 3;
  }
  // Missing policy defaults to OWNER. The owner is the account verified at
  // original genesis admission, independent of uploader and Spool ownership.
  Kind kind = 3;
  repeated ThreadInvitee invitees = 4;
  // Concurrent candidates intersect audience until explicitly resolved.
}

message MaterialRetention {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_DISCARD = 1;
    MODE_BOUNDED = 2;
    MODE_RETAIN = 3;
  }
  Mode mode = 1;
  // Positive only for BOUNDED; measured from original retention admission.
  // Re-sync/replay never restarts a material's retention deadline.
  uint64 seconds = 2;
}
message ThreadRetentionPolicy {
  ThreadRef thread = 1;
  bytes version = 2;
  MaterialRetention source = 3;
  MaterialRetention collaboration = 4;
  MaterialRetention evidence = 5;
  MaterialRetention scrubbed_timeline = 6;
  // Raw retention requires explicit bounded consent. Runtime secrets are not
  // ordinary Thread material and cannot be enabled by this policy.
  MaterialRetention raw_transcripts = 7;
}

// Exact comparison resolved within a review-section snapshot. A client submits
// these source/base/policy bytes when recording a decision; a Thread's genesis
// base and an arbitrary source head are not substitutes for this binding.
message ReviewComparison {
  RevisionRef source = 1;
  RevisionRef base = 2;
  bytes policy_version = 3;
}

message ReviewDecision {
  RecordRef ref = 1;
  ThreadRef thread = 2;
  RevisionRef source = 3;
  RevisionRef target = 4;
  bytes policy_version = 5;
  string principal_id = 6;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_OPINION = 1;
    KIND_APPROVAL = 2;
    KIND_REJECTION = 3;
    KIND_REVOCATION = 4;
    // Attestations describe what was read; none satisfies an approval policy.
    KIND_READ = 5;
    KIND_AGENT_PREVIEW = 6;
    KIND_AGENT_CO_REVIEW = 7;
  }
  Kind kind = 7;
  string explanation = 8;
  RecordRef revokes = 9;
  google.protobuf.Timestamp expires_at = 10;
  string agent_id = 11;
  // Required for read attestations and absent for other decisions.
  ReviewCoverage coverage = 12;
}

message ReviewCoverage {
  // Exactly one arm. A symbol selection is bounded and tied to source.
  oneof selection {
    bool whole_source = 1;
    ReviewSymbols symbols = 2;
  }
}

message ReviewSymbols {
  repeated ReviewSymbolAnchor anchors = 1;
}

message ReviewSymbolAnchor {
  string path = 1;
  string symbol = 2;
}

// The observed decision and the exact portable signed control that authored it.
message ReviewRecord {
  ReviewDecision decision = 1;
  SignedRecord original = 2;
}

message ObserveThreadsRequest {
  ThreadQuery query = 1;
  PageRequest page = 2;
  ObserveOptions observe = 3;
}

message ThreadListEvent {
  StreamFrame frame = 1;
  oneof payload {
    ThreadOverview thread = 2;
    Removal removal = 3;
  }
}

message StartThreadRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  // The same original creator-signed record as ReplicationOpen.thread_genesis.
  // Its negotiated canonical format owns parent, base, name, initial intent,
  // creator and creation nonce. The endpoint validates its signature, derives
  // the Thread ID and verifies the spool binding; it never synthesizes a creator.
  // Retrying the record preserves identity even with a new RPC operation ID.
  SignedRecord thread_genesis = 3;
  // Original portable account/key authority, independently verified against the
  // creator and owner bound by the canonical genesis. Never the courier's proof.
  bytes creator_authority = 4;
}

// The owner and accepting account publisher co-sign one exact canonical claim.
// Upload and device enrollment never invoke this transition implicitly.
message ClaimThreadOwnershipRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  // heddle-thread-ownership-claim-v1; one acceptor signature requests local
  // co-signing, or two signatures ordered local-owner, acceptor import full proof.
  SignedRecord claim = 3;
}
message ClaimThreadOwnershipResponse {
  MutationReceipt receipt = 1;
  ThreadRef thread = 2;
  PrincipalRef owner = 3;
  bytes claim_id = 4;
  SignedRecord claim = 5;
}

// The original local owner chooses the winning account; that account's currently
// authorized owner or delegate accepts. Neither arrival order nor a claimant's
// signature alone adjudicates the conflict. Never implicit in upload/enrollment.
message ResolveOwnershipConflictRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  // heddle-thread-ownership-resolution-v1; canonical ThreadOwnershipResolution
  // binds the exact conflict set and observed source frontier, original local
  // owner key, winning account and its fresh acceptance authority. Exactly two
  // signatures, in order: local owner, accepting publisher. Each signature's
  // public key must equal its corresponding canonical role key. Retain the
  // signed resolution and all claims as replicated history; do not delete losers.
  SignedRecord resolution = 3;
}

message ThreadMutationResponse {
  MutationReceipt receipt = 1;
  ThreadOverview thread = 2;
}

message ReviseIntentRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  bytes expected_intent_version = 3;
  ThreadIntent proposed_intent = 4;
  // Original caller-signed native Thread metadata operation. The endpoint
  // verifies exact request/value/actor/scope/parent binding before admission.
  SignedRecord operation = 5;
  // Agent attribution cannot set principal_approved; endpoint authority decides.
}

message SetThreadSharingRequest {
  string client_operation_id = 1;
  ThreadSharingPolicy policy = 2;
  bytes expected_policy_version = 3;
  SignedRecord operation = 4;
}

message SetThreadAudienceRequest {
  string client_operation_id = 1;
  ThreadAudiencePolicy policy = 2;
  bytes expected_policy_version = 3;
  SignedRecord operation = 4;
}
message SetThreadRetentionRequest {
  string client_operation_id = 1;
  ThreadRetentionPolicy policy = 2;
  bytes expected_policy_version = 3;
  SignedRecord operation = 4;
}

message RecordReviewRequest {
  string client_operation_id = 1;
  ReviewDecision decision = 2;
  repeated ExpectedVersion expected_versions = 3;
  SignedRecord operation = 4;
}

message LandThreadRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  RevisionRef source = 3;
  ThreadRef target = 4;
  RevisionRef expected_target = 5;
  bytes expected_policy_version = 6;
  // Weft owns hosted landing; no checkout or online device is required.
}

message ChangeThreadLifecycleRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  bytes expected_version = 3;
  ThreadLifecycle lifecycle = 4;
  SignedRecord operation = 5;
  // READY revalidates requirements. LANDED is rejected here; use LandThread.
}

message RenameThreadRequest {
  string client_operation_id = 1;
  ThreadRef thread = 2;
  bytes expected_version = 3;
  string name = 4;
  SignedRecord operation = 5;
}
// Each source is the exact revision supplied by the caller. For every distinct
// target, expected_target is compared once against the initial transaction
// snapshot. Ordered members then integrate into that target's evolving frontier.
message StackLanding {
  ThreadRef thread = 1;
  RevisionRef source = 2;
  ThreadRef target = 3;
  RevisionRef expected_target = 4;
  bytes expected_policy_version = 5;
}
message LandStackRequest {
  string client_operation_id = 1;
  SpoolRef spool = 2;
  // Apply in request order. Source and target Thread sets must be disjoint; a
  // source never implicitly means the result of an earlier member. All members
  // and their receipts commit atomically, or none do.
  repeated StackLanding landings = 3;
}
