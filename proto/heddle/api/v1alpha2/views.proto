syntax = "proto3";

package heddle.api.v1alpha2;

import "google/protobuf/timestamp.proto";
import "heddle/api/common/repository.proto";
import "heddle/api/v1alpha2/activity.proto";
import "heddle/api/v1alpha2/administration.proto";
import "heddle/api/v1alpha2/analysis.proto";
import "heddle/api/v1alpha2/billing.proto";
import "heddle/api/v1alpha2/collaboration.proto";
import "heddle/api/v1alpha2/common.proto";
import "heddle/api/v1alpha2/device.proto";
import "heddle/api/v1alpha2/identity.proto";
import "heddle/api/v1alpha2/owner_records.proto";
import "heddle/api/v1alpha2/owner_views.proto";
import "heddle/api/v1alpha2/stream.proto";
import "heddle/api/v1alpha2/sync.proto";
import "heddle/api/v1alpha2/thread.proto";

// Independent section windows share one observation's total read budget.
// Missing windows select bounded defaults only for requested sections.
message ThreadPages {
  PageRequest captures = 1;
  PageRequest reviews = 2;
  PageRequest collaboration = 3;
  // Requires THREAD_SECTION_TIMELINE. At most 64 events; visible run frames
  // and all selected-section controls also consume the shared ReadBudget.
  // Continuation is sealed to this exact caller, Thread, sections and budget.
  PageRequest timeline = 4;
  // Current exact-revision checks and acknowledgements for the current policy.
  // This independent mixed window has its own opaque cursor and evidence status.
  PageRequest evidence = 5;
  // Former heads resolved by later captures; independent of capture history.
  PageRequest resolved_alternatives = 6;
}
message ObserveThreadRequest {
  ThreadRef thread = 1;
  repeated ThreadSection sections = 2;
  // Optional exact compared revisions; omitting them resolves once in the
  // snapshot and returns the exact pair in the review comparison payload.
  // Source also selects the revision for ViewedThread collaboration targets.
  RevisionRef source = 3;
  RevisionRef base = 4;
  ThreadPages pages = 5;
  ObserveOptions observe = 6;
  // Original portable operations for requested causal sections. Editors and
  // replica clients can prepare the next signed command from this same view.
  bool include_operations = 7;
  // Readiness is meaningful only against an explicitly selected target Thread.
  // A missing target leaves ThreadOverview.readiness UNKNOWN.
  ThreadRef landing_target = 8;
}

// One typed stream composes a Thread's decision context. Common frame controls
// have no payload. Every data frame carries exactly one payload; snapshots and
// delta batches become visible only at their checkpoint.
// SectionReplacement.section and SectionStatus.section use these exact keys:
// overview (overview); captures (capture); review (comparison, review, diff); evidence (evidence, check_acknowledgement);
// resolved_alternatives (resolved_alternative);
// collaboration (discussion, turn, context, source_target); analysis (analysis); checkouts
// (checkout); timeline (timeline_event, run, operation); sharing (sharing,
// publication). Replacement clears only that section's committed collection.
// V1 timeline "operation" is explicitly empty. Timeline always reports a
// section status, including an eligible empty collection. Timeline run/event
// frames reuse RunRecord/TimelineRecord output, ordered by server change
// sequence; recorded_at is display time only. Removal uses Removal. A lost
// timeline membership proof or change-log continuity ends with Reset then FIN.
// Resource-reader and Thread/Spool audience rights are ceilings. A run/event
// is visible only to its verified direct-human principal account or a live
// same-principal agent whose final effective PoP key digest exactly equals
// the run's frozen actor digest. Agent labels, Thread/Spool owner and admin
// roles never override that predicate. Join current sharing epoch, audience,
// billing/deletion gates and the payload deadline before order, limit or count.
// Forbidden and absent run IDs, pages and cursors have identical status,
// count, cursor and Reset shapes. No hidden append advances a visible cursor.
// Every eligibility-bearing frame gets a fresh current database authorization
// check immediately before handoff; expiry wakes idle followers without a sweep.
// Unknown section semantics require a fresh supported view, never silent loss.
message ThreadEvent {
  StreamFrame frame = 1;
  oneof payload {
    ThreadOverview overview = 2;
    CaptureSummary capture = 3;
    DiscussionRecord discussion = 4;
    DiscussionTurn turn = 5;
    ContextRecord context = 6;
    ReviewRecord review = 7;
    CheckoutOverview checkout = 8;
    AnalysisRecord analysis = 9;
    ThreadSharingPolicy sharing = 10;
    SectionStatus status = 11;
    Removal removal = 12;
    heddle.api.common.FileDiff diff = 13;
    EvidenceRecord evidence = 14;
    OperationRecord operation = 15;
    RunRecord run = 16;
    TimelineRecord timeline_event = 17;
    PublicationReceipt publication = 18;
    SectionReplacement replace_section = 19;
    SignedRecord signed_operation = 20;
    ReviewComparison comparison = 21;
    CheckAcknowledgementRecord check_acknowledgement = 22;
    SourceTargetResolutionEvent source_target = 23;
    ResolvedAlternative resolved_alternative = 24;
  }
}

message SpoolOverview {
  SpoolRef ref = 1;
  // Actual immediate parent, always set on emitted nested overviews. If the
  // parent identity is unreadable, withhold the whole overview without a
  // placeholder or distinct reason; never substitute a visible outer ancestor.
  SpoolRef parent = 2;
  string name = 3;
  bytes version = 4;
  Audience audience = 5;
  // Caller-filtered projection, never a complete replacement record. Both
  // default_thread and default_review_policy omit deleted/unreadable targets.
  SpoolSettings settings = 6;
  repeated ActionAvailability actions = 7;
  repeated SectionStatus sections = 8;
  string slug = 9;
  SignedSpoolOwnerGenesis owner_genesis = 10;
  // Caller-private preference composed by an exact Spool page. Missing means
  // unavailable, unrequested, or anonymous (including ordinary list rows).
  // Present false + empty version proves absence; false + nonempty version is
  // a retained tombstone. This never changes the Spool resource version.
  BookmarkRecord current_bookmark = 11;
  // Current canonical address; clients need not fetch ancestors to display or
  // select this Spool. UUIDs remain the identity for mutations and references.
  repeated string path_segments = 12;
  // Signed-policy CAS head. Member-gated like owner_genesis: not public on
  // public spools. Unset = no tip yet, OR the caller is not a member.
  // Construction hint only; not authority. Weft MUST serve the complete chain
  // on SPOOL_SECTION_SIGNED_POLICY (a page is not a license to omit
  // predecessors of the tip).
  SignedPolicyHead signed_policy_head = 13;
  // Hint of the current spool owner's OwnerState.version. A client MUST NOT
  // copy this into a SignedPolicyBody without independently verifying it
  // equals the OwnerState.version pinned via verify_current_owner.
  bytes signed_policy_owner_state_hash = 14;
  uint64 signed_policy_ownership_transfer_sequence = 15;
  // Public catalog label only. Present only when this row is publicly visible;
  // contains already-public identity, never owner_genesis or a private account.
  PublicOwner public_owner = 16;
  // Most recent public activity on this Spool. Absent when none is known.
  // Private or member-only activity MUST NOT affect this timestamp.
  google.protobuf.Timestamp last_activity_at = 17;
  // Catalog counts only. Absent when unavailable; see CatalogActivitySummary.
  CatalogActivitySummary catalog_activity = 18;
  // Current readable ancestry, root -> parent, excluding self. Omit unreadable
  // entries entirely, with no placeholders, hidden segments/counts or reasons.
  // Each address must have a readable ID and independently disclosable path.
  // This visible subsequence does not assert adjacency or a physical root.
  repeated SpoolAddress ancestors = 19;
}

// Counts of public activity on one catalog Spool. A server deriving these from
// rollups may serve eventually consistent values; they are display hints, not
// authorization or a transactional snapshot of underlying Threads/changes.
message CatalogActivitySummary {
  // Public Threads in DRAFT, ACTIVE or READY, excluding LANDED, ABANDONED
  // and unknown lifecycle values. Each Thread is counted once.
  uint64 open_thread_count = 1;
  // Distinct successful public LandingRecords executed in (as_of - 30 days,
  // as_of], deduplicated by signed operation digest; failed/retried attempts
  // do not add counts. See docs/alpha-v2/catalog.md for snapshot semantics.
  uint64 landed_30d = 2;
}

// Committed overview and independently verifiable owner history seed the
// caller's view directly. The receipt is not a trust root or a TOFU pin.
message SpoolMutationResponse {
  MutationReceipt receipt = 1;
  SpoolOverview spool = 2;
  // Creation returns the root and accepted transitions proving its current
  // signing key. The caller constructs its own local pin after verification.
  OwnerState ownership = 3;
}

enum SpoolSection {
  SPOOL_SECTION_UNSPECIFIED = 0;
  SPOOL_SECTION_OVERVIEW = 1;
  SPOOL_SECTION_THREADS = 2;
  SPOOL_SECTION_MEMBERS = 3;
  SPOOL_SECTION_INVITATIONS = 4;
  SPOOL_SECTION_GRANTS = 5;
  SPOOL_SECTION_POLICIES = 6;
  SPOOL_SECTION_CONTEXT = 7;
  SPOOL_SECTION_OPERATIONS = 8;
  SPOOL_SECTION_CHILDREN = 9;
  SPOOL_SECTION_SUPPORT_ACCESS = 10;
  // Complete signed-policy chain, sequence order. Member-gated like
  // owner_genesis; not public on public spools. Replaces v1
  // GetOwnerGovernanceHead without a new RPC.
  SPOOL_SECTION_SIGNED_POLICY = 11;
}

message SpoolPages {
  PageRequest threads = 1;
  PageRequest members = 2;
  PageRequest invitations = 3;
  PageRequest grants = 4;
  PageRequest policies = 5;
  PageRequest approval_groups = 6;
  PageRequest context = 7;
  PageRequest operations = 8;
  PageRequest children = 9;
  PageRequest support_access = 10;
}
message ObserveSpoolRequest {
  SpoolRef spool = 1;
  repeated SpoolSection sections = 2;
  ThreadQuery threads = 3;
  SpoolPages pages = 4;
  ObserveOptions observe = 5;
  // Each requested administration section is independently authorized and
  // paginated. SectionStatus distinguishes not requested from unavailable.
  // SPOOL_SECTION_SIGNED_POLICY is member-gated (not public on public spools)
  // and MUST return the complete chain in sequence order.
}

message SpoolEvent {
  StreamFrame frame = 1;
  oneof payload {
    SpoolOverview spool = 2;
    ThreadOverview thread = 3;
    MemberRecord member = 4;
    InvitationRecord invitation = 5;
    GrantRecord grant = 6;
    ReviewPolicyRecord policy = 7;
    ApprovalGroupView approval_group = 8;
    ContextRecord context = 9;
    OperationRecord operation = 10;
    SectionStatus status = 11;
    Removal removal = 12;
    SectionReplacement replace_section = 13;
    SpoolMount mount = 14;
    SupportAccessRecord support_access = 15;
    // Paged child summary, separate from the observed root spool.
    SpoolOverview child = 16;
    SourceTargetResolutionEvent source_target = 17;
    // One signed-policy record. The signed-policy section lists them in
    // sequence order (complete chain). Member-gated.
    SignedSpoolPolicyRecord signed_policy = 18;
  }
}

message WorkspacePages {
  PageRequest spools = 1;
  PageRequest threads = 2;
  PageRequest attention = 3;
  PageRequest operations = 4;
  PageRequest devices = 5;
  PageRequest bookmarks = 6;
}
message ObserveWorkspaceRequest {
  ThreadQuery threads = 1;
  WorkspacePages pages = 2;
  ObserveOptions observe = 3;
  bool include_attention = 4;
  bool include_operations = 5;
  bool include_devices = 6;
  bool include_bookmarks = 7;
}

message WorkspaceEvent {
  StreamFrame frame = 1;
  oneof payload {
    SpoolOverview spool = 2;
    ThreadOverview thread = 3;
    AttentionItem attention = 4;
    OperationRecord operation = 5;
    EndpointRef device = 6;
    SectionStatus status = 7;
    Removal removal = 8;
    SectionReplacement replace_section = 9;
    BookmarkRecord bookmark = 10;
  }
}

message ObserveAttentionRequest {
  repeated SpoolRef spools = 1;
  string principal_id = 2;
  PageRequest page = 3;
  ObserveOptions observe = 4;
}

message AttentionEvent {
  StreamFrame frame = 1;
  oneof payload {
    AttentionItem item = 2;
    Removal removal = 3;
  }
}

message ObserveNotificationsRequest {
  bool unread_only = 1;
  // Includes stored settings, bounded effective delivery and next email digest
  // windows together in NotificationEvent.preferences, with live updates.
  bool include_preferences = 4;
  // Optional per-Spool effective read. Requires include_preferences and current
  // read access to this Spool; otherwise reject, never fall back to account.
  // Returns its complete effective matrix ONLY (no other Spool/account cells).
  // Stored settings remain the ordinary redacted settings; the 4096-cell/1-MiB
  // preferences bound still applies. Bind this filter into stream cursors and
  // reauthorize/redact on every update. Absent projects account cells plus
  // readable scopes with local routing rules, never rule-free descendants.
  SpoolRef effective_delivery_spool = 5;
  PageRequest page = 2;
  ObserveOptions observe = 3;
}

message NotificationEvent {
  StreamFrame frame = 1;
  oneof payload {
    NotificationRecord notification = 2;
    NotificationPreferences preferences = 4;
    SectionStatus status = 5;
    Removal removal = 3;
  }
}

message ObserveIdentityRequest {
  // The principal is always included. Message presence requests a collection;
  // an empty PageRequest selects its bounded first page. Each collection has
  // its own SectionStatus.page; no global page token selects a hidden section.
  PageRequest devices = 1;
  PageRequest sessions = 2;
  PageRequest signup_invitations = 3;
  PageRequest delegations = 4;
  PageRequest recovery = 5;
  ObserveOptions observe = 6;
  // The shared read budget covers all requested sections together. A session
  // reference/version from this view can be used directly for RevokeSession.
  bool include_current_credential = 7;
  bool include_billing = 8;
  PageRequest passkeys = 9;
  // Applies only to the requested sessions page. UNSPECIFIED preserves ALL;
  // settings clients should explicitly select ACTIVE. Bind page/checkpoint
  // cursors to this filter and filter before page counts and byte budgets.
  // Does not filter CurrentCredentialRecord.session, which describes this
  // exact credential independently of pagination. Unknown values are invalid.
  SessionStateFilter session_state = 10;
  // Optional scalar sections use the same total budget and their own status.
}

message IdentityEvent {
  StreamFrame frame = 1;
  oneof payload {
    PrincipalRecord identity = 2;
    SectionStatus status = 3;
    SessionRecord session = 4;
    SignupInvitation signup_invitation = 5;
    DeviceIdentity device = 6;
    Removal removal = 7;
    SectionReplacement replace_section = 8;
    DelegationRecord delegation = 9;
    RecoveryAttempt recovery = 10;
    InvitationQuota invitation_quota = 11;
    CurrentCredentialRecord current_credential = 12;
    BillingRecord billing = 13;
    PasskeyRecord passkey = 14;
  }
}

message DeviceIdentity {
  EndpointRef endpoint = 1;
  bytes signing_public_key = 2;
  string label = 3;
  bool revoked = 4;
  // Root attachment verification is independent of Weft account association.
  bytes root_attachment_hash = 5;
  // Original account-owned registry identity and durable authorization version
  // for RevokeDevice. Endpoint/key bytes are locators, never substitutes for it.
  RecordRef ref = 6;
  bytes version = 7;
  // When Weft last observed an authenticated call from this device, not
  // machine-reported presence. Absent means unknown. Never present for revoked
  // devices; populated only in owner-scoped views.
  google.protobuf.Timestamp last_seen_at = 8;
  // Whether last_seen_at falls within the server's policy-defined online
  // window. Absent means unknown, not offline. Never present for revoked
  // devices; populated only in owner-scoped views.
  optional bool online = 9;
}

message ObserveOperationsRequest {
  repeated SpoolRef spools = 1;
  repeated RecordRef operations = 2;
  // Recover ambiguous outcomes without submitting a second mutation. Search is
  // confined to the authenticated caller's declared operation-ID namespace.
  repeated string client_operation_ids = 3;
  PageRequest page = 4;
  ObserveOptions observe = 5;
}

message OperationEvent {
  StreamFrame frame = 1;
  oneof payload {
    OperationRecord operation = 2;
    Removal removal = 3;
  }
}

message CancelOperationRequest {
  string client_operation_id = 1;
  RecordRef operation = 2;
  bytes expected_version = 3;
  // Request acknowledgement is not proof of cancellation or rollback.
}

// Public resource discovery never includes private grants, devices or account
// attention. Exact public content still uses the ordinary resource read APIs.
enum CatalogSort {
  // Legacy order: ascending slug, then Spool UUID ascending. Old callers
  // retain their existing order; select PATH for the full canonical address.
  CATALOG_SORT_UNSPECIFIED = 0;
  // Ascending case-normalized public name, then Spool UUID ascending.
  CATALOG_SORT_NAME = 1;
  // Ascending case-normalized full canonical path, then Spool UUID ascending.
  CATALOG_SORT_PATH = 2;
  // Descending last_activity_at (unknown last), then Spool UUID ascending.
  CATALOG_SORT_RECENT_ACTIVITY = 3;
}

// All predicates are ANDed with query over caller-visible public catalog rows.
// Absent or empty means no filtering. See docs/alpha-v2/catalog.md.
message CatalogFilter {
  // At least one public Thread in DRAFT, ACTIVE or READY.
  bool has_open_threads = 1;
  // At least one successful public landing in the trailing 30 * 86400 seconds.
  bool landed_within_30d = 2;
  // SpoolSettings.require_review_to_land is true; not a review backlog.
  bool require_review_to_land = 3;
  // Literal leading canonical path_segments, matched case-insensitively by
  // whole segment. Empty means any address; empty/invalid segments are invalid.
  repeated string namespace_prefix = 4;
}

message ObserveCatalogRequest {
  // Bounded case-insensitive literal search over public names, slugs,
  // descriptions, joined canonical addresses, path segments and owner handles.
  string query = 1;
  // PageInfo.next_page is an opaque token bound to query, filter, sort, caller and
  // catalog generation. It contains the last row's sort key and Spool UUID;
  // servers compare that pair strictly after the row using the order above.
  // For RECENT_ACTIVITY, a null timestamp follows all known timestamps and
  // UUID breaks ties, including among nulls. A changed sort key or visibility
  // must advance the generation; stale tokens are rejected for a fresh page.
  PageRequest spools = 2;
  ObserveOptions observe = 3;
  // Unknown values are invalid. UNSPECIFIED retains the legacy slug order.
  CatalogSort sort = 4;
  // PageInfo.matching_count, exhausted and next_page respect this filter.
  // A token reused with a different normalized filter/query is rejected.
  CatalogFilter filter = 5;
}

// Linkable public leader even when its row is outside the requested page.
// Only already-public labels; never private ancestry or owner identity.
message CatalogLeader {
  SpoolRef ref = 1;
  string name = 2;
  repeated string path_segments = 3;
  // Corresponding open_thread_count or landed_30d, depending on the list.
  uint64 count = 4;
}

// One snapshot per catalog snapshot, independent of page size or sort. No live
// refresh. Same query/filter and caller-visible public rows as catalog paging.
// Private Spools/activity MUST NOT affect counts, leaders, approximation or
// other observable summary metadata. See docs/alpha-v2/catalog.md.
message CatalogSummary {
  uint64 spool_count = 1;
  uint64 open_thread_count = 2;
  uint64 landed_30d = 3;
  // Number of matching Spools with public activity in (as_of - 7 days, as_of].
  uint64 active_7d = 4;
  // At most 5 positive-count leaders each, count descending then UUID ascending.
  repeated CatalogLeader most_open = 5;
  repeated CatalogLeader most_landed = 6;
  // Required snapshot boundary; rollups may lag at most 300 seconds.
  google.protobuf.Timestamp as_of = 7;
  // Above 10,000 visible matches, the server may aggregate only the first
  // 10,000 by UUID. Activity totals then are unscaled lower bounds and leaders
  // are sample leaders. spool_count stays exact. Never sample hidden rows.
  bool approximate = 8;
}
message CatalogEvent {
  StreamFrame frame = 1;
  oneof payload {
    SpoolOverview spool = 2;
    SectionStatus status = 3;
    Removal removal = 4;
    SectionReplacement replace_section = 5;
    CatalogSummary summary = 6;
  }
}
