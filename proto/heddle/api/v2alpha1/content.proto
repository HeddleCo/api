syntax = "proto3";

package heddle.api.v2alpha1;

import "heddle/api/v1alpha1/repo_sync.proto";
import "heddle/api/v1alpha1/repository.proto";
import "heddle/api/v2alpha1/common.proto";
import "heddle/api/v2alpha1/stream.proto";

message TreeRead {
  string path = 1;
  uint32 depth = 2;
  PageRequest page = 3;
}

message BlobRead {
  string path = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message DiffRead {
  RevisionRef base = 1;
  repeated string paths = 2;
  PageRequest page = 3;
}

message ProvenanceRead {
  string path = 1;
  uint32 start_line = 2;
  uint32 line_count = 3;
}

message ContentRead {
  string selection_id = 1;
  oneof selection {
    TreeRead tree = 2;
    BlobRead blob = 3;
    DiffRead diff = 4;
    ProvenanceRead provenance = 5;
    StateRead state = 6;
  }
}

message StateRead {
  bool include_summary = 1;
  bool include_attachments = 2;
  repeated heddle.api.v1alpha1.StateAttachmentKind attachment_kinds = 3;
  PageRequest page = 4;
  // Attachments are independently authorized; an empty kind filter does not
  // confer permission to see private material. Conflicts retain resolved items.
}

message ReadContentRequest {
  RevisionRef revision = 1;
  repeated ContentRead selections = 2;
  ReadBudget budget = 3;
  // Finite exact-revision read. Resume ranges/pages explicitly; no live follow.
}

message BlobChunk {
  uint64 offset = 1;
  bytes data = 2;
  uint64 total_size = 3;
  bytes object_hash = 4;
  bool range_complete = 5;
}

message ContentEvent {
  string selection_id = 1;
  RevisionRef revision = 2;
  oneof payload {
    heddle.api.v1alpha1.TreeEntry tree_entry = 3;
    BlobChunk blob = 4;
    heddle.api.v1alpha1.FileDiff diff = 5;
    heddle.api.v1alpha1.GetBlameResponse provenance = 6;
    SectionStatus selection_complete = 7;
    heddle.api.v1alpha1.StateSummary state = 8;
    heddle.api.v1alpha1.StateAttachment attachment = 9;
  }
  // Each requested selection ends with selection_complete. Missing completion
  // before FIN means interruption, not an empty file or exhausted collection.
}

message ReadArtifactRequest {
  RecordRef artifact = 1;
  uint64 offset = 2;
  uint64 length = 3;
  ReadBudget budget = 4;
  // A retained raw artifact requires its own disclosure authorization. This
  // does not export runtime secret values from the execution broker.
}

message ArtifactEvent {
  RecordRef artifact = 1;
  oneof payload {
    BlobChunk chunk = 2;
    SectionStatus complete = 3;
  }
}

message SearchRequest {
  repeated SpoolRef spools = 1;
  string text = 2;
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_LEXICAL = 1;
    MODE_SEMANTIC = 2;
    MODE_COMBINED = 3;
  }
  Mode mode = 3;
  PageRequest page = 4;
  ReadBudget budget = 5;
}

message SearchHit {
  EntityRef subject = 1;
  string summary = 2;
  string path = 3;
  optional uint32 line = 4;
  double score = 5;
}

message SearchEvent {
  EndpointRef source = 1;
  oneof payload {
    SearchHit hit = 2;
    SectionStatus complete = 3;
  }
}
