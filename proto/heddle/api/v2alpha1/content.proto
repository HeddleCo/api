syntax = "proto3";

package heddle.api.v2alpha1;

import "google/protobuf/timestamp.proto";
import "heddle/api/v1alpha1/repo_sync.proto";
import "heddle/api/v1alpha1/repository.proto";
import "heddle/api/v1alpha1/types.proto";
import "heddle/api/v2alpha1/common.proto";
import "heddle/api/v2alpha1/stream.proto";

message TreeRead {
  // Empty selects the root; otherwise a normalized repository-relative path.
  string path = 1;
  // Zero selects one level. Endpoints advertise bounded read budgets and reject
  // a depth they cannot support; zero never requests an unbounded walk.
  uint32 depth = 2;
  // The token is bound to the exact revision, subtree and depth. A complete
  // page may still have next_page; exhausted alone means the query has no more.
  PageRequest page = 3;
}

message ContentFile {
  // Exact native blob hash, 32 bytes. A symlink's blob stores its target path;
  // browsing a tree never follows the link.
  bytes object_hash = 1;
  // Absent means unknown, distinct from a known empty file.
  optional uint64 size = 2;
  // Applies to file targets; false for symlinks.
  bool executable = 3;
}

message ContentSpoolLink {
  // Exact namespace/name identity embedded in the native source tree. This is
  // not a hosted SpoolRef UUID or an authorization grant. ResolveResources can
  // resolve it to a hosted resource when the caller wants to follow the edge.
  string native_spool_id = 1;
  heddle.api.v1alpha1.StateId state = 2;
}

message ContentTreeEntry {
  // Repository-root-relative path, including the requested subtree prefix.
  string path = 1;
  oneof target {
    bytes tree_hash = 2;
    ContentFile file = 3;
    ContentFile symlink = 4;
    heddle.api.v1alpha1.GitObjectId gitlink = 5;
    ContentSpoolLink spoollink = 6;
  }
  // Present only when the corresponding provenance has been published and
  // authorized. Absence does not mean that the source has no history.
  google.protobuf.Timestamp last_changed_at = 7;
  heddle.api.v1alpha1.StatePrincipal last_changed_by = 8;
}

message BlobRead {
  oneof source {
    string path = 1;
    // Exact native blob content hash, 32 bytes. The endpoint MUST prove the
    // object is reachable from ReadContentRequest.revision and authorize that
    // revision before serving it. Possessing a hash confers no authority.
    // This permits Heddle's lazy object hydration without resolving a path or
    // downloading a revision pack merely to retrieve one missing blob.
    bytes object_hash = 4;
  }
  uint64 offset = 2;
  uint64 length = 3;
}

message DiffRead {
  RevisionRef base = 1;
  repeated string paths = 2;
  PageRequest page = 3;
}

message ProvenanceRead {
  string path = 1;
  uint32 start_line = 2;
  uint32 line_count = 3;
}

message ContentRead {
  string selection_id = 1;
  oneof selection {
    TreeRead tree = 2;
    BlobRead blob = 3;
    DiffRead diff = 4;
    ProvenanceRead provenance = 5;
    StateRead state = 6;
  }
}

// Immutable source-derived attachments only. Authored context, discussion,
// review, evidence, and run data are selected through their Thread services.
enum SourceAttachmentKind {
  SOURCE_ATTACHMENT_KIND_UNSPECIFIED = 0;
  SOURCE_ATTACHMENT_KIND_RISK_SIGNALS = 1;
  SOURCE_ATTACHMENT_KIND_STRUCTURED_CONFLICTS = 2;
  SOURCE_ATTACHMENT_KIND_SEMANTIC_INDEX = 3;
}

message StateRead {
  bool include_summary = 1;
  bool include_attachments = 2;
  repeated SourceAttachmentKind attachment_kinds = 3;
  PageRequest page = 4;
  // At least one of include_summary/include_attachments must be true. A kind
  // filter or attachment page requires include_attachments. Empty kind filter
  // requests all known kinds in enum order; each requested kind receives one
  // StateAttachmentContent, including unavailable kinds. Page size counts kinds.
  // Page tokens bind the exact revision, kind set, and authorized attachment-head
  // snapshot; changed heads require restarting the selection. The summary, when
  // requested, is emitted on each page and does not consume a kind's page slot.
  // Attachments are independently authorized. Selection completion is PARTIAL
  // when any kind on the page is unavailable; it never upgrades unavailable
  // attachment data to COMPLETE. Conflicts retain resolved items.
}

// One requested attachment kind at the selected immutable revision. A kind
// without available publication evidence is reported as UNAVAILABLE without an
// attachment_id or body; absence and withheld private material are indistinguishable.
// COMPLETE always carries the exact 32-byte native attachment identity and body.
message StateAttachmentContent {
  SourceAttachmentKind kind = 1;
  Coverage coverage = 2;
  bytes attachment_id = 3;
  oneof body {
    // Includes both open and resolved conflict records.
    heddle.api.v1alpha1.StructuredConflicts structured_conflicts = 4;
    // Native encoded StateAttachment record for other kinds. Whole-record
    // authorization precedes disclosure; private closure pointers are not public.
    bytes raw_object = 5;
  }
}

message ReadContentRequest {
  RevisionRef revision = 1;
  repeated ContentRead selections = 2;
  ReadBudget budget = 3;
  // Finite exact-revision read. Resume ranges/pages explicitly; no live follow.
}

message BlobChunk {
  uint64 offset = 1;
  bytes data = 2;
  uint64 total_size = 3;
  bytes object_hash = 4;
  bool range_complete = 5;
}

message ContentEvent {
  string selection_id = 1;
  RevisionRef revision = 2;
  oneof payload {
    ContentTreeEntry tree_entry = 3;
    BlobChunk blob = 4;
    heddle.api.v1alpha1.FileDiff diff = 5;
    ProvenanceResult provenance = 6;
    SectionStatus selection_complete = 7;
    heddle.api.v1alpha1.StateSummary state = 8;
    StateAttachmentContent attachment = 9;
  }
  // Each requested selection ends with selection_complete. Missing completion
  // before FIN means interruption, not an empty file or exhausted collection.
}

message ReadArtifactRequest {
  RecordRef artifact = 1;
  uint64 offset = 2;
  uint64 length = 3;
  ReadBudget budget = 4;
  // A retained raw artifact requires its own disclosure authorization. This
  // does not export runtime secret values from the execution broker.
}

message ArtifactEvent {
  RecordRef artifact = 1;
  oneof payload {
    BlobChunk chunk = 2;
    SectionStatus complete = 3;
  }
}

message SearchRequest {
  repeated SpoolRef spools = 1;
  string text = 2;
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_LEXICAL = 1;
    MODE_SEMANTIC = 2;
    MODE_COMBINED = 3;
  }
  Mode mode = 3;
  PageRequest page = 4;
  ReadBudget budget = 5;
}

message SearchHit {
  EntityRef subject = 1;
  string summary = 2;
  string path = 3;
  optional uint32 line = 4;
  double score = 5;
}

message SearchEvent {
  EndpointRef source = 1;
  oneof payload {
    SearchHit hit = 2;
    SectionStatus complete = 3;
  }
}

message ProvenanceResult {
  string path = 1;
  RevisionRef revision = 2;
  Coverage coverage = 3;
  repeated heddle.api.v1alpha1.BlameLine lines = 4;
  heddle.api.v1alpha1.BlameSummary summary = 5;
}
