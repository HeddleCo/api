syntax = "proto3";
package heddle.api.v2alpha1;

import "google/protobuf/timestamp.proto";
import "heddle/api/v2alpha1/common.proto";
import "heddle/api/v2alpha1/owner_records.proto";
import "heddle/api/v2alpha1/stream.proto";

// User-root proof is portable. Account association records Weft's acceptance of
// an already user-authorized key; it is not the source of that key's authority.
message RootAttachment {
  bytes root_public_key = 1;
  bytes subject_public_key = 2;
  EndpointRef device = 3;
  SignedRecord attachment = 4;
  // Verification binds root, subject, device, scope, validity and possession.
  // An empty attachment is valid only for a directly proved root key.
}
// Account onboarding state, never a substitute for a verified capability or
// owner-root binding. Promotions are explicit; a credential's attenuation must
// survive promotion of its account. AGENT_ROOTED denotes an unclaimed human
// account with an empty independent-root slot, not an account owned by an agent.
enum RootingTier {
  ROOTING_TIER_UNSPECIFIED = 0;
  ROOTING_TIER_SELF_ROOTED = 1;
  ROOTING_TIER_SERVER_ROOTED = 2;
  ROOTING_TIER_AGENT_ROOTED = 3;
}
message PrincipalRecord {
  string id = 1;
  string handle = 2;
  bytes version = 3;
  bytes root_public_key = 4;
  repeated RootAttachment attachments = 5;
  string account_id = 6;
  string acting_agent_id = 7;
  repeated EntityRef authorized_resources = 8;
  repeated ActionAvailability actions = 9;
  EntitlementRecord entitlement = 10;
  RootingTier rooting_tier = 11;
  // Generated pet name while agent-rooted and unclaimed; handle stays empty.
  string display_name = 12;
}
message EntitlementRecord {
  string plan = 1;
  uint64 storage_used_bytes = 2;
  uint64 storage_limit_bytes = 3;
  uint64 credit_balance = 4;
}
message SessionRecord {
  RecordRef ref = 1;
  bytes version = 2;
  EndpointRef endpoint = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool revoked = 5;
}
message DelegationRecord {
  RecordRef ref = 1;
  bytes version = 2;
  string label = 3;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_AGENT = 1;
    KIND_SERVICE = 2;
    KIND_DEVICE = 3;
  }
  Kind kind = 4;
  RootAttachment subject = 5;
  SignedRecord delegation = 6;
  bool revoked = 7;
  // Secret bearer material is never returned as an account-view record.
}
message SignupInvitation {
  RecordRef ref = 1;
  bytes version = 2;
  string bound_email = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool redeemed = 5;
  bool revoked = 6;
  string distribution_id = 7;
}
message InvitationQuota {
  string distribution_id = 1;
  uint32 remaining = 2;
}
message AuthenticationChallenge {
  RecordRef ref = 1;
  bytes challenge = 2;
  string relying_party_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated bytes allowed_credential_ids = 5;
  UserVerification user_verification = 6;
}
enum UserVerification {
  USER_VERIFICATION_UNSPECIFIED = 0;
  USER_VERIFICATION_REQUIRED = 1;
  USER_VERIFICATION_PREFERRED = 2;
  USER_VERIFICATION_DISCOURAGED = 3;
}
message PasskeyProof {
  bytes credential_id = 1;
  bytes client_data_json = 2;
  bytes authenticator_data = 3;
  bytes signature = 4;
  bytes attestation_object = 5;
  // Raw WebAuthn response.userHandle, bound to the credential's account.
  bytes user_handle = 6;
}
message BeginAuthenticationRequest {
  string account_hint = 1;
  // Existing device key whose possession CompleteAuthentication must prove.
  // The challenge records this key; sign-in never enrolls a new attachment.
  bytes caller_public_key = 2;
}
message CompleteAuthenticationRequest {
  string client_operation_id = 1;
  RecordRef challenge = 2;
  PasskeyProof passkey = 3;
  // Same key as BeginAuthentication. CallContext.request_proof signs the
  // exact completion request with this key, including the passkey assertion.
  bytes caller_public_key = 4;
}
message AuthenticationResponse {
  MutationReceipt receipt = 1;
  PrincipalRecord principal = 2;
  CredentialResult credential = 4;
}
// Returned only by a successful credential ceremony, never by an observation.
// Keyed clients retain their own minting authority. Registration attaches their
// proved key to an account/session; it does not mint a bearer or confer an
// independent human root on an agent. Keyless/server-rooted ceremonies can
// return an issued bearer. Account rooting tier and credential class differ.
message CredentialResult {
  oneof outcome {
    ClientOwnedCredential client_owned = 1;
    IssuedCredential issued = 2;
  }
  SessionRecord session = 3;
  // Original accepted owner proofs where established. An unclaimed agent has
  // no independent human-root bundle; absence does not upgrade its authority.
  OwnerAuthorizationBundle owner_authorization = 4;
}
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_DEVICE = 1;
  CREDENTIAL_KIND_AGENT = 2;
  CREDENTIAL_KIND_SERVICE = 3;
  CREDENTIAL_KIND_ANONYMOUS = 4;
}
message ClientOwnedCredential {
  RecordRef ref = 1;
  // Exact verified credential subject, distinct from the human account UUID.
  string subject = 2;
  bytes proof_public_key = 3;
  CredentialKind kind = 4;
}
message IssuedCredential {
  RecordRef ref = 1;
  // Raw serialized Biscuit bytes, not a base64 string. Secret bearer material.
  // No response ever contains an authority or proof private key.
  bytes biscuit = 2;
  // Effective Ed25519 PoP key. Required for agent/device credentials; absence
  // is permitted only for an explicitly bearer-only credential class.
  bytes proof_public_key = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Credential classification is independent of the account's rooting tier.
  // An agent credential stays attenuated after the human claims the account.
  CredentialKind kind = 5;
}
message BeginRegistrationRequest {
  // One Ed25519 device key for Biscuit authority and request possession.
  // Completion proves this exact key; an existing bearer selects the account
  // but never substitutes for the enrolling device's signature.
  bytes caller_public_key = 1;
  string handle = 2;
  string display_name = 3;
  // Signup uses one previously admitted reservation. With no admission, an
  // independently rooted bearer adds a device to its existing account, or a
  // claimable agent bearer claims its account under a new handle. Anonymous
  // signup preserves the anonymous account UUID. The challenge records which
  // ceremony was admitted; completion cannot switch ceremonies or accounts.
  oneof signup_admission {
    RecordRef invitation_reservation = 4;
    RecordRef verified_email = 5;
  }
}
message RegistrationChallenge {
  RecordRef ref = 1;
  bytes challenge = 2;
  string relying_party_id = 3;
  string relying_party_name = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Stable UUID fixed before clients sign owner-root records. WebAuthn user.id
  // is this string's UTF-8 encoding, including for anonymous promotion/claim.
  string account_id = 6;
  string handle = 7;
  string display_name = 8;
  UserVerification user_verification = 9;
  // The passkey creation uses attestation="none". A follow-up assertion by
  // that passkey proves its binding to caller_public_key using these bytes.
  // The independent CallContext signature proves possession of the device key.
  bytes device_binding_challenge = 10;
  // Exact 32-byte nonce for OwnerKeyBinding; no extra challenge RPC is needed.
  bytes owner_binding_nonce = 11;
}
message PasskeyRegistration {
  bytes credential_id = 1;
  bytes client_data_json = 2;
  bytes attestation_object = 3;
}
message OwnerRegistration {
  SignedOwnerRoot root = 1;
  AuthorizationSignature proof_of_possession = 2;
  OwnerKeyBinding binding = 3;
  // Omission selects the independent guardians in the signed root; it never
  // selects custodial recovery. Existing warning/consent rules still apply.
  RegistrationRecoveryPolicy recovery = 4;
}
message CompleteRegistrationRequest {
  string client_operation_id = 1;
  RecordRef challenge = 2;
  PasskeyRegistration passkey = 3;
  bytes caller_public_key = 4;
  PasskeyProof device_binding = 5;
  string device_label = 6;
  // New signup establishes an owner root. Claim preserves the original
  // deferred root and appends CLAIM_DEFERRED_HUMAN. Adding a passkey/device
  // does not implicitly replace an existing owner root or change rooting tier.
  oneof owner {
    OwnerRegistration establish_owner = 7;
    SignedOwnerKeyTransition claim_owner = 8;
  }
}
message RegisterRootAttachmentRequest {
  string client_operation_id = 1;
  RootAttachment attachment = 2;
  SignedRecord subject_possession = 3;
  string label = 4;
}
message RevokeDeviceRequest {
  string client_operation_id = 1;
  EndpointRef device = 2;
  SignedRecord revocation = 3;
}
message PutDelegationRequest {
  string client_operation_id = 1;
  DelegationRecord delegation = 2;
  bytes expected_version = 3;
}
message RevokeDelegationRequest {
  string client_operation_id = 1;
  RecordRef delegation = 2;
  SignedRecord revocation = 3;
  bytes expected_version = 4;
}
message RevokeSessionRequest {
  string client_operation_id = 1;
  RecordRef session = 2;
  bytes expected_version = 3;
}
message IntrospectCredentialRequest {
  bytes biscuit = 1;
}
message CredentialInspection {
  RootAttachment authority = 1;
  repeated ActionAvailability actions = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool revoked = 4;
}
message BeginPairingRequest {
  string client_operation_id = 1;
  EndpointRef device = 2;
  bytes subject_public_key = 3;
  SignedRecord subject_possession = 4;
}
message PairingRecord {
  RecordRef ref = 1;
  bytes version = 2;
  EndpointRef device = 3;
  bytes challenge = 4;
  RootAttachment approved_attachment = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool completed = 7;
}
message BeginPairingResponse {
  MutationReceipt receipt = 1;
  PairingRecord pairing = 2;
}
message ApprovePairingRequest {
  string client_operation_id = 1;
  RecordRef pairing = 2;
  RootAttachment attachment = 3;
  bytes expected_version = 4;
}
message CompletePairingRequest {
  string client_operation_id = 1;
  RecordRef pairing = 2;
  SignedRecord subject_possession = 3;
}
message ObservePairingRequest {
  RecordRef pairing = 1;
  ObserveOptions observe = 2;
}
message PairingEvent {
  StreamFrame frame = 1;
  oneof payload {
    PairingRecord pairing = 2;
    SectionStatus status = 3;
  }
}
message PutRecoveryPolicyRequest {
  string client_operation_id = 1;
  SignedRecord policy = 2;
  bytes expected_version = 3;
}
message BeginRecoveryRequest {
  string client_operation_id = 1;
  string account_id = 2;
  bytes proposed_root_public_key = 3;
  string method_id = 4;
}
message RecoveryAttempt {
  RecordRef ref = 1;
  bytes version = 2;
  bytes challenge = 3;
  google.protobuf.Timestamp eligible_at = 4;
  bool vetoed = 5;
  bool completed = 6;
  repeated Requirement requirements = 7;
}
message BeginRecoveryResponse {
  MutationReceipt receipt = 1;
  RecoveryAttempt recovery = 2;
}
message SubmitRecoveryProofRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  SignedRecord proof = 3;
}
message CompleteRecoveryRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  SignedRecord new_root_possession = 3;
  bytes expected_version = 4;
}
message VetoRecoveryRequest {
  string client_operation_id = 1;
  RecordRef recovery = 2;
  SignedRecord veto = 3;
}
message ResolveHandlesRequest {
  repeated string handles = 1;
  ReadBudget budget = 2;
}
message HandleResolution {
  string handle = 1;
  string principal_id = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    STATUS_CLAIMED = 2;
    STATUS_HELD = 3;
    STATUS_UNAVAILABLE = 4;
  }
  Status status = 3;
  repeated Requirement requirements = 4;
}
message ResolveHandlesResponse {
  repeated HandleResolution handles = 1;
}
message ClaimHandleRequest {
  string client_operation_id = 1;
  string handle = 2;
  SignedRecord entitlement_proof = 3;
}
message CreateSignupInvitationRequest {
  string client_operation_id = 1;
  SignupInvitation invitation = 2;
}
message CreateSignupInvitationResponse {
  MutationReceipt receipt = 1;
  SignupInvitation invitation = 2;
  bytes redemption_secret = 3;
}
message RedeemSignupInvitationRequest {
  string client_operation_id = 1;
  RecordRef invitation = 2;
  bytes redemption_secret = 3;
  RootAttachment principal = 4;
}
message BeginEmailVerificationRequest {
  string client_operation_id = 1;
  string email = 2;
  RecordRef invitation = 3;
}
message EmailVerificationChallenge {
  MutationReceipt receipt = 1;
  RecordRef challenge = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message CompleteEmailVerificationRequest {
  string client_operation_id = 1;
  RecordRef challenge = 2;
  bytes proof = 3;
}

// Invite-gated creation of an unclaimed human account. The independent root
// slot stays empty. The agent proves its own key over this exact request using
// principal:device-key:<lowercase-hex-agent-public-key>; a human bearer cannot
// replace that proof. Existing key-bound accounts may be reused without an
// invitation. Reusing an operation ID with different bytes is rejected.
message ProvisionAccountRequest {
  string client_operation_id = 1;
  bytes invitation_secret = 2;
  bytes agent_public_key = 3;
}
message ProvisionAccountResponse {
  MutationReceipt receipt = 1;
  PrincipalRecord principal = 2;
  // Client-owned AGENT registration bound to the proved key, preserving the
  // server-enforced agent ceiling. Claiming the human account does not upgrade
  // this credential. A server-minted bearer is not required for keyed agents.
  CredentialResult credential = 3;
  // Authoritative browser origin for the agent's locally generated claim link.
  // The claim secret and its private state remain on the agent's device.
  string claim_web_origin = 4;
}

// Anonymous continuity has no human account and no independent owner root.
// The endpoint retains its existing anti-abuse, expiry and rotation checks.
message CreateAnonymousSessionRequest {
  string client_operation_id = 1;
  bytes continuity_secret = 2;
  string abuse_challenge_proof = 3;
}
message AnonymousSessionResponse {
  MutationReceipt receipt = 1;
  string anonymous_id = 2;
  IssuedCredential credential = 3;
  // Rotate after successful use; useful only for this ceremony, never as a
  // normal RPC bearer. Store separately from the short-lived Biscuit.
  bytes continuity_secret = 4;
  google.protobuf.Timestamp continuity_expires_at = 5;
}

// Creating/updating a delegation record and issuing a credential are different
// effects. The caller must prove the active delegation authority; the new key
// must prove possession. Scope/expiry cannot exceed the accepted delegation.
message IssueDelegationCredentialRequest {
  string client_operation_id = 1;
  RecordRef delegation = 2;
  bytes proof_public_key = 3;
  SignedRecord authority_proof = 4;
  // Canonical credential scope grammar, checked against the parent's ceiling.
  string scope = 5;
  // Omission requests no expiry only where the parent and server policy allow.
  google.protobuf.Timestamp expires_at = 6;
  bytes expected_delegation_version = 7;
  // Proof by proof_public_key over the credential request's canonical unsigned
  // statement. Both in-body proofs bind delegation, requested scope/expiry,
  // expected version and operation ID; neither can be replayed for another key.
  // CallContext independently authenticates and signs the complete request.
  SignedRecord subject_possession = 8;
}
message DelegationCredentialResponse {
  MutationReceipt receipt = 1;
  CredentialResult credential = 2;
}

message ResolveSignupInvitationRequest {
  bytes redemption_secret = 1;
}
message SignupInvitationResolution {
  RecordRef invitation = 1;
  Coverage availability = 2;
  repeated Requirement requirements = 3;
  // Return only invitation information permitted to the presented capability.
}
