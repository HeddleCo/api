syntax = "proto3";

package heddle.api.v2alpha1;

import "google/protobuf/timestamp.proto";
import "heddle/api/v2alpha1/stream.proto";
import "heddle/api/v2alpha1/sync.proto";

// Trusted issuer-to-provider control-plane registration. Never sent over the
// client Fetch stream. object_key names a private provider bucket object and
// must not appear in a client-visible ProviderPlan or ReadProviderExtent.
message ProviderPackLocation {
  bytes pack_id = 1;
  string object_key = 2;
}

message ProviderPlanRegistration {
  ProviderPlan plan = 1;
  repeated ProviderPackLocation packs = 2;
  // The receiving DO checks this key against its live Iroh endpoint identity.
  EndpointRef serving_provider = 3;
}

message ProviderPlanRegistrationReceipt {
  bytes assembly_digest = 1;
  google.protobuf.Timestamp expires_at = 2;
}
