syntax = "proto3";

package heddle.api.v2alpha1;

import "heddle/api/v1alpha1/repository.proto";
import "heddle/api/v2alpha1/activity.proto";
import "heddle/api/v2alpha1/administration.proto";
import "heddle/api/v2alpha1/analysis.proto";
import "heddle/api/v2alpha1/collaboration.proto";
import "heddle/api/v2alpha1/common.proto";
import "heddle/api/v2alpha1/device.proto";
import "heddle/api/v2alpha1/identity.proto";
import "heddle/api/v2alpha1/owner_records.proto";
import "heddle/api/v2alpha1/ownership.proto";
import "heddle/api/v2alpha1/stream.proto";
import "heddle/api/v2alpha1/sync.proto";
import "heddle/api/v2alpha1/thread.proto";

message ObserveThreadRequest {
  ThreadRef thread = 1;
  repeated ThreadSection sections = 2;
  // Optional exact compared revisions; omitting them resolves once in the
  // snapshot and returns the resolved IDs in the overview/review records.
  RevisionRef source = 3;
  RevisionRef base = 4;
  PageRequest page = 5;
  ObserveOptions observe = 6;
}

// One typed stream composes a Thread's decision context. Common frame controls
// have no payload. Every data frame carries exactly one payload; snapshots and
// delta batches become visible only at their checkpoint.
// SectionReplacement.section and SectionStatus.section use these exact keys:
// overview (overview); captures (capture); review (review, diff, evidence);
// collaboration (discussion, turn, context); analysis (analysis); checkouts
// (checkout); timeline (timeline_event, run, operation); sharing (sharing,
// publication). Replacement clears only that section's committed collection.
// Unknown section semantics require a fresh supported view, never silent loss.
message ThreadEvent {
  StreamFrame frame = 1;
  oneof payload {
    ThreadOverview overview = 2;
    CaptureSummary capture = 3;
    DiscussionRecord discussion = 4;
    DiscussionTurn turn = 5;
    ContextRecord context = 6;
    ReviewDecision review = 7;
    CheckoutOverview checkout = 8;
    AnalysisRecord analysis = 9;
    ThreadSharingPolicy sharing = 10;
    SectionStatus status = 11;
    Removal removal = 12;
    heddle.api.v1alpha1.FileDiff diff = 13;
    EvidenceRecord evidence = 14;
    OperationRecord operation = 15;
    RunRecord run = 16;
    TimelineRecord timeline_event = 17;
    PublicationReceipt publication = 18;
    SectionReplacement replace_section = 19;
  }
}

message SpoolOverview {
  SpoolRef ref = 1;
  SpoolRef parent = 2;
  string name = 3;
  bytes version = 4;
  Audience audience = 5;
  SpoolSettings settings = 6;
  repeated ActionAvailability actions = 7;
  repeated SectionStatus sections = 8;
  string slug = 9;
  SignedSpoolOwnerGenesis owner_genesis = 10;
}

// Committed overview and independently verifiable owner history seed the
// caller's view directly. The receipt is not a trust root or a TOFU pin.
message SpoolMutationResponse {
  MutationReceipt receipt = 1;
  SpoolOverview spool = 2;
  // Creation returns the root and accepted transitions proving its current
  // signing key. The caller constructs its own local pin after verification.
  OwnerState ownership = 3;
}

enum SpoolSection {
  SPOOL_SECTION_UNSPECIFIED = 0;
  SPOOL_SECTION_OVERVIEW = 1;
  SPOOL_SECTION_THREADS = 2;
  SPOOL_SECTION_MEMBERS = 3;
  SPOOL_SECTION_INVITATIONS = 4;
  SPOOL_SECTION_GRANTS = 5;
  SPOOL_SECTION_POLICIES = 6;
  SPOOL_SECTION_CONTEXT = 7;
  SPOOL_SECTION_OPERATIONS = 8;
  SPOOL_SECTION_CHILDREN = 9;
  SPOOL_SECTION_SUPPORT_ACCESS = 10;
}

message ObserveSpoolRequest {
  SpoolRef spool = 1;
  repeated SpoolSection sections = 2;
  ThreadQuery threads = 3;
  PageRequest page = 4;
  ObserveOptions observe = 5;
  // Each requested administration section is independently authorized and
  // paginated. SectionStatus distinguishes not requested from unavailable.
}

message SpoolEvent {
  StreamFrame frame = 1;
  oneof payload {
    SpoolOverview spool = 2;
    ThreadOverview thread = 3;
    MemberRecord member = 4;
    InvitationRecord invitation = 5;
    GrantRecord grant = 6;
    ReviewPolicyRecord policy = 7;
    ApprovalGroupRecord approval_group = 8;
    ContextRecord context = 9;
    OperationRecord operation = 10;
    SectionStatus status = 11;
    Removal removal = 12;
    SectionReplacement replace_section = 13;
    SpoolMount mount = 14;
    SupportAccessRecord support_access = 15;
  }
}

message ObserveWorkspaceRequest {
  ThreadQuery threads = 1;
  PageRequest page = 2;
  ObserveOptions observe = 3;
  bool include_attention = 4;
  bool include_operations = 5;
  bool include_devices = 6;
  bool include_bookmarks = 7;
}

message WorkspaceEvent {
  StreamFrame frame = 1;
  oneof payload {
    SpoolOverview spool = 2;
    ThreadOverview thread = 3;
    AttentionItem attention = 4;
    OperationRecord operation = 5;
    EndpointRef device = 6;
    SectionStatus status = 7;
    Removal removal = 8;
    SectionReplacement replace_section = 9;
    BookmarkRecord bookmark = 10;
  }
}

message ObserveAttentionRequest {
  repeated SpoolRef spools = 1;
  string principal_id = 2;
  PageRequest page = 3;
  ObserveOptions observe = 4;
}

message AttentionEvent {
  StreamFrame frame = 1;
  oneof payload {
    AttentionItem item = 2;
    Removal removal = 3;
  }
}

message ObserveNotificationsRequest {
  bool unread_only = 1;
  bool include_preferences = 4;
  PageRequest page = 2;
  ObserveOptions observe = 3;
}

message NotificationEvent {
  StreamFrame frame = 1;
  oneof payload {
    NotificationRecord notification = 2;
    NotificationPreferences preferences = 4;
    SectionStatus status = 5;
    Removal removal = 3;
  }
}

message ObserveIdentityRequest {
  // The principal is always included. Message presence requests a collection;
  // an empty PageRequest selects its bounded first page. Each collection has
  // its own SectionStatus.page; no global page token selects a hidden section.
  PageRequest devices = 1;
  PageRequest sessions = 2;
  PageRequest signup_invitations = 3;
  PageRequest delegations = 4;
  PageRequest recovery = 5;
  ObserveOptions observe = 6;
  // The shared read budget covers all requested sections together. A session
  // reference/version from this view can be used directly for RevokeSession.
}

message IdentityEvent {
  StreamFrame frame = 1;
  oneof payload {
    PrincipalRecord identity = 2;
    SectionStatus status = 3;
    SessionRecord session = 4;
    SignupInvitation signup_invitation = 5;
    DeviceIdentity device = 6;
    Removal removal = 7;
    SectionReplacement replace_section = 8;
    DelegationRecord delegation = 9;
    RecoveryAttempt recovery = 10;
    InvitationQuota invitation_quota = 11;
  }
}

message DeviceIdentity {
  EndpointRef endpoint = 1;
  bytes signing_public_key = 2;
  string label = 3;
  bool revoked = 4;
  // Root attachment verification is independent of Weft account association.
  bytes root_attachment_hash = 5;
}

message ObserveOperationsRequest {
  repeated SpoolRef spools = 1;
  repeated RecordRef operations = 2;
  // Recover ambiguous outcomes without submitting a second mutation. Search is
  // confined to the authenticated caller's declared operation-ID namespace.
  repeated string client_operation_ids = 3;
  PageRequest page = 4;
  ObserveOptions observe = 5;
}

message OperationEvent {
  StreamFrame frame = 1;
  oneof payload {
    OperationRecord operation = 2;
    Removal removal = 3;
  }
}

message CancelOperationRequest {
  string client_operation_id = 1;
  RecordRef operation = 2;
  bytes expected_version = 3;
  // Request acknowledgement is not proof of cancellation or rollback.
}
