[package]
name = "custodial-recovery-verifier-conformance"
version = "0.0.0"
edition = "2024"
publish = false

[[test]]
name = "conformance"
path = "conformance.rs"

[dev-dependencies]
heddleco-capability-verifier = "=0.28.6"
# The released verifier pins this exact published heddle-api; its types stay isolated
# from the contract crate under test, which moves with every release.
native-api = { package = "heddle-api", version = "=0.31.0-alpha.18" }
contract = { package = "heddle-api", path = "../.." }
prost = "=0.14.1"
serde_json = "=1.0.149"
hex = "=0.4.3"
ed25519-dalek = "=3.0.0"

[workspace]
