[package]
name = "hybrid-native-conformance"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "hybrid-native-conformance"

[[bin]]
name = "generate-hybrid-native-biscuit"
path = "../generate-hybrid-native-biscuit.rs"

# Newest compatible published native pair; isolated from the API's release graph.
[dependencies]
anyhow = "=1.0.102"
contract = { package = "heddle-api", path = "../.." }
native-api = { package = "heddle-api", version = "=0.31.0-alpha.18" }
thread-api = { package = "heddle-thread-api", version = "=0.28.6", default-features = false, features = ["replication", "root-attachment"] }
capability-verifier = { package = "heddleco-capability-verifier", version = "=0.28.6" }
heddle-biscuit-verifier = "=0.28.6"
biscuit-auth = "=6.0.0"
objects = { package = "heddle-object-model", version = "=0.28.6" }
crypto = { package = "heddle-crypto", version = "=0.28.6" }
hex = "=0.4.3"
prost = "=0.14.1"
rmp-serde = "=1.3.1"
serde_json = "=1.0.149"
